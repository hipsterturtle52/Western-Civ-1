77.0,"label":"1077","text":"Henry IV submits to Gregory VII at <strong>Canossa<\/strong>","key":true},{"y":1086.0,"label":"1086","text":"Domesday Book","key":false},{"y":1095.0,"label":"1095","text":"<strong>Urban II<\/strong> calls the First Crusade at Clermont","key":true},{"y":1099.0,"label":"1099","text":"Crusaders capture <strong>Jerusalem<\/strong>","key":true},{"y":1122.0,"label":"1122","text":"<strong>Concordat of Worms<\/strong> ends Investiture Controversy","key":true},{"y":1140.0,"label":"c. 1140s","text":"Abbot Suger's Saint-Denis: first Gothic church","key":false},{"y":1170.0,"label":"1170","text":"Thomas Becket murdered","key":false},{"y":1176.0,"label":"1176","text":"Lombard League defeats Barbarossa at Legnano","key":false},{"y":1187.0,"label":"1187","text":"<strong>Saladin<\/strong> retakes Jerusalem; Third Crusade follows","key":true},{"y":1204.0,"label":"1204","text":"<strong>Fourth Crusade sacks Constantinople<\/strong>; France takes Normandy","key":true},{"y":1209.0,"label":"1209","text":"Albigensian Crusade; Francis of Assisi's order approved","key":false},{"y":1215.0,"label":"1215","text":"<strong>Magna Carta<\/strong>; Fourth Lateran Council","key":true},{"y":1265.0,"label":"c. 1265–1274","text":"Aquinas writes the <em>Summa Theologica<\/em>","key":false},{"y":1295.0,"label":"1295","text":"Edward I's Model Parliament","key":false},{"y":1302.0,"label":"1302","text":"<em>Unam Sanctam<\/em>; first Estates-General in France","key":true},{"y":1309.0,"label":"1309–1377","text":"<strong>Avignon papacy<\/strong> (\"Babylonian Captivity\")","key":true},{"y":1315.0,"label":"1315–1317","text":"Great Famine","key":false},{"y":1337.0,"label":"1337–1453","text":"<strong>Hundred Years' War<\/strong>","key":true},{"y":1346.0,"label":"1346","text":"Crécy: English longbows defeat French knights","key":false},{"y":1347.0,"label":"1347–1351","text":"<strong>Black Death<\/strong> kills about one-third of Europe","key":true},{"y":1356.0,"label":"1356","text":"Golden Bull: seven electors choose the emperor","key":false},{"y":1358.0,"label":"1358","text":"Jacquerie peasant revolt in France","key":false},{"y":1378.0,"label":"1378–1417","text":"<strong>Great Western Schism<\/strong> (rival popes)","key":true},{"y":1381.0,"label":"1381","text":"English Peasants' Revolt","key":false},{"y":1414.0,"label":"1414–1418","text":"Council of Constance; Jan Hus burned (1415)","key":false},{"y":1429.0,"label":"1429","text":"Joan of Arc lifts the siege of Orléans","key":false},{"y":1453.0,"label":"1453","text":"Ottomans take <strong>Constantinople<\/strong>; Hundred Years' War ends","key":true}],"people":[{"name":"Gregory VII","desc":"Reform pope; Investiture Controversy; Canossa (1077)","key":true},{"name":"Henry IV","desc":"German emperor humbled at Canossa","key":false},{"name":"Innocent III","desc":"Height of papal power; Fourth Lateran Council (1215)","key":true},{"name":"Urban II","desc":"Launched the First Crusade (1095)","key":true},{"name":"Saladin","desc":"Muslim sultan who retook Jerusalem (1187)","key":false},{"name":"Francis of Assisi","desc":"Founder of the Franciscans; radical poverty","key":false},{"name":"William the Conqueror","desc":"Won at Hastings (1066); Domesday Book","key":false},{"name":"Henry II","desc":"English common law, juries; clash with Becket","key":false},{"name":"King John","desc":"Lost Normandy; forced to sign Magna Carta (1215)","key":true},{"name":"Philip IV","desc":"French king; Estates-General; clash with Boniface VIII","key":false},{"name":"Thomas Aquinas","desc":"<em>Summa Theologica<\/em>; faith and reason united","key":true},{"name":"Dante / Chaucer","desc":"<em>Divine Comedy<\/em> (Italian) / <em>Canterbury Tales<\/em> (English)","key":false},{"name":"Joan of Arc","desc":"Lifted siege of Orléans (1429); burned 1431","key":true},{"name":"John Wycliffe / Jan Hus","desc":"Pre-Reformation critics of the papacy","key":true}],"cards":[{"id":"hma-c1","f":"Charter (town)","b":"Document from a lord or king granting a town self-government and freedoms."},{"id":"hma-c2","f":"Guilds","b":"Associations of merchants or craftsmen regulating prices, quality, and training (apprentice → journeyman → master)."},{"id":"hma-c3","f":"Hanseatic League","b":"Alliance of north German trading towns dominating Baltic and North Sea commerce."},{"id":"hma-c4","f":"Simony","b":"The buying and selling of church offices."},{"id":"hma-c5","f":"Investiture Controversy","b":"Conflict over whether popes or kings appoint bishops; Canossa (1077); Concordat of Worms (1122)."},{"id":"hma-c6","f":"Concordat of Worms","b":"1122 compromise: the Church invests bishops with spiritual authority; the emperor grants their lands."},{"id":"hma-c7","f":"Innocent III","b":"Pope (1198–1216) at the height of papal power; interdict on England; Fourth Lateran Council."},{"id":"hma-c8","f":"Interdict","b":"Papal penalty suspending church services and sacraments in an entire region."},{"id":"hma-c9","f":"Mendicant orders","b":"Begging friars who worked in towns: Franciscans (poverty) and Dominicans (preaching, fighting heresy)."},{"id":"hma-c10","f":"First Crusade","b":"Called by Urban II at Clermont (1095); captured Jerusalem (1099); founded crusader states."},{"id":"hma-c11","f":"Fourth Crusade","b":"Diverted by Venice; sacked Christian Constantinople (1204)."},{"id":"hma-c12","f":"Saladin","b":"Muslim sultan who recaptured Jerusalem in 1187, prompting the Third Crusade."},{"id":"hma-c13","f":"Domesday Book","b":"William the Conqueror's 1086 survey of English landholding for taxation."},{"id":"hma-c14","f":"Common law","b":"English law based on royal court decisions and precedent, common to the whole kingdom (Henry II)."},{"id":"hma-c15","f":"Magna Carta","b":"1215 charter barons forced on King John: king subject to law; no taxes without council's consent; lawful judgment."},{"id":"hma-c16","f":"Model Parliament","b":"Edward I's 1295 Parliament including nobles, clergy, and commoners from towns and shires."},{"id":"hma-c17","f":"Estates-General","b":"French assembly of clergy, nobles, and townspeople, first called by Philip IV in 1302."},{"id":"hma-c18","f":"Scholasticism","b":"Medieval method using reason and Aristotle's logic to explain and defend Christian faith."},{"id":"hma-c19","f":"Summa Theologica","b":"Thomas Aquinas' synthesis of Aristotle and Christian theology; faith and reason agree."},{"id":"hma-c20","f":"Gothic architecture","b":"Pointed arches, ribbed vaults, flying buttresses, stained glass; began at Saint-Denis (1140s)."},{"id":"hma-c21","f":"Black Death","b":"Bubonic plague, 1347–1351; killed about a third of Europe; led to labor shortages and higher wages."},{"id":"hma-c22","f":"Hundred Years' War","b":"England vs. France, 1337–1453; longbow victories; Joan of Arc; France wins."},{"id":"hma-c23","f":"Avignon papacy","b":"Popes resided in Avignon under French influence, 1309–1377 (\"Babylonian Captivity\" of the Church)."},{"id":"hma-c24","f":"Great Western Schism","b":"1378–1417: two, then three, rival popes; ended by the Council of Constance."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>England<\/th><th>France<\/th><th>Holy Roman Empire<\/th><\/tr><\/thead><tbody><tr><td>Founding moment<\/td><td>Norman Conquest, 1066<\/td><td>Hugh Capet, 987<\/td><td>Otto I crowned, 962<\/td><\/tr><tr><td>Key kings<\/td><td>William I, Henry II, John, Edward I<\/td><td>Philip II, Louis IX, Philip IV<\/td><td>Henry IV, Frederick Barbarossa<\/td><\/tr><tr><td>Limits on king<\/td><td>Magna Carta (1215), Parliament<\/td><td>Estates-General (rarely binding)<\/td><td>Powerful princes, electors, popes<\/td><\/tr><tr><td>Outcome by 1450<\/td><td>Centralized law, but king shares power with Parliament<\/td><td>Strong, centralizing monarchy<\/td><td>Fragmented into many states<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"rr","title":"Renaissance & Reformation","topic":"rr","share":16.0,"quizN":14,"examN":19,"diagN":5,"cardTarget":29,"lessonMin":12,"studyHours":2.5,"intro":"Roughly 1350–1565: Italian humanism and art, the printing press and northern Christian humanism, kings building \"new monarchies,\" and the split of Western Christianity into Protestant and reformed Catholic churches. Worth 13–17%.","lesson":"<h3>1. Why the Renaissance began in Italy<\/h3>\n<p>\"Renaissance\" means <strong>rebirth<\/strong>, meaning the rebirth of interest in the art and learning of <strong>classical Greece and Rome<\/strong>. It began in northern Italy around <strong>1350<\/strong> and spread north after about 1450.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Italian city-states grow rich from Mediterranean <strong>trade and banking<\/strong>; Roman ruins all around; Greek scholars arrive from Byzantium (especially after <strong>1453<\/strong>)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Wealthy merchants, princes, and popes become <strong>patrons<\/strong>, spending on scholars, artists, and buildings to win prestige<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>A burst of classical learning and art centered in <strong>Florence<\/strong>, then Rome and Venice<\/div><\/div>\n<p><strong>Italian politics:<\/strong> no unified kingdom. Five major powers: <strong>Florence<\/strong> (a republic dominated by the <strong>Medici<\/strong> banking family: Cosimo and <strong>Lorenzo \"the Magnificent\"<\/strong>), <strong>Venice<\/strong> (a merchant republic led by an elected doge), <strong>Milan<\/strong> (dukes, the Sforza), the <strong>Papal States<\/strong>, and the <strong>Kingdom of Naples<\/strong>. The <strong>Peace of Lodi (1454)<\/strong> created a <strong>balance of power<\/strong> among them, and Italians developed modern <strong>diplomacy<\/strong> with permanent ambassadors. The balance broke when <strong>France invaded in 1494<\/strong>, beginning decades of <strong>Italian Wars<\/strong>. In Florence, the fiery Dominican friar <strong>Savonarola<\/strong> briefly ruled (1494–1498), burned luxuries in the \"bonfire of the vanities,\" and was himself burned. In <strong>1527<\/strong>, mutinous troops of Emperor <strong>Charles V<\/strong> <strong>sacked Rome<\/strong>.<\/p>\n<h3>2. Humanism<\/h3>\n<p><strong>Humanism<\/strong> was an educational and intellectual movement: the study of the classics, the <strong><em>studia humanitatis<\/strong><\/em> (grammar, rhetoric, poetry, history, moral philosophy), to produce eloquent, virtuous, active citizens. Humanists were <strong>not anti-religious<\/strong>, but they focused on <strong>human potential and achievement in this world<\/strong> (<strong>secularism<\/strong>) and celebrated <strong>individualism<\/strong>.<\/p>\n<ul><li><strong>Petrarch<\/strong> (1304–1374), the \"<strong>father of humanism<\/strong>\": hunted down lost classical manuscripts, wrote letters to the long-dead Cicero, wrote sonnets in Italian, and called the centuries after Rome a \"dark\" age.<\/li><li><strong>Boccaccio:<\/strong> the <strong><em>Decameron<\/strong><\/em>, worldly tales told by people fleeing the Black Death.<\/li><li><strong>Civic humanism<\/strong> (Leonardo <strong>Bruni<\/strong>, Florence): classical learning should serve active public life in a republic.<\/li><li><strong>Lorenzo Valla<\/strong> used <strong>textual analysis (philology)<\/strong> to prove that the <strong>Donation of Constantine<\/strong>, a document supporting papal claims to rule the West, was a <strong>forgery<\/strong> (1440).<\/li><li><strong>Marsilio Ficino<\/strong> led the <strong>Platonic Academy<\/strong> in Florence and translated Plato.<\/li><li><strong>Pico della Mirandola<\/strong>, <strong><em>Oration on the Dignity of Man<\/strong><\/em> (1486): humans have free will to shape themselves, rising toward angels or sinking toward beasts.<\/li><li><strong>Baldassare Castiglione<\/strong>, <strong><em>The Book of the Courtier<\/strong><\/em> (1528): the ideal gentleman is skilled in arms, letters, music, and conversation, all done with effortless grace (<em>sprezzatura<\/em>): the \"<strong>Renaissance man<\/strong>.\"<\/li><li><strong>Niccolò Machiavelli<\/strong>, <strong><em>The Prince<\/strong><\/em> (1513): a ruler must be guided by <strong>political realism<\/strong>, not Christian morality; \"it is <strong>safer to be feared than loved<\/strong>\"; a prince must sometimes do evil to preserve the state. Machiavelli is called the father of modern <strong>political science<\/strong>.<\/li><\/ul>\n<p>Educated elite women could gain humanist learning, and some were major patrons (<strong>Isabella d'Este<\/strong>), but most women's legal and social position did not improve.<\/p>\n<h3>3. Renaissance art<\/h3>\n<p>Renaissance art featured <strong>realism<\/strong>, <strong>classical themes and forms<\/strong>, <strong>individual portraits<\/strong>, and new techniques: <strong>linear perspective<\/strong> (a vanishing point creating depth), <strong>chiaroscuro<\/strong> (light and shadow), and <strong>oil paint<\/strong>.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Artist<\/th><th>Known for<\/th><\/tr><\/thead><tbody><tr><td><strong>Giotto<\/strong> (c. 1300)<\/td><td>Forerunner: natural, emotional figures<\/td><\/tr><tr><td><strong>Brunelleschi<\/strong><\/td><td>Worked out <strong>linear perspective<\/strong>; built the great <strong>dome of Florence Cathedral<\/strong><\/td><\/tr><tr><td><strong>Masaccio<\/strong><\/td><td>First painter to use perspective systematically (<em>Holy Trinity<\/em>)<\/td><\/tr><tr><td><strong>Donatello<\/strong><\/td><td>Bronze <strong><em>David<\/strong><\/em>: first freestanding nude statue since antiquity<\/td><\/tr><tr><td><strong>Botticelli<\/strong><\/td><td><strong><em>Birth of Venus<\/strong><\/em>: classical mythology for Medici patrons<\/td><\/tr><tr><td><strong>Leonardo da Vinci<\/strong><\/td><td><strong><em>Last Supper<\/strong><\/em>, <strong><em>Mona Lisa<\/strong><\/em>, notebooks of anatomy and inventions: the ultimate \"Renaissance man\"<\/td><\/tr><tr><td><strong>Michelangelo<\/strong><\/td><td>Marble <strong><em>David<\/strong><\/em>, <strong>Sistine Chapel ceiling<\/strong> (for Pope Julius II), dome of St. Peter's<\/td><\/tr><tr><td><strong>Raphael<\/strong><\/td><td><strong><em>School of Athens<\/strong><\/em> (Plato and Aristotle at the center); Madonnas<\/td><\/tr><tr><td><strong>Titian<\/strong><\/td><td>Venetian master of rich color<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The <strong>High Renaissance<\/strong> (c. 1490–1527) centered on <strong>Rome<\/strong>, where popes such as <strong>Julius II<\/strong> and <strong>Leo X<\/strong> (a Medici) commissioned masterpieces and rebuilt <strong>St. Peter's Basilica<\/strong>.<\/p>\n<h3>4. The Northern Renaissance and the printing press<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Johannes Gutenberg<\/strong> of Mainz develops <strong>movable metal type<\/strong> (c. 1450); the <strong>Gutenberg Bible<\/strong> appears c. 1455<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Books become cheap and plentiful; by 1500 millions have been printed across Europe<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Literacy<\/strong> spreads, scholarship becomes standardized, and new ideas (including Luther's) <strong>spread faster than authorities can suppress them<\/strong><\/div><\/div>\n<p>Northern humanists, the <strong>Christian humanists<\/strong>, used humanist scholarship to <strong>reform Christianity<\/strong> by returning to its original sources (<em>ad fontes<\/em>: the Bible and early Church Fathers in their original languages).<\/p>\n<ul><li><strong>Desiderius Erasmus<\/strong> (Dutch): <strong><em>In Praise of Folly<\/strong><\/em> (1509) satirized corrupt clergy, empty rituals, and superstition; published an accurate <strong>Greek New Testament<\/strong> (1516). He wanted <strong>reform from within<\/strong> and never left the Catholic Church. Contemporaries said \"<strong>Erasmus laid the egg that Luther hatched<\/strong>.\"<\/li><li><strong>Thomas More<\/strong> (England): <strong><em>Utopia<\/strong><\/em> (1516), an imaginary island society with common property, criticizing European greed and injustice. He was <strong>executed in 1535<\/strong> for refusing to accept Henry VIII as head of the English Church.<\/li><li><strong>François Rabelais<\/strong> (France): bawdy satire in <em>Gargantua and Pantagruel<\/em>.<\/li><\/ul>\n<p><strong>Northern art<\/strong> emphasized <strong>detailed realism<\/strong>, everyday life, and religious devotion, often in <strong>oil paint<\/strong> (perfected by Flemish painters):<\/p>\n<ul><li><strong>Jan van Eyck:<\/strong> oil-painting pioneer; <strong><em>Arnolfini Portrait<\/strong><\/em> (intense detail).<\/li><li><strong>Albrecht Dürer<\/strong> (Germany): brought Italian techniques north; famous <strong>woodcuts and engravings<\/strong>.<\/li><li><strong>Hans Holbein the Younger:<\/strong> portraits of <strong>Henry VIII<\/strong> and Thomas More.<\/li><li><strong>Pieter Bruegel the Elder:<\/strong> scenes of <strong>peasant life<\/strong> (<em>Peasant Wedding<\/em>).<\/li><\/ul>\n<h3>5. The New Monarchies (c. 1450–1550)<\/h3>\n<p>After the chaos of the 1300s, kings in Western Europe built stronger, more centralized states. Common methods: <strong>standing armies<\/strong> (paid troops with cannon, which could knock down nobles' castles), <strong>new taxes<\/strong>, royal courts and <strong>middle-class officials<\/strong> loyal to the crown, curbing the great nobles, and <strong>controlling the Church in their lands<\/strong>.<\/p>\n<ul><li><strong>France:<\/strong> <strong>Louis XI<\/strong> (\"the Spider King,\" 1461–1483) expanded royal territory and taxes after the Hundred Years' War. <strong>Francis I<\/strong>'s <strong>Concordat of Bologna (1516)<\/strong> let the king <strong>appoint French bishops and abbots<\/strong>, giving him control of the French Church without breaking with Rome.<\/li><li><strong>England:<\/strong> <strong>Henry VII<\/strong>, first <strong>Tudor<\/strong> king, won the <strong>Battle of Bosworth (1485)<\/strong>, ending the <strong>Wars of the Roses<\/strong>. He tamed the nobles (the <strong>Court of Star Chamber<\/strong> tried powerful men without juries), filled the treasury, and avoided costly wars.<\/li><li><strong>Spain:<\/strong> the marriage of <strong>Ferdinand of Aragon and Isabella of Castile (1469)<\/strong> joined Spain's two largest kingdoms. In <strong>1492<\/strong> they conquered <strong>Granada<\/strong>, completing the <strong>Reconquista<\/strong>, <strong>expelled the Jews<\/strong> (Muslims were forced to convert or leave soon after), and sponsored <strong>Columbus<\/strong>. The <strong>Spanish Inquisition (1478)<\/strong>, controlled by the crown, enforced religious unity.<\/li><li><strong>Holy Roman Empire:<\/strong> the <strong>Habsburgs<\/strong> grew through <strong>marriage alliances<\/strong> rather than central government. Their heir <strong>Charles V<\/strong> inherited <strong>Spain<\/strong>, its American empire, Naples, the <strong>Netherlands<\/strong>, and <strong>Austria<\/strong>, and was elected emperor in <strong>1519<\/strong>: the most powerful ruler in Europe, but the German princes stayed largely independent.<\/li><\/ul>\n<h3>6. The Protestant Reformation<\/h3>\n<p><strong>Long-term causes:<\/strong><\/p>\n<ul><li><strong>Church abuses:<\/strong> <strong>simony<\/strong>, <strong>pluralism<\/strong> (one man holding several church offices), <strong>absenteeism<\/strong> (not living in one's diocese), <strong>nepotism<\/strong>, and poorly educated priests.<\/li><li><strong>Worldly Renaissance popes:<\/strong> Alexander VI (Borgia), the warrior pope Julius II, and Leo X spent lavishly.<\/li><li><strong>Indulgences:<\/strong> remissions of punishment for sin, increasingly <strong>sold<\/strong> for cash.<\/li><li><strong>Humanist criticism<\/strong> and Bible study (Erasmus), the <strong>printing press<\/strong>, the earlier movements of <strong>Wycliffe and Hus<\/strong>.<\/li><li><strong>Political:<\/strong> princes and kings resented papal taxes and wanted control of Church lands and offices; growing <strong>national feeling<\/strong>, especially in Germany.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>To fund the rebuilding of <strong>St. Peter's<\/strong>, the friar <strong>Johann Tetzel<\/strong> sells indulgences in Germany (\"As soon as the coin in the coffer rings, the soul from purgatory springs\")<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Martin Luther<\/strong>, a monk and professor at <strong>Wittenberg<\/strong>, posts the <strong>Ninety-Five Theses<\/strong> (October 31, <strong>1517<\/strong>) challenging indulgences<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Printed copies spread across Germany in weeks; a theological debate becomes a revolt against Rome<\/div><\/div>\n<h4>Martin Luther (1483–1546)<\/h4>\n<p>Luther's key teachings:<\/p>\n<ul><li><strong>Justification by faith alone (<em>sola fide<\/em>):<\/strong> salvation comes only through faith, a free gift of God's grace, <strong>not by good works<\/strong> or buying indulgences.<\/li><li><strong>Scripture alone (<em>sola scriptura<\/em>):<\/strong> the <strong>Bible<\/strong> is the only authority, not popes or councils.<\/li><li><strong>Priesthood of all believers:<\/strong> all Christians have direct access to God; clergy are not a separate holy class and <strong>may marry<\/strong>. (Luther married a former nun, Katharina von Bora.)<\/li><li>Only <strong>two sacraments<\/strong> (baptism and the Eucharist), with Christ <strong>really present<\/strong> in the bread and wine, though Luther rejected transubstantiation.<\/li><\/ul>\n<p>The confrontation: excommunicated in <strong>1521<\/strong>, he refused to recant at the <strong>Diet of Worms (1521)<\/strong> before Emperor <strong>Charles V<\/strong> (\"Here I stand; I can do no other\"). The <strong>Edict of Worms<\/strong> made him an outlaw, but <strong>Frederick the Wise<\/strong>, elector of <strong>Saxony<\/strong>, protected him in Wartburg Castle, where he <strong>translated the New Testament into German<\/strong>.<\/p>\n<p><strong>German Peasants' War (1524–1525):<\/strong> peasants cited Luther's ideas of Christian freedom to demand an end to serfdom. Luther <strong>sided with the princes<\/strong>, urging them to crush the revolt. From then on Lutheranism spread <strong>with the support of princes<\/strong>, who also gained control of church property.<\/p>\n<p>The name \"<strong>Protestant<\/strong>\" comes from princes who <strong>protested<\/strong> an imperial decision at the Diet of Speyer (1529). After years of war between Charles V and the Protestant <strong>Schmalkaldic League<\/strong>, the <strong>Peace of Augsburg (1555)<\/strong> ruled that each German prince could choose <strong>Lutheranism or Catholicism<\/strong> for his territory: <strong><em>cuius regio, eius religio<\/strong><\/em> (\"whose realm, his religion\"). <strong>Calvinism was not included<\/strong>, a problem that helped cause the Thirty Years' War (Unit 7).<\/p>\n<h4>Zwingli, Calvin, and the radicals<\/h4>\n<ul><li><strong>Ulrich Zwingli<\/strong> (Zurich): even more radical in stripping churches of images; taught that the Eucharist is only a <strong>symbolic<\/strong> remembrance. He and Luther <strong>disagreed at Marburg (1529)<\/strong>, so Protestants never united. Zwingli died in battle (1531).<\/li><li><strong>John Calvin<\/strong> (a Frenchman in <strong>Geneva<\/strong>): <strong><em>Institutes of the Christian Religion<\/strong><\/em> (1536). Central doctrine: <strong>predestination<\/strong>, meaning God has already chosen the \"<strong>elect<\/strong>\" for salvation. Geneva became a model Protestant city governed by strict moral discipline (the <strong>consistory<\/strong> of pastors and elders policed behavior). Calvinism spread internationally: <strong>Huguenots<\/strong> (France), <strong>Presbyterians<\/strong> in Scotland (<strong>John Knox<\/strong>), <strong>Puritans<\/strong> (England), and the <strong>Dutch Reformed<\/strong> Church. Later writers (Max Weber) linked Calvinist discipline and hard work to the rise of capitalism.<\/li><li><strong>Anabaptists<\/strong> (\"re-baptizers\"): <strong>adult baptism<\/strong> only, <strong>separation of church and state<\/strong>, often <strong>pacifism<\/strong> and shared property. Persecuted by Catholics and Protestants alike, especially after radicals seized <strong>Münster (1534–1535)<\/strong>. Descendants include the <strong>Mennonites<\/strong> (and later Amish).<\/li><\/ul>\n<h4>The English Reformation: politics first<\/h4>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Henry VIII<\/strong> needs a male heir; his wife <strong>Catherine of Aragon<\/strong> has given him only a daughter (Mary)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>The pope refuses an annulment, under pressure from Catherine's nephew, Emperor <strong>Charles V<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Parliament's <strong>Act of Supremacy (1534)<\/strong> makes the <strong>king head of the Church of England<\/strong>; Henry marries <strong>Anne Boleyn<\/strong><\/div><\/div>\n<p>Henry <strong>dissolved the monasteries<\/strong> (1536–1540) and sold their lands to nobles and gentry, who then supported the break. Doctrine stayed largely <strong>Catholic<\/strong> under Henry. His son <strong>Edward VI<\/strong> pushed Protestantism (Archbishop <strong>Cranmer<\/strong>'s <strong>Book of Common Prayer<\/strong>). <strong>Mary I<\/strong> restored Catholicism and burned about 300 Protestants (\"<strong>Bloody Mary<\/strong>\"). <strong>Elizabeth I<\/strong> (1558–1603) set a moderate, Protestant <strong>Elizabethan Settlement<\/strong> (the Church of England as a \"middle way,\" with the monarch as Supreme Governor).<\/p>\n<h3>7. The Catholic Reformation (Counter-Reformation)<\/h3>\n<p>The Catholic Church responded with genuine reform <strong>and<\/strong> firm defense of doctrine.<\/p>\n<ul><li><strong>Pope Paul III<\/strong> (1534–1549) appointed reformers and called the <strong>Council of Trent (1545–1563)<\/strong>:<ul><li><strong>Reaffirmed<\/strong> doctrine: salvation by <strong>faith and good works<\/strong>, <strong>all seven sacraments<\/strong>, <strong>transubstantiation<\/strong>, the authority of <strong>both Scripture and Church tradition<\/strong>, the Latin Vulgate, and <strong>Latin Mass<\/strong>.<\/li><li><strong>Reformed<\/strong> abuses: ended the sale of indulgences (while keeping indulgences), required bishops to <strong>live in their dioceses<\/strong>, and created <strong>seminaries<\/strong> to train priests.<\/li><\/ul><\/li><li><strong>Jesuits (Society of Jesus):<\/strong> founded by <strong>Ignatius of Loyola<\/strong>, a former Spanish soldier; approved <strong>1540<\/strong>. Organized like an army with absolute <strong>obedience to the pope<\/strong>, they excelled at <strong>education<\/strong> (schools and universities), <strong>missionary work<\/strong> (<strong>Francis Xavier<\/strong> in India and Japan), and winning back areas like Poland and southern Germany.<\/li><li><strong>Roman Inquisition (1542)<\/strong> prosecuted heresy; the <strong><em>Index of Prohibited Books<\/strong><\/em> (1559) banned dangerous works.<\/li><li>New piety: <strong>Teresa of Ávila<\/strong> (Carmelite reform, mysticism); the <strong>Ursulines<\/strong> educated girls.<\/li><\/ul>\n<h3>Big picture for the exam<\/h3>\n<p>Know <strong>why Italy<\/strong>, <strong>humanists and their works<\/strong> (Petrarch, Valla, Pico, Castiglione, Machiavelli), <strong>artists and works<\/strong>, <strong>Gutenberg's impact<\/strong>, <strong>Erasmus and More<\/strong>, the <strong>New Monarchs<\/strong> (Louis XI, Henry VII, Ferdinand and Isabella), <strong>Luther's ideas and steps<\/strong> (1517, 1521, Peasants' War, 1555), <strong>Calvin vs. Luther<\/strong>, <strong>Anabaptists<\/strong>, the <strong>English Reformation's political cause<\/strong>, and <strong>Trent + Jesuits<\/strong>.<\/p>","words":2009,"mustKnow":["Renaissance began in <strong>Italy (c. 1350)<\/strong>: wealthy trading city-states, <strong>patrons<\/strong> (Medici, popes), Roman heritage, Byzantine scholars; focus on <strong>humanism, individualism, secularism<\/strong>.","<strong>Petrarch<\/strong> = father of humanism; <strong>Valla<\/strong> exposed the <strong>Donation of Constantine<\/strong> as a forgery; <strong>Pico<\/strong>'s <em>Oration on the Dignity of Man<\/em>; <strong>Castiglione<\/strong>'s <em>Courtier<\/em>.","<strong>Machiavelli's <em>The Prince<\/strong><\/em> (1513): political realism; better to be feared than loved.","Art: <strong>perspective<\/strong> (Brunelleschi, Masaccio), <strong>Leonardo<\/strong> (<em>Last Supper<\/em>, <em>Mona Lisa<\/em>), <strong>Michelangelo<\/strong> (<em>David<\/em>, Sistine Chapel), <strong>Raphael<\/strong> (<em>School of Athens<\/em>); North: <strong>van Eyck<\/strong> (oils), <strong>Dürer<\/strong> (engravings), <strong>Bruegel<\/strong> (peasants).","<strong>Gutenberg's movable type (c. 1450)<\/strong> spread literacy and Reformation ideas rapidly.","<strong>Christian humanists:<\/strong> <strong>Erasmus<\/strong> (<em>Praise of Folly<\/em>, Greek New Testament; reform from within), <strong>Thomas More<\/strong> (<em>Utopia<\/em>).","<strong>New Monarchies:<\/strong> <strong>Louis XI<\/strong>; <strong>Henry VII<\/strong> (Bosworth 1485, Star Chamber); <strong>Ferdinand and Isabella<\/strong> (Granada, expulsion of Jews, Columbus, all <strong>1492<\/strong>; Spanish Inquisition); Habsburg <strong>Charles V<\/strong>.","<strong>Luther:<\/strong> <strong>95 Theses (1517)<\/strong> vs. indulgences; <strong>faith alone, Scripture alone, priesthood of all believers<\/strong>; <strong>Diet of Worms (1521)<\/strong>; sided with princes in the <strong>Peasants' War<\/strong>; <strong>Peace of Augsburg (1555)<\/strong>: <em>cuius regio, eius religio<\/em> (Lutheran or Catholic only).","<strong>Calvin<\/strong> (Geneva): <strong>predestination<\/strong>, <em>Institutes<\/em>; spread to Huguenots, Presbyterians (Knox), Puritans, Dutch. <strong>Anabaptists:<\/strong> adult baptism, church-state separation.","<strong>Henry VIII:<\/strong> <strong>Act of Supremacy (1534)<\/strong> for political/dynastic reasons. <strong>Council of Trent (1545–63)<\/strong> reaffirmed doctrine and reformed abuses; <strong>Jesuits<\/strong> (Loyola, 1540) for education and missions."],"timeline":[{"y":1350.0,"label":"c. 1350","text":"Petrarch and humanism in Italy","key":false},{"y":1436.0,"label":"1436","text":"Brunelleschi's dome of Florence Cathedral completed","key":false},{"y":1440.0,"label":"1440","text":"<strong>Valla<\/strong> proves the Donation of Constantine a forgery","key":true},{"y":1450.0,"label":"c. 1450","text":"<strong>Gutenberg's<\/strong> movable-type press (Bible c. 1455)","key":true},{"y":1454.0,"label":"1454","text":"Peace of Lodi: balance of power in Italy","key":false},{"y":1469.0,"label":"1469","text":"Marriage of Ferdinand and Isabella","key":false},{"y":1485.0,"label":"1485","text":"<strong>Henry VII<\/strong> wins at Bosworth; Tudor dynasty","key":true},{"y":1486.0,"label":"1486","text":"Pico's <em>Oration on the Dignity of Man<\/em>","key":false},{"y":1492.0,"label":"1492","text":"Granada conquered; <strong>Jews expelled from Spain<\/strong>; Columbus sails","key":true},{"y":1494.0,"label":"1494","text":"France invades Italy; Savonarola rules Florence","key":false},{"y":1508.0,"label":"1508–1512","text":"Michelangelo paints the Sistine Chapel ceiling","key":false},{"y":1509.0,"label":"1509","text":"Erasmus' <em>In Praise of Folly<\/em>","key":false},{"y":1513.0,"label":"1513","text":"<strong>Machiavelli<\/strong> writes <em>The Prince<\/em>","key":true},{"y":1516.0,"label":"1516","text":"More's <em>Utopia<\/em>; Erasmus' Greek New Testament; Concordat of Bologna","key":false},{"y":1517.0,"label":"1517","text":"<strong>Luther's Ninety-Five Theses<\/strong>","key":true},{"y":1519.0,"label":"1519","text":"Charles V elected Holy Roman Emperor","key":false},{"y":1521.0,"label":"1521","text":"<strong>Diet of Worms<\/strong>: Luther refuses to recant","key":true},{"y":1524.0,"label":"1524–1525","text":"German Peasants' War","key":false},{"y":1527.0,"label":"1527","text":"Sack of Rome by imperial troops","key":false},{"y":1528.0,"label":"1528","text":"Castiglione's <em>Book of the Courtier<\/em>","key":false},{"y":1534.0,"label":"1534","text":"<strong>Act of Supremacy<\/strong>: Henry VIII heads the Church of England","key":true},{"y":1536.0,"label":"1536","text":"Calvin's <em>Institutes<\/em>; dissolution of English monasteries begins","key":false},{"y":1540.0,"label":"1540","text":"Pope approves the <strong>Jesuits<\/strong> (Ignatius of Loyola)","key":true},{"y":1545.0,"label":"1545–1563","text":"<strong>Council of Trent<\/strong>","key":true},{"y":1555.0,"label":"1555","text":"<strong>Peace of Augsburg<\/strong>: <em>cuius regio, eius religio<\/em>","key":true},{"y":1558.0,"label":"1558","text":"Elizabeth I becomes queen","key":false}],"people":[{"name":"Petrarch","desc":"Father of humanism; recovered classical texts","key":true},{"name":"Lorenzo Valla","desc":"Exposed the Donation of Constantine as a forgery","key":false},{"name":"Lorenzo de' Medici","desc":"Florentine ruler and patron (\"the Magnificent\")","key":false},{"name":"Machiavelli","desc":"<em>The Prince<\/em> (1513): political realism","key":true},{"name":"Castiglione","desc":"<em>The Book of the Courtier<\/em>: ideal Renaissance gentleman","key":false},{"name":"Leonardo da Vinci","desc":"<em>Last Supper<\/em>, <em>Mona Lisa<\/em>, notebooks","key":false},{"name":"Michelangelo","desc":"<em>David<\/em>, Sistine Chapel ceiling","key":false},{"name":"Gutenberg","desc":"Movable-type printing press (c. 1450)","key":true},{"name":"Erasmus","desc":"<em>In Praise of Folly<\/em>; Christian humanist; Greek New Testament","key":true},{"name":"Thomas More","desc":"<em>Utopia<\/em>; executed for opposing Henry VIII's supremacy","key":false},{"name":"Martin Luther","desc":"95 Theses (1517); faith alone; Diet of Worms","key":true},{"name":"John Calvin","desc":"<em>Institutes<\/em>; predestination; Geneva","key":true},{"name":"Henry VIII","desc":"Act of Supremacy (1534); Church of England","key":true},{"name":"Ignatius of Loyola","desc":"Founder of the Jesuits (1540)","key":true},{"name":"Charles V","desc":"Habsburg emperor; faced Luther at Worms","key":false}],"cards":[{"id":"rr-c1","f":"Renaissance","b":"\"Rebirth\" of classical learning and art beginning in 14th-century Italy."},{"id":"rr-c2","f":"Humanism","b":"Study of classical texts (grammar, rhetoric, poetry, history, ethics) emphasizing human potential and achievement."},{"id":"rr-c3","f":"Petrarch","b":"\"Father of humanism\"; collected classical manuscripts; wrote Italian sonnets."},{"id":"rr-c4","f":"Patron / Medici","b":"Wealthy sponsor of art and learning; the Medici banking family dominated Florence."},{"id":"rr-c5","f":"Lorenzo Valla","b":"Humanist who used philology to prove the Donation of Constantine a forgery (1440)."},{"id":"rr-c6","f":"Oration on the Dignity of Man","b":"Pico della Mirandola (1486): humans can freely shape their own nature."},{"id":"rr-c7","f":"The Courtier","b":"Castiglione's 1528 guide to the ideal, well-rounded Renaissance gentleman."},{"id":"rr-c8","f":"The Prince","b":"Machiavelli's 1513 handbook of political realism; better to be feared than loved."},{"id":"rr-c9","f":"Linear perspective","b":"Technique using a vanishing point to create the illusion of depth (Brunelleschi, Masaccio)."},{"id":"rr-c10","f":"Leonardo da Vinci","b":"Painter of the <em>Last Supper<\/em> and <em>Mona Lisa<\/em>; scientist-inventor; model \"Renaissance man.\""},{"id":"rr-c11","f":"Michelangelo","b":"Sculptor of <em>David<\/em>; painter of the Sistine Chapel ceiling."},{"id":"rr-c12","f":"School of Athens","b":"Raphael's fresco of Greek philosophers, with Plato and Aristotle at the center."},{"id":"rr-c13","f":"Gutenberg","b":"Developed movable-type printing in Mainz (c. 1450); printed the Gutenberg Bible."},{"id":"rr-c14","f":"Christian humanism","b":"Northern movement applying humanist scholarship to reform Christianity (Erasmus, More)."},{"id":"rr-c15","f":"Erasmus","b":"Dutch humanist; <em>In Praise of Folly<\/em>; Greek New Testament; sought reform within the Church."},{"id":"rr-c16","f":"Utopia","b":"Thomas More's 1516 book on an ideal society, criticizing European injustice."},{"id":"rr-c17","f":"Jan van Eyck","b":"Flemish master of oil painting known for minute realistic detail (<em>Arnolfini Portrait<\/em>)."},{"id":"rr-c18","f":"New Monarchies","b":"15th-century kings (Louis XI, Henry VII, Ferdinand &amp; Isabella) who centralized power with armies, taxes, and officials."},{"id":"rr-c19","f":"Ferdinand and Isabella","b":"Joint rulers of Spain; conquered Granada, expelled Jews, sponsored Columbus (1492)."},{"id":"rr-c20","f":"Indulgence","b":"Church remission of punishment for sin; its sale sparked Luther's protest."},{"id":"rr-c21","f":"Ninety-Five Theses","b":"Luther's 1517 propositions attacking the sale of indulgences."},{"id":"rr-c22","f":"Justification by faith alone","b":"Luther's teaching that salvation comes through faith and God's grace, not good works."},{"id":"rr-c23","f":"Diet of Worms","b":"1521 assembly where Luther refused to recant before Charles V; declared an outlaw."},{"id":"rr-c24","f":"Peace of Augsburg","b":"1555: each German prince chooses Lutheranism or Catholicism for his land (<em>cuius regio, eius religio<\/em>)."},{"id":"rr-c25","f":"Predestination","b":"Calvin's doctrine that God has already chosen who will be saved (the elect)."},{"id":"rr-c26","f":"Anabaptists","b":"Radical reformers: adult baptism, separation of church and state, often pacifism."},{"id":"rr-c27","f":"Act of Supremacy (1534)","b":"Made Henry VIII head of the Church of England after the pope refused his annulment."},{"id":"rr-c28","f":"Council of Trent","b":"1545–1563: reaffirmed Catholic doctrine (faith and works, seven sacraments) and reformed abuses (seminaries)."},{"id":"rr-c29","f":"Jesuits","b":"Society of Jesus, founded by Ignatius of Loyola (1540); education, missions, loyalty to the pope."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Catholic (after Trent)<\/th><th>Lutheran<\/th><th>Calvinist<\/th><th>Anglican (Church of England)<\/th><\/tr><\/thead><tbody><tr><td>Salvation<\/td><td>Faith <strong>and<\/strong> good works<\/td><td>Faith alone<\/td><td>Faith alone; <strong>predestination<\/strong><\/td><td>Faith alone (Protestant articles)<\/td><\/tr><tr><td>Authority<\/td><td>Scripture <strong>+<\/strong> tradition; pope<\/td><td>Scripture alone<\/td><td>Scripture alone<\/td><td>Scripture; monarch heads church<\/td><\/tr><tr><td>Sacraments<\/td><td>Seven; transubstantiation<\/td><td>Two; real presence (not transubstantiation)<\/td><td>Two; spiritual presence<\/td><td>Two main sacraments; ritual kept<\/td><\/tr><tr><td>Church government<\/td><td>Pope, bishops<\/td><td>Princes oversee state churches<\/td><td>Elders and ministers (presbyteries)<\/td><td>Monarch, bishops<\/td><\/tr><tr><td>Where<\/td><td>Italy, Spain, France, Poland, S. Germany<\/td><td>N. Germany, Scandinavia<\/td><td>Geneva, Scotland, Netherlands, Huguenot France<\/td><td>England<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Italian Renaissance<\/th><th>Northern Renaissance<\/th><\/tr><\/thead><tbody><tr><td>Focus<\/td><td>Classical revival, civic life, individual glory<\/td><td>Christian reform, piety (Christian humanism)<\/td><\/tr><tr><td>Thinkers<\/td><td>Petrarch, Valla, Pico, Machiavelli<\/td><td>Erasmus, More, Rabelais<\/td><\/tr><tr><td>Art<\/td><td>Classical forms, perspective, idealized figures<\/td><td>Detailed realism, oil paint, everyday life<\/td><\/tr><tr><td>Artists<\/td><td>Leonardo, Michelangelo, Raphael<\/td><td>Van Eyck, Dürer, Holbein, Bruegel<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"em","title":"Early Modern Europe, 1560-1648","topic":"early_modern","share":13.4,"quizN":12,"examN":16,"diagN":4,"cardTarget":24,"lessonMin":13,"studyHours":2.0,"intro":"Europe goes global and goes to war. Atlantic exploration and empire, a commercial revolution, religious and dynastic wars ending with the Peace of Westphalia (1648), and the first steps of the Scientific Revolution. Worth 10–15%.","lesson":"<h3>1. Opening the Atlantic: why and how<\/h3>\n<p>Exploration began in the 1400s and exploded in the 1500s. Motives are summed up as \"<strong>God, gold, and glory<\/strong>\":<\/p>\n<ul><li><strong>Gold:<\/strong> Europeans craved Asian <strong>spices<\/strong> and luxury goods, but the <strong>Ottoman Turks<\/strong> and <strong>Venetian<\/strong> middlemen controlled the eastern routes and took big profits. A <strong>sea route to Asia<\/strong> would cut them out.<\/li><li><strong>God:<\/strong> spreading <strong>Christianity<\/strong> (and the crusading spirit of the Reconquista).<\/li><li><strong>Glory:<\/strong> fame and power for explorers and monarchs; <strong>New Monarchies<\/strong> had the money and ambition to sponsor voyages.<\/li><\/ul>\n<p><strong>Technology<\/strong> made it possible: the <strong>caravel<\/strong> (a small, nimble ship with triangular <strong>lateen<\/strong> sails that could sail against the wind), the <strong>magnetic compass<\/strong>, the <strong>astrolabe<\/strong> (for latitude), better maps, and shipboard <strong>cannon<\/strong>.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Who<\/th><th>When<\/th><th>What<\/th><\/tr><\/thead><tbody><tr><td><strong>Prince Henry the Navigator<\/strong> (Portugal)<\/td><td>1400s<\/td><td>Sponsored voyages down the West African coast<\/td><\/tr><tr><td><strong>Bartolomeu Dias<\/strong> (Portugal)<\/td><td><strong>1488<\/strong><\/td><td>Rounded the <strong>Cape of Good Hope<\/strong> (southern tip of Africa)<\/td><\/tr><tr><td><strong>Christopher Columbus<\/strong> (for Spain)<\/td><td><strong>1492<\/strong><\/td><td>Sailed west, reached the <strong>Caribbean<\/strong>, thinking it was Asia<\/td><\/tr><tr><td><strong>Treaty of Tordesillas<\/strong><\/td><td><strong>1494<\/strong><\/td><td>Pope-brokered line dividing new lands: Spain west, Portugal east (so Portugal got <strong>Brazil<\/strong>)<\/td><\/tr><tr><td><strong>Vasco da Gama<\/strong> (Portugal)<\/td><td><strong>1498<\/strong><\/td><td>Reached <strong>India<\/strong> by sea around Africa<\/td><\/tr><tr><td><strong>Ferdinand Magellan<\/strong> (for Spain)<\/td><td><strong>1519–1522<\/strong><\/td><td>First <strong>circumnavigation<\/strong>; Magellan was killed in the Philippines, and his crew finished the trip<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Portugal<\/strong> built a <strong>trading-post empire<\/strong> (forts at Goa in India and Malacca, controlling spice trade by force), not large colonies.<\/p>\n<p><strong>Spain<\/strong> built a land empire in the Americas through the <strong>conquistadors<\/strong>: <strong>Hernán Cortés<\/strong> conquered the <strong>Aztecs<\/strong> (capital Tenochtitlan, ruler Montezuma) in <strong>1519–1521<\/strong>, and <strong>Francisco Pizarro<\/strong> conquered the <strong>Incas<\/strong> (ruler Atahualpa) in <strong>1532–1533<\/strong>. Their advantages: <strong>steel weapons, guns, horses<\/strong>, <strong>native allies<\/strong> who hated Aztec rule, and above all <strong>European diseases<\/strong>.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Europeans arrive carrying <strong>smallpox<\/strong>, measles, and influenza, to which Native Americans had no immunity<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Native populations collapse, by as much as <strong>90%<\/strong> in many areas<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Spaniards force survivors to work (the <strong>encomienda<\/strong> labor system and silver mines like <strong>Potosí<\/strong>) and then import <strong>enslaved Africans<\/strong> to replace them<\/div><\/div>\n<p>The Dominican friar <strong>Bartolomé de Las Casas<\/strong> denounced Spanish cruelty to Native Americans.<\/p>\n<p><strong>Columbian Exchange:<\/strong> the transfer of plants, animals, people, and diseases between the hemispheres. To Europe: <strong>potatoes, maize (corn), tomatoes, tobacco, cacao<\/strong>. To the Americas: <strong>wheat, sugar, horses, cattle, pigs<\/strong>, and <strong>diseases<\/strong>. Potatoes and maize later fueled European population growth.<\/p>\n<p><strong>Atlantic slave trade:<\/strong> <strong>sugar plantations<\/strong> in Brazil and the Caribbean demanded huge labor forces. Millions of Africans were shipped across the Atlantic in the brutal <strong>Middle Passage<\/strong>, part of a <strong>triangular trade<\/strong> (European goods to Africa → enslaved people to the Americas → sugar, tobacco, and other goods to Europe).<\/p>\n<p><strong>Latecomers<\/strong> in the 1600s: the <strong>Dutch<\/strong> (East Indies spice trade; New Amsterdam, 1620s), the <strong>English<\/strong> (Jamestown 1607; Plymouth 1620), and the <strong>French<\/strong> (<strong>Quebec 1608<\/strong>, fur trade).<\/p>\n<h3>2. The Commercial Revolution<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Tons of <strong>American silver<\/strong> (especially from Potosí) pour into Spain and then all of Europe<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Too much money chasing too few goods: the <strong>Price Revolution<\/strong>, a long <strong>inflation<\/strong> in which prices roughly quadrupled over the 1500s<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Merchants and borrowers gain; landlords on fixed rents and wage-earners lose; <strong>Spain<\/strong> itself suffers because its silver flows out to pay for imports and wars<\/div><\/div>\n<p>New business forms and ideas:<\/p>\n<ul><li><strong>Joint-stock companies:<\/strong> many investors pool money by buying <strong>shares<\/strong>, sharing profits and <strong>spreading risk<\/strong> for expensive, dangerous voyages. Examples: the <strong>English East India Company (1600)<\/strong> and the <strong>Dutch East India Company (VOC, 1602)<\/strong>, which had government-granted monopolies and their own armies.<\/li><li><strong>Banking and finance:<\/strong> the <strong>Fugger<\/strong> family of Augsburg lent to the Habsburgs (financing Charles V's election); <strong>Amsterdam<\/strong> became Europe's financial capital, with its <strong>stock exchange<\/strong> and the <strong>Bank of Amsterdam (1609)<\/strong>.<\/li><li><strong>Putting-out (domestic) system:<\/strong> merchants delivered raw materials such as wool to <strong>rural households<\/strong> to spin and weave at home, then collected and sold the finished cloth, <strong>bypassing town guild restrictions<\/strong>.<\/li><li><strong>Mercantilism:<\/strong> governments believed national wealth = <strong>gold and silver (bullion)<\/strong>. A nation should <strong>export more than it imports<\/strong> (favorable balance of trade) and use <strong>colonies<\/strong> as sources of raw materials and markets for finished goods, with tariffs and state regulation.<\/li><li><strong>Capitalism:<\/strong> private investment of capital for profit spread steadily.<\/li><li>In England, <strong>enclosure<\/strong> (fencing common land for sheep) pushed peasants off the land. In <strong>Eastern Europe<\/strong>, by contrast, lords tightened <strong>serfdom<\/strong> to grow grain for export west (the \"second serfdom\").<\/li><\/ul>\n<h3>3. Spain under Philip II and the Dutch Revolt<\/h3>\n<p><strong>Philip II<\/strong> (1556–1598), son of Charles V, ruled Spain, the Americas, the Netherlands, and parts of Italy, and saw himself as the <strong>champion of Catholicism<\/strong>. He ruled from his palace-monastery, the <strong>Escorial<\/strong>.<\/p>\n<ul><li><strong>Lepanto (1571):<\/strong> a Holy League fleet led by Spain <strong>defeated the Ottoman navy<\/strong>, ending Ottoman naval dominance in the western Mediterranean.<\/li><li><strong>Dutch Revolt (from 1566):<\/strong> the wealthy, increasingly <strong>Calvinist<\/strong> Netherlands resented <strong>Spanish taxes<\/strong>, centralization, and the <strong>Inquisition<\/strong>. Philip sent the <strong>Duke of Alba<\/strong>, whose \"Council of Troubles\" (\"<strong>Council of Blood<\/strong>\") executed thousands. <strong>William of Orange (\"the Silent\")<\/strong> led the rebels. The seven northern provinces formed the <strong>Union of Utrecht (1579)<\/strong> and declared independence (1581) as the <strong>United Provinces<\/strong> (Dutch Republic). The southern provinces (modern Belgium) stayed Spanish and Catholic. Spain recognized Dutch independence only in <strong>1648<\/strong>.<\/li><li><strong>Spanish Armada (1588):<\/strong> Philip sent a huge fleet to invade Protestant <strong>England<\/strong> (Elizabeth I had aided the Dutch and executed the Catholic <strong>Mary, Queen of Scots<\/strong>, in 1587). Faster English ships, <strong>fire ships<\/strong>, and storms (the \"Protestant wind\") destroyed it.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Costly wars on many fronts + inflation + dependence on American silver<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Spain declares <strong>bankruptcy<\/strong> repeatedly and loses the Armada<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>By the 1600s Spain declines, while the <strong>Dutch Republic<\/strong> and <strong>England<\/strong> rise as commercial and naval powers<\/div><\/div>\n<p><strong>The Dutch Golden Age (1600s):<\/strong> a Calvinist but relatively <strong>tolerant<\/strong> republic of merchants, the leading <strong>shipping, banking, and trading<\/strong> nation in Europe, and home of painters such as <strong>Rembrandt<\/strong> and <strong>Vermeer<\/strong>.<\/p>\n<h3>4. France: Wars of Religion to Richelieu<\/h3>\n<p><strong>French Wars of Religion (1562–1598):<\/strong> Catholics (led by the <strong>Guise<\/strong> family) vs. <strong>Huguenots<\/strong> (French Calvinists, many of them nobles, led by the <strong>Bourbons<\/strong>). Religion mixed with <strong>noble factions<\/strong> competing for power under weak young kings and their mother, <strong>Catherine de' Medici<\/strong>.<\/p>\n<ul><li><strong>St. Bartholomew's Day Massacre (August 24, 1572):<\/strong> Catholic mobs killed thousands of Huguenots in Paris and the provinces after the wedding of the Protestant <strong>Henry of Navarre<\/strong>.<\/li><li>Henry of Navarre became <strong>Henry IV<\/strong> (1589), the first <strong>Bourbon<\/strong> king. To win Catholic Paris, he <strong>converted to Catholicism<\/strong> (supposedly saying \"<strong>Paris is well worth a Mass<\/strong>\").<\/li><li><strong>Edict of Nantes (1598):<\/strong> granted <strong>Huguenots freedom of worship<\/strong> in many places, civil rights, and <strong>fortified towns<\/strong>. It reflected the <strong>politiques<\/strong>, who put <strong>political unity and peace above religious uniformity<\/strong>.<\/li><\/ul>\n<p>Henry IV was assassinated in 1610. Under <strong>Louis XIII<\/strong>, <strong>Cardinal Richelieu<\/strong> (chief minister 1624–1642) built royal absolutism:<\/p>\n<ul><li>Used royal officials called <strong>intendants<\/strong> to govern the provinces and collect taxes, bypassing nobles.<\/li><li>Destroyed Huguenot <strong>political and military<\/strong> power by besieging <strong>La Rochelle<\/strong> (1628) while letting them keep freedom of worship.<\/li><li>Tore down nobles' castles and punished dueling and plots.<\/li><li>Followed <strong><em>raison d'état<\/strong><\/em> (\"<strong>reason of state<\/strong>\"): national interest over religion. He supported <strong>Protestant<\/strong> Sweden and German princes against the <strong>Catholic Habsburgs<\/strong> in the Thirty Years' War.<\/li><\/ul>\n<h3>5. England: Elizabeth to the Civil War<\/h3>\n<ul><li><strong>Elizabeth I<\/strong> (1558–1603) set a moderate Protestant <strong>Elizabethan Settlement<\/strong> (1559; the <strong>Thirty-Nine Articles<\/strong>, 1563), avoided religious civil war, defeated the Armada, and presided over a cultural golden age (<strong>Shakespeare<\/strong>).<\/li><li><strong>James I<\/strong> (1603–1625), first <strong>Stuart<\/strong> king (already James VI of Scotland), believed in the <strong>divine right of kings<\/strong>: monarchs answer only to God. He sponsored the <strong>King James Bible (1611)<\/strong> and quarreled with Parliament over money.<\/li><li><strong>Charles I<\/strong> (1625–1649) raised taxes without Parliament's consent. In the <strong>Petition of Right (1628)<\/strong>, Parliament declared he could not levy <strong>taxes without Parliament's consent<\/strong>, <strong>imprison people without cause<\/strong>, <strong>quarter soldiers<\/strong> in private homes, or impose <strong>martial law<\/strong> in peacetime. He then ruled without Parliament (1629–1640), until a Scottish revolt forced him to recall it.<\/li><li>The <strong>English Civil War (1642–1649):<\/strong> <strong>Royalists (\"Cavaliers\")<\/strong> vs. <strong>Parliamentarians (\"Roundheads\")<\/strong>, many of them <strong>Puritans<\/strong>. <strong>Oliver Cromwell<\/strong>'s <strong>New Model Army<\/strong> won, and Charles I was <strong>executed in 1649<\/strong>.<\/li><\/ul>\n<h3>6. The Thirty Years' War (1618–1648)<\/h3>\n<p><strong>Causes:<\/strong> the Peace of Augsburg (1555) had <strong>excluded Calvinism<\/strong>; Protestant and Catholic princes formed rival alliances; the <strong>Habsburgs<\/strong> wanted to strengthen imperial and Catholic power; and foreign powers (Denmark, Sweden, France) wanted to stop them.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Phase<\/th><th>Dates<\/th><th>What happened<\/th><\/tr><\/thead><tbody><tr><td><strong>Bohemian<\/strong><\/td><td>1618–1625<\/td><td><strong>Defenestration of Prague (1618)<\/strong>: Bohemian Protestants throw imperial officials out a castle window and choose the Calvinist <strong>Frederick V<\/strong> as king; crushed at <strong>White Mountain (1620)<\/strong>; Bohemia forcibly re-Catholicized<\/td><\/tr><tr><td><strong>Danish<\/strong><\/td><td>1625–1629<\/td><td>Lutheran King Christian IV of Denmark intervenes and loses to imperial generals (<strong>Wallenstein<\/strong>); <strong>Edict of Restitution (1629)<\/strong> orders Protestants to return Church lands<\/td><\/tr><tr><td><strong>Swedish<\/strong><\/td><td>1630–1635<\/td><td><strong>Gustavus Adolphus<\/strong> of Sweden, the \"Lion of the North,\" wins at <strong>Breitenfeld (1631)<\/strong> but is killed at <strong>Lützen (1632)<\/strong><\/td><\/tr><tr><td><strong>French (Swedish-French)<\/strong><\/td><td>1635–1648<\/td><td><strong>Catholic France<\/strong> openly fights the Catholic Habsburgs on the Protestant side: <strong>politics over religion<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Armies of mercenaries live off the land for 30 years<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Looting, famine, and disease kill perhaps <strong>one-third<\/strong> of the people in parts of <strong>Germany<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Exhausted powers sign the <strong>Peace of Westphalia (1648)<\/strong><\/div><\/div>\n<p><strong>Peace of Westphalia (1648):<\/strong><\/p>\n<ul><li><strong>Calvinism<\/strong> added to Lutheranism and Catholicism as a legal option (princes still chose their state's religion).<\/li><li><strong>Independence<\/strong> of the <strong>Dutch Republic<\/strong> and the <strong>Swiss Confederation<\/strong> formally recognized.<\/li><li>German princes became virtually <strong>sovereign<\/strong>, leaving the <strong>Holy Roman Empire<\/strong> a weak shell.<\/li><li><strong>France<\/strong> gained territory in <strong>Alsace<\/strong>; <strong>Sweden<\/strong> gained Baltic coastal lands.<\/li><li>Often called the beginning of the modern <strong>state system<\/strong>: <strong>sovereign states<\/strong> that are equal under law, no outside interference in internal religion, and a <strong>balance of power<\/strong>. It marked the <strong>end of the age of religious wars<\/strong>, and the pope's protests were ignored.<\/li><\/ul>\n<h3>7. Thought and culture<\/h3>\n<h4>The Scientific Revolution begins<\/h4>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Renaissance recovery of ancient texts + new instruments + challenges to authority<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Scientists test old authorities (<strong>Aristotle, Ptolemy, Galen<\/strong>) against <strong>observation, mathematics, and experiment<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>A new view of the universe, and conflict with Church teaching<\/div><\/div>\n<ul><li><strong>Nicolaus Copernicus<\/strong>, <em>On the Revolutions of the Heavenly Spheres<\/em> (<strong>1543<\/strong>): a <strong>heliocentric<\/strong> (Sun-centered) universe, replacing Ptolemy's Earth-centered model.<\/li><li><strong>Andreas Vesalius<\/strong>, <em>On the Fabric of the Human Body<\/em> (also <strong>1543<\/strong>): accurate <strong>anatomy<\/strong> from dissection, correcting Galen.<\/li><li><strong>Tycho Brahe:<\/strong> extremely precise naked-eye observations of the planets.<\/li><li><strong>Johannes Kepler<\/strong> (using Tycho's data): planets move in <strong>elliptical orbits<\/strong>, not perfect circles.<\/li><li><strong>Galileo Galilei:<\/strong> first to turn a <strong>telescope<\/strong> on the heavens (1609–1610): <strong>moons of Jupiter<\/strong>, mountains on the Moon, phases of Venus; laws of <strong>motion<\/strong> and falling bodies. His <em>Dialogue Concerning the Two Chief World Systems<\/em> (1632) defended Copernicus; the <strong>Inquisition<\/strong> tried him in <strong>1633<\/strong> and forced him to recant.<\/li><li><strong>William Harvey<\/strong> (1628): the <strong>circulation of the blood<\/strong>, pumped by the heart.<\/li><li><strong>Francis Bacon<\/strong>: <strong>empiricism<\/strong> and <strong>inductive<\/strong> reasoning, building general conclusions from many careful observations and experiments (the scientific method).<\/li><li><strong>René Descartes<\/strong>: <strong>deductive<\/strong> reasoning from first principles and mathematics; universal doubt led to \"<strong>I think, therefore I am<\/strong>\" (<em>Discourse on Method<\/em>, 1637); <strong>mind–body dualism<\/strong>; analytic geometry.<\/li><li>(Isaac <strong>Newton<\/strong>'s laws of motion and gravity, 1687, completed this revolution after our period.)<\/li><\/ul>\n<h4>Political thought<\/h4>\n<ul><li><strong>Jean Bodin<\/strong> (France, 1576): the state must have absolute, undivided <strong>sovereignty<\/strong> to keep order; a leading <strong>politique<\/strong>.<\/li><li><strong>Divine right of kings:<\/strong> <strong>James I<\/strong> argued that kings were God's lieutenants on earth.<\/li><li><strong>Hugo Grotius<\/strong> (Dutch), <em>On the Law of War and Peace<\/em> (1625): founder of <strong>international law<\/strong>, based on natural law.<\/li><li><strong>Michel de Montaigne<\/strong>, <em>Essays<\/em> (1580): <strong>skepticism<\/strong> (\"What do I know?\") and tolerance, a reaction to religious fanaticism.<\/li><\/ul>\n<h4>Literature and art<\/h4>\n<ul><li><strong>William Shakespeare<\/strong> (1564–1616): plays exploring human nature (<em>Hamlet<\/em>, <em>King Lear<\/em>, <em>Macbeth<\/em>). <strong>Miguel de Cervantes<\/strong>, <strong><em>Don Quixote<\/strong><\/em> (1605–1615), satirized outdated <strong>chivalric<\/strong> ideals.<\/li><li><strong>Mannerism<\/strong> (after the High Renaissance): elongated, distorted figures and tension. Example: <strong>El Greco<\/strong> (in Spain).<\/li><li><strong>Baroque<\/strong> (from c. 1600): dramatic, emotional, grand, full of <strong>movement and contrasts of light<\/strong>; closely tied to the <strong>Catholic Reformation<\/strong> and absolute monarchs, to inspire awe and faith. Examples: <strong>Caravaggio<\/strong> (dramatic chiaroscuro), <strong>Bernini<\/strong> (St. Peter's colonnade, <em>Ecstasy of St. Teresa<\/em>), <strong>Rubens<\/strong> (Flemish), <strong>Velázquez<\/strong> (Spanish court).<\/li><li><strong>Dutch Golden Age<\/strong> painting for <strong>middle-class Protestant<\/strong> buyers: portraits, landscapes, and <strong>everyday scenes<\/strong>, by <strong>Rembrandt<\/strong> (<em>The Night Watch<\/em>, 1642) and <strong>Vermeer<\/strong>.<\/li><li>The <strong>witch hunts<\/strong> peaked c. 1560–1660; tens of thousands of people, mostly <strong>women<\/strong>, were executed, a sign of religious anxiety and social stress.<\/li><\/ul>\n<h3>Big picture for the exam<\/h3>\n<p>Know <strong>who explored where and when<\/strong> (Dias 1488, Columbus 1492, da Gama 1498, Magellan 1519–22), <strong>Tordesillas<\/strong>, <strong>conquistadors<\/strong>, the <strong>Columbian Exchange<\/strong> and <strong>slave trade<\/strong>; the <strong>Price Revolution<\/strong>, <strong>joint-stock companies<\/strong>, <strong>mercantilism<\/strong>; <strong>Philip II<\/strong> (Lepanto, Dutch Revolt, Armada); <strong>France<\/strong> (St. Bartholomew's, Henry IV, <strong>Edict of Nantes<\/strong>, Richelieu); <strong>Stuart England<\/strong> (divine right, Petition of Right, Civil War); the <strong>Thirty Years' War phases<\/strong> and <strong>Westphalia's terms<\/strong>; and the early <strong>Scientific Revolution<\/strong> (Copernicus → Kepler → Galileo; Bacon vs. Descartes).<\/p>","words":2126,"mustKnow":["Exploration motives: <strong>God, gold, glory<\/strong>; tools: caravel, compass, astrolabe. <strong>Dias (1488)<\/strong> Cape of Good Hope; <strong>Columbus (1492)<\/strong>; <strong>Tordesillas (1494)<\/strong>; <strong>da Gama (1498)<\/strong> India; <strong>Magellan's<\/strong> crew circled the globe (1519–22).","<strong>Cortés<\/strong> (Aztecs, 1519–21) and <strong>Pizarro<\/strong> (Incas, 1532–33) won largely because of <strong>disease<\/strong>, allies, and weapons; <strong>Columbian Exchange<\/strong>; <strong>encomienda<\/strong>; Atlantic <strong>slave trade<\/strong> for sugar plantations.","<strong>Price Revolution:<\/strong> American silver → 16th-century inflation. <strong>Joint-stock companies<\/strong> (English EIC 1600, Dutch VOC 1602) spread risk. <strong>Mercantilism:<\/strong> bullion, favorable trade balance, colonies.","<strong>Putting-out system<\/strong> bypassed guilds; Amsterdam became the financial center.","<strong>Philip II:<\/strong> Catholic champion; <strong>Lepanto (1571)<\/strong>; <strong>Dutch Revolt<\/strong> (William of Orange, Union of Utrecht 1579); <strong>Spanish Armada (1588)<\/strong> defeated by England.","<strong>French Wars of Religion:<\/strong> <strong>St. Bartholomew's Day Massacre (1572)<\/strong>; <strong>Henry IV<\/strong> converts; <strong>Edict of Nantes (1598)<\/strong> tolerates Huguenots; <strong>politiques<\/strong> put the state first.","<strong>Richelieu:<\/strong> intendants, crushed Huguenot political power (La Rochelle), <em>raison d'état<\/em> (backed Protestants against Habsburgs).","England: <strong>James I<\/strong> (divine right; King James Bible), <strong>Charles I<\/strong> and the <strong>Petition of Right (1628)<\/strong>, <strong>English Civil War (1642–49)<\/strong>, Cromwell.","<strong>Thirty Years' War (1618–48):<\/strong> Defenestration of Prague → Bohemian, Danish, Swedish (<strong>Gustavus Adolphus<\/strong>), French phases; <strong>Peace of Westphalia<\/strong>: Calvinism recognized, Dutch and Swiss independence, sovereign German princes, start of modern state system.","Science: <strong>Copernicus (1543)<\/strong> heliocentrism, <strong>Vesalius (1543)<\/strong> anatomy, <strong>Kepler<\/strong> ellipses, <strong>Galileo<\/strong> telescope and trial (1633), <strong>Harvey<\/strong> circulation, <strong>Bacon<\/strong> induction/empiricism, <strong>Descartes<\/strong> deduction (\"I think, therefore I am\"). Art: <strong>Baroque<\/strong> (Bernini, Caravaggio, Rubens); literature: <strong>Shakespeare<\/strong>, <strong>Cervantes<\/strong>."],"timeline":[{"y":1488.0,"label":"1488","text":"<strong>Dias<\/strong> rounds the Cape of Good Hope","key":true},{"y":1492.0,"label":"1492","text":"<strong>Columbus<\/strong> reaches the Caribbean","key":true},{"y":1494.0,"label":"1494","text":"Treaty of Tordesillas divides new lands","key":false},{"y":1498.0,"label":"1498","text":"<strong>Vasco da Gama<\/strong> reaches India","key":true},{"y":1519.0,"label":"1519–1521","text":"Cortés conquers the Aztecs; Magellan's voyage begins (1519–1522)","key":false},{"y":1532.0,"label":"1532–1533","text":"Pizarro conquers the Incas","key":false},{"y":1543.0,"label":"1543","text":"<strong>Copernicus<\/strong> (heliocentrism) and <strong>Vesalius<\/strong> (anatomy) publish","key":true},{"y":1545.0,"label":"1545","text":"Silver discovered at Potosí","key":false},{"y":1556.0,"label":"1556–1598","text":"Reign of Philip II of Spain","key":false},{"y":1562.0,"label":"1562–1598","text":"French Wars of Religion","key":false},{"y":1566.0,"label":"1566","text":"Dutch Revolt against Spain begins","key":false},{"y":1571.0,"label":"1571","text":"<strong>Battle of Lepanto<\/strong>: Ottoman navy defeated","key":true},{"y":1572.0,"label":"1572","text":"<strong>St. Bartholomew's Day Massacre<\/strong>","key":true},{"y":1579.0,"label":"1579","text":"Union of Utrecht unites northern Dutch provinces","key":false},{"y":1588.0,"label":"1588","text":"<strong>Spanish Armada<\/strong> defeated by England","key":true},{"y":1598.0,"label":"1598","text":"<strong>Edict of Nantes<\/strong> grants toleration to Huguenots","key":true},{"y":1600.0,"label":"1600","text":"English East India Company chartered","key":false},{"y":1602.0,"label":"1602","text":"Dutch East India Company (VOC) founded","key":false},{"y":1603.0,"label":"1603","text":"James I: first Stuart king of England","key":false},{"y":1605.0,"label":"1605","text":"Cervantes' <em>Don Quixote<\/em> (Part I)","key":false},{"y":1607.0,"label":"1607","text":"Jamestown founded; Quebec follows in 1608","key":false},{"y":1609.0,"label":"1609–1610","text":"Galileo's telescope observations; Kepler's laws begin","key":false},{"y":1618.0,"label":"1618","text":"<strong>Defenestration of Prague<\/strong>: Thirty Years' War begins","key":true},{"y":1620.0,"label":"1620","text":"White Mountain; Bacon's <em>Novum Organum<\/em>","key":false},{"y":1624.0,"label":"1624–1642","text":"Cardinal Richelieu governs France","key":false},{"y":1628.0,"label":"1628","text":"<strong>Petition of Right<\/strong>; Harvey on circulation; siege of La Rochelle","key":true},{"y":1631.0,"label":"1631–1632","text":"Gustavus Adolphus wins at Breitenfeld, dies at Lützen","key":false},{"y":1633.0,"label":"1633","text":"<strong>Galileo<\/strong> tried by the Inquisition","key":true},{"y":1637.0,"label":"1637","text":"Descartes' <em>Discourse on Method<\/em>","key":false},{"y":1642.0,"label":"1642","text":"<strong>English Civil War<\/strong> begins","key":true},{"y":1648.0,"label":"1648","text":"<strong>Peace of Westphalia<\/strong> ends the Thirty Years' War","key":true}],"people":[{"name":"Vasco da Gama","desc":"Reached India by sea (1498)","key":true},{"name":"Columbus","desc":"Reached the Americas for Spain (1492)","key":false},{"name":"Magellan","desc":"Led first circumnavigation (1519–1522)","key":false},{"name":"Cortés / Pizarro","desc":"Conquered the Aztecs / the Incas","key":false},{"name":"Las Casas","desc":"Friar who denounced Spanish abuse of Native Americans","key":false},{"name":"Philip II","desc":"Spanish Catholic champion; Lepanto; Armada","key":true},{"name":"William of Orange","desc":"Led the Dutch Revolt","key":false},{"name":"Elizabeth I","desc":"Elizabethan Settlement; defeated the Armada","key":false},{"name":"Henry IV","desc":"Bourbon king; converted; Edict of Nantes","key":true},{"name":"Richelieu","desc":"Centralized France; intendants; raison d'état","key":true},{"name":"Gustavus Adolphus","desc":"Swedish king; Protestant hero of the Thirty Years' War","key":true},{"name":"Copernicus","desc":"Heliocentric theory (1543)","key":true},{"name":"Galileo","desc":"Telescope; tried by the Inquisition (1633)","key":true},{"name":"Bacon / Descartes","desc":"Inductive empiricism / deductive rationalism","key":true},{"name":"Cervantes / Shakespeare","desc":"<em>Don Quixote<\/em> / English drama","key":false}],"cards":[{"id":"em-c1","f":"Caravel","b":"Small, maneuverable Portuguese ship with lateen sails, key to exploration."},{"id":"em-c2","f":"Treaty of Tordesillas","b":"1494 line dividing newly found lands between Spain (west) and Portugal (east, incl. Brazil)."},{"id":"em-c3","f":"Vasco da Gama","b":"Portuguese explorer who reached India by sailing around Africa (1498)."},{"id":"em-c4","f":"Conquistadors","b":"Spanish conquerors of the Americas, e.g., Cortés (Aztecs) and Pizarro (Incas)."},{"id":"em-c5","f":"Columbian Exchange","b":"Transfer of crops, animals, people, and diseases between the Americas and the Old World."},{"id":"em-c6","f":"Encomienda","b":"Spanish colonial grant of Native American labor to settlers."},{"id":"em-c7","f":"Middle Passage","b":"The deadly Atlantic crossing of enslaved Africans in the triangular trade."},{"id":"em-c8","f":"Price Revolution","b":"16th-century inflation in Europe caused largely by American silver."},{"id":"em-c9","f":"Joint-stock company","b":"Business funded by selling shares to many investors to share profit and risk (English EIC, Dutch VOC)."},{"id":"em-c10","f":"Mercantilism","b":"Policy that wealth = bullion; seek a favorable trade balance; colonies serve the mother country."},{"id":"em-c11","f":"Putting-out system","b":"Merchants supplied raw materials to rural households for spinning and weaving, bypassing guilds."},{"id":"em-c12","f":"Philip II","b":"King of Spain (1556–1598); Catholic champion; Lepanto; the Armada; faced the Dutch Revolt."},{"id":"em-c13","f":"Spanish Armada","b":"Philip II's fleet sent against England in 1588; defeated."},{"id":"em-c14","f":"St. Bartholomew's Day Massacre","b":"1572 slaughter of Huguenots by Catholics in Paris and beyond."},{"id":"em-c15","f":"Edict of Nantes","b":"Henry IV's 1598 grant of religious toleration and fortified towns to Huguenots."},{"id":"em-c16","f":"Politiques","b":"Those who put political unity and peace above religious uniformity (e.g., Henry IV, Bodin)."},{"id":"em-c17","f":"Richelieu","b":"Louis XIII's chief minister; intendants; crushed Huguenot military power; raison d'état."},{"id":"em-c18","f":"Divine right of kings","b":"Belief that monarchs receive authority from God and answer only to God (James I)."},{"id":"em-c19","f":"Petition of Right","b":"1628: Parliament forbade Charles I to tax without consent, imprison arbitrarily, quarter troops, or impose martial law."},{"id":"em-c20","f":"Defenestration of Prague","b":"1618 Bohemian Protestant revolt that began the Thirty Years' War."},{"id":"em-c21","f":"Peace of Westphalia","b":"1648: ended the Thirty Years' War; recognized Calvinism and Dutch/Swiss independence; sovereign states."},{"id":"em-c22","f":"Heliocentric theory","b":"Copernicus' 1543 model placing the Sun at the center of the universe."},{"id":"em-c23","f":"Galileo","b":"Used the telescope to support Copernicus; forced by the Inquisition to recant (1633)."},{"id":"em-c24","f":"Baroque","b":"Dramatic, emotional, grand art style of the 1600s linked to the Catholic Reformation (Bernini, Caravaggio, Rubens)."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Francis Bacon<\/th><th>René Descartes<\/th><\/tr><\/thead><tbody><tr><td>Method<\/td><td><strong>Inductive<\/strong>: from many observations to general laws<\/td><td><strong>Deductive<\/strong>: from certain first principles to conclusions<\/td><\/tr><tr><td>Starting point<\/td><td>Experiment, experience (<strong>empiricism<\/strong>)<\/td><td>Doubt everything; \"I think, therefore I am\" (<strong>rationalism<\/strong>)<\/td><\/tr><tr><td>Key work<\/td><td><em>Novum Organum<\/em> (1620)<\/td><td><em>Discourse on Method<\/em> (1637)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Old view (Ptolemy, Aristotle, Galen)<\/th><th>New view<\/th><\/tr><\/thead><tbody><tr><td>Universe<\/td><td>Earth at center; perfect circles<\/td><td>Sun at center (Copernicus); ellipses (Kepler)<\/td><\/tr><tr><td>Heavens<\/td><td>Perfect, unchanging<\/td><td>Moon mountains, Jupiter's moons (Galileo)<\/td><\/tr><tr><td>Body<\/td><td>Galen's anatomy<\/td><td>Vesalius' dissections; Harvey's circulation<\/td><\/tr><tr><td>Source of truth<\/td><td>Ancient authority<\/td><td>Observation, math, experiment<\/td><\/tr><\/tbody><\/table><\/div>"}],"questions":[{"id":"ne-q001","u":"ne","d":"e","pool":"quiz","q":"The earliest known system of writing, cuneiform, was developed by which people?","p":"","o":["Sumerians","Egyptians","Phoenicians","Hebrews","Persians"],"a":0,"w":["Sumerians pressed wedge-shaped cuneiform into clay tablets around 3200 BCE.","Egyptians developed hieroglyphics, a different picture-based script.","Phoenicians spread a simple alphabet much later, around 1100 BCE.","The Hebrews are known for ethical monotheism, not for inventing writing.","Persia rose in the 500s BCE, more than 2,000 years after cuneiform appeared."]},{"id":"ne-q002","u":"ne","d":"e","pool":"pe1","q":"A stepped temple-tower built to honor a Mesopotamian city's patron god is called a","p":"","o":["pyramid","satrapy","acropolis","ziggurat","polis"],"a":3,"w":["Pyramids were Egyptian royal tombs, not Mesopotamian temples.","A satrapy was a Persian province.","An acropolis was the fortified hill of a Greek city.","Ziggurats were the stepped temple-towers at the heart of Sumerian cities.","A polis was a Greek city-state."]},{"id":"ne-q003","u":"ne","d":"e","pool":"quiz","q":"The Code of Hammurabi is significant chiefly because it","p":"","o":["was an early written law code displayed publicly for all to see","established equal punishments for all social classes","introduced the idea of monotheism to Mesopotamia","created a democratic assembly in Babylon","abolished slavery in the Babylonian Empire"],"a":0,"w":["Its laws were carved on a stone pillar and publicly displayed, a step toward rule of law.","Its penalties explicitly varied by class: nobles, commoners, and slaves were treated differently.","Monotheism is associated with the Hebrews (and briefly Akhenaten), not Hammurabi.","Hammurabi was an absolute king; Babylon had no democratic assembly.","The code assumed slavery existed and set rules for slaves."]},{"id":"ne-q004","u":"ne","d":"e","pool":"pe2","q":"Which river's predictable annual flooding allowed a stable, unified civilization to develop?","p":"","o":["Tigris","Nile","Euphrates","Tiber","Jordan"],"a":1,"w":["The Tigris flooded unpredictably and violently.","The Nile flooded on a regular schedule, leaving fertile silt and supporting Egypt's long stability.","The Euphrates, like the Tigris, flooded unpredictably.","The Tiber is Rome's river and is not associated with early river-valley civilization.","The Jordan is a small river in the Levant, not the basis of a great river civilization."]},{"id":"ne-q005","u":"ne","d":"e","pool":"quiz","q":"The Phoenicians' most lasting contribution to Western civilization was","p":"","o":["the first written law code","the first coined money","monotheistic religion","the use of iron weapons","an alphabet that the Greeks later adapted"],"a":4,"w":["Early law codes came from Mesopotamia (e.g., Hammurabi).","The Lydians are credited with the first coins.","Monotheism is the Hebrews' great legacy.","Iron-working is associated with the Hittites.","The 22-letter Phoenician alphabet passed to the Greeks, who added vowels, and then to Rome."]},{"id":"ne-q006","u":"ne","d":"e","pool":"pe2","q":"The Hebrews' religion differed from most other ancient Near Eastern religions primarily because it","p":"","o":["had no sacred writings","centered on worship of the pharaoh as a god","taught a cosmic struggle between two equal gods","required human sacrifice at a ziggurat","worshipped a single God who demanded ethical behavior"],"a":4,"w":["The Hebrews had the Torah and Hebrew Bible.","God-kings were Egyptian, not Hebrew.","Dualism of good and evil gods describes Zoroastrianism.","Ziggurats were Mesopotamian; human sacrifice was not part of Hebrew worship.","Ethical monotheism (one God who requires justice and moral conduct) was the Hebrews' distinctive idea."]},{"id":"ne-q007","u":"ne","d":"e","pool":"pe1","q":"The Persian king who conquered Babylon in 539 BCE and allowed the Jews to return to Jerusalem was","p":"","o":["Nebuchadnezzar II","Darius I","Cyrus the Great","Hammurabi","Sargon of Akkad"],"a":2,"w":["Nebuchadnezzar was the Chaldean king who destroyed Jerusalem and exiled the Jews.","Darius came later and is known for administration: satrapies and the Royal Road.","Cyrus took Babylon in 539 BCE and was famous for tolerance, letting the exiles go home.","Hammurabi ruled Babylon over a thousand years earlier.","Sargon founded the first empire around 2340 BCE."]},{"id":"ne-q008","u":"ne","d":"e","pool":"pe2","q":"Which people are best known for ruling their empire through military terror and mass deportation of conquered populations?","p":"","o":["Persians","Phoenicians","Lydians","Assyrians","Hebrews"],"a":3,"w":["Persia was known for tolerance toward conquered peoples.","The Phoenicians were traders and colonizers, not conquering terror-states.","The Lydians are known for coinage.","Assyria used iron-armed armies, terror, and deportation (as with Israel in 722 BCE).","The Hebrews were more often victims of conquest than conquerors."]},{"id":"ne-q009","u":"ne","d":"e","pool":"diag","q":"The Neolithic Revolution refers to the","p":"","o":["invention of iron weapons by the Hittites","spread of the Phoenician alphabet","conversion of Egypt to monotheism under Akhenaten","shift from hunting and gathering to farming and herding","rise of the Persian Empire"],"a":3,"w":["Iron-working came thousands of years later.","The alphabet spread around 1100 BCE, long after farming began.","Akhenaten's reforms came around 1350 BCE.","Agriculture beginning around 10,000 BCE produced food surpluses that made cities possible.","Persia rose in the 500s BCE."]},{"id":"ne-q010","u":"ne","d":"e","pool":"pe1","q":"Satraps were","p":"","o":["priests who served at Mesopotamian ziggurats","Egyptian scribes who wrote in hieroglyphics","governors of provinces in the Persian Empire","Hebrew prophets who criticized injustice","Assyrian siege engineers"],"a":2,"w":["Priests served at ziggurats, but they were not called satraps.","Scribes were not called satraps.","Darius I divided Persia into satrapies, each run by a satrap.","Hebrew prophets were figures such as Amos and
