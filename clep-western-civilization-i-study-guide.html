    if (el) { const s = Math.ceil(ms / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; el.classList.toggle("low", s < 300); }
  }
  function go(n) { cur.idx = Math.max(0, Math.min(qs.length - 1, n)); save(); render(); window.scrollTo(0, 0); }
  function pick(k) { cur.answers[qs[cur.idx].id] = k; save(); render(); }
  function submit(auto) {
    if (!auto) {
      const left = qs.length - Object.keys(cur.answers).length;
      if (!confirm(left ? `You have ${left} unanswered question(s). Submit anyway?` : "Submit now?")) return;
    }
    if (timer) clearInterval(timer);
    keys = null;
    onSubmit(qs, auto);
  }
  acts.pick = el => pick(+el.dataset.i);
  acts.prev = () => go(cur.idx - 1);
  acts.nextq = () => go(cur.idx + 1);
  acts.go = el => go(+el.dataset.n);
  acts.flag = () => { const id = qs[cur.idx].id; cur.flags[id] = !cur.flags[id]; save(); render(); };
  acts.grid = () => { showGrid = !showGrid; render(); };
  acts.submit = () => submit(false);
  keys = e => {
    const k = keyIndex(e);
    if (k >= 0) { e.preventDefault(); pick(k); }
    else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); if (cur.idx + 1 < qs.length) go(cur.idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur.idx - 1); }
    else if (e.key.toLowerCase() === "f") { e.preventDefault(); acts.flag(); }
  };
  if (timed) { timer = setInterval(tick, 1000); cleanup.push(() => clearInterval(timer)); }
  render();
}

function cardSession(deck, scope) {
  let i = 0, flipped = false, got = 0, miss = 0; const requeued = new Set();
  function render() {
    if (i >= deck.length) {
      view.innerHTML = `<h1>Session done</h1><div class="card"><div class="stat">${got}/${got + miss}<small>remembered</small></div><p>Cards you missed are in box 1 and flagged for "Review missed only".</p>

      keys = null; renderSide(); return;
    }
    const c = deck[i], st = S.cards[c.id];
    view.innerHTML = `<div class="qhead"><a class="small" href="#/cards${scope ? "/" + scope : ""}">← End session</a><span class="small muted">Card ${i + 1} of ${deck.length} · ${esc(UBY[c.u].title)}</span></div>
    ${bar(pct(i, deck.length))}
    <div class="fc ${flipped ? "flip" : ""}" data-act="flip"><div class="fc-inner">
      <div class="fc-face"><span class="fc-meta">${st ? "Box " + st.b : "New"}</span><div class="fc-front">${c.f}</div><div class="small muted" style="margin-top:14px">tap or <span class="kbd">Space</span> to flip</div></div>
      <div class="fc-face back"><span class="fc-meta">${c.f.replace(/<[^>]+>/g, "")}</span><div class="fc-back">${c.b}</div></div>
    </div></div>
    <div class="row" style="justify-content:center;${flipped ? "" : "visibility:hidden"}">
      <button class="btn" data-act="grade" data-ok="0" style="border-color:var(--bad)">✗ Missed <span class="kbd">1</span></button>
      <button class="btn pri" data-act="grade" data-ok="1">✓ Got it <span class="kbd">2</span></button>
    </div>`;
  }
  function grade(ok) {
    if (!flipped) return;
    const c = deck[i], st = S.cards[c.id] || { b: 1, n: 0 };
    st.n = (st.n || 0) + 1;
    if (ok) { st.b = Math.min(5, (S.cards[c.id] ? st.b : 1) + 1); st.due = Date.now() + BOX_DAYS[st.b] * DAY; st.lm = false; got++; }
    else { st.b = 1; st.due = Date.now(); st.lm = true; miss++; if (!requeued.has(c.id)) { requeued.add(c.id); deck.push(c); } }
    S.cards[c.id] = st; save();
    i++; flipped = false; render();
  }
  acts.flip = () => { flipped = !flipped; render(); };
  acts.grade = (el, e) => { e.stopPropagation(); grade(el.dataset.ok === "1"); };
  keys = e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!flipped) { flipped = true; render(); } else if (e.key === "Enter") grade(true); }
    else if (e.key === "1") grade(false);
    else if (e.key === "2") grade(true);
  };
  render();
}

/* ---------------- study plan ---------------- */
function planTasks() {
  const t = [];
  if (!S.diag) t.push({ h: 0.75, label: "Diagnostic test (30 questions)", href: "#/diagnostic" });
  U.forEach((u, i) => {
    if (unitDone(u.id)) return;
    const f = unitRec(u.id) === "skim" ? 0.5 : 1, read = uState(u.id).read;
    const total = u.studyHours * f, lessonH = read ? 0 : total * 0.45;
    const tag = unitRec(u.id) === "skim" ? " (skim)" : "";
    if (lessonH) t.push({ h: lessonH, label: `Unit ${i + 1} lesson${tag}: ${u.title}. Read, then must-know + timeline`, href: `#/unit/${u.id}` });
    t.push({ h: total - lessonH, label: `Unit ${i + 1} practice${tag}: new flashcards + ${u.quizN}-question quiz, review misses`, href: `#/unit/${u.id}/quiz` });
  });
  return t;
}
function buildPlan(hpd, examDate) {
  const start = today0(), end = new Date(examDate + "T00:00:00");
  const days = Math.round((end - start) / DAY); // study days before exam day
  if (!(hpd > 0) || isNaN(days)) return { err: "Enter hours per day and an exam date." };
  if (days < 1) return { err: "Pick an exam date at least 1 day from today." };
  const reviewDaily = Math.min(0.25, hpd * 0.2);
  const exams = [1, 2].filter(n => !S.exams[n].attempts.length);
  const tail = []; // last days: exams
  exams.forEach(n => tail.push([{ h: 1.5, label: `Practice Exam ${n}: timed, 90 min, no pausing`, href: `#/exam/${n}` }, { h: 1, label: `Review Exam ${n} misses: drill mistake log and weakest topics`, href: "#/mistakes" }]));
  const tailDays = Math.min(tail.length, days);
  const studyDays = days - tailDays;
  const tasks = planTasks();
  const plan = [];
  for (let d = 0; d < days; d++) plan.push({ date: new Date(start.getTime() + d * DAY), items: [], h: 0 });
  // split tasks so they can fit across days
  const cap = Math.max(0.25, hpd - reviewDaily);
  const queue = [];
  tasks.forEach(t => { let left = t.h, part = 1; const parts = Math.ceil(t.h / cap - 1e-9);
    while (left > 1e-6) { const h = Math.min(left, cap); queue.push({ h, label: parts > 1 ? `${t.label} (part ${part}/${parts})` : t.label, href: t.href }); left -= h; part++; } });
  let d = 0, overflow = 0;
  for (const t of queue) {
    while (d < studyDays && plan[d].h + t.h > cap + 1e-6 && plan[d].h > 0) d++;
    if (d >= studyDays) { overflow += t.h; (plan[Math.max(0, studyDays - 1)] || plan[0]).items.push(Object.assign({ over: true }, t)); continue; }
    plan[d].items.push(t); plan[d].h += t.h;
  }
  // fill remaining study days with review
  for (let k = 0; k < studyDays; k++) {
    if (plan[k].h < cap - 0.2 && k > d) plan[k].items.push({ h: Math.min(1, cap - plan[k].h), label: "Buffer: drill mistake log, redraw the cheat sheet timeline", href: "#/mistakes" });
  }
  // exams on last days (1–2 days before exam)
  tail.forEach((items, k) => {
    const late = k >= tailDays, day = plan[days - tailDays + Math.min(k, tailDays - 1)];
    items.forEach(t => { day.items.push(late ? Object.assign({ over: true }, t) : t); day.h += t.h; });
    if (late) overflow += 2.5;
  });
  // daily flashcards + final day cheat sheet
  plan.forEach(p => { p.items.unshift({ h: reviewDaily, label: "Flashcards: review due cards", href: "#/cards" }); });
  plan[days - 1].items.push({ h: 0.5, label: "Final: redraw cheat sheet from memory; no new material", href: "#/cheatsheet" });
  const need = tasks.reduce((a, t) => a + t.h, 0) + exams.length * 2.5;
  return { plan, days, need, have: days * hpd, overflow };
}
function planPage() {
  setTitle("Study plan");
  const def = S.plan.date || isoDate(new Date(Date.now() + 21 * DAY));
  view.innerHTML = `<h1>Study plan generator</h1>
  <p class="sub">Builds a day-by-day schedule from what you have left (it uses your diagnostic: skim units get half the time). Practice exams land on the last 1–2 days before your test.</p>
  <div class="card noprint"><div class="row">
    <div><label class="f" for="hpd">Hours per day</label><input type="number" id="hpd" min="0.25" max="12" step="0.25" value="${S.plan.hpd}"></div>
    <div><label class="f" for="edate">Exam date</label><input type="date" id="edate" value="${def}" min="${isoDate(new Date(Date.now() + DAY))}"></div>
    <div style="align-self:flex-end" class="row"><button class="btn pri" data-act="gen">Generate plan</button><button class="btn" data-act="print">Print</button></div>
  </div><p class="small muted" style="margin:10px 0 0">Estimated work remaining: <b>${fmtH(hoursLeft())}</b>.</p></div>
  <div id="planOut"></div>`;
  const gen = () => {
    S.plan.hpd = parseFloat($("#hpd").value); S.plan.date = $("#edate").value; save();
    const r = buildPlan(S.plan.hpd, S.plan.date);
    if (r.err) { $("#planOut").innerHTML = `<div class="card">${esc(r.err)}</div>`; return; }
    const tight = r.overflow > 0.01;
    $("#planOut").innerHTML = `<div class="card ${tight ? "" : ""}">
      <b>${r.days} study day${r.days > 1 ? "s" : ""}</b> before ${new Date(S.plan.date + "T00:00:00").toDateString()} · you have ~${fmtH(r.have)}, the plan needs ~${fmtH(r.need + r.days * Math.min(0.25, S.plan.hpd * .2))}.
      ${tight ? `<p class="feedback bad">Not enough time: about ${fmtH(r.overflow)} doesn't fit (marked ⚠). Raise hours per day to ~${(Math.ceil((r.need / r.days + 0.25) * 4) / 4).toFixed(2)} or move the exam date.</p>` : `<p class="feedback ok">Fits. Follow it in order; if you fall behind, regenerate.</p>`}
    </div>
    <div class="card" style="padding:6px 12px"><div class="tblwrap" style="margin:0"><table><thead><tr><th style="width:120px">Day</th><th>Tasks</th><th style="width:70px">Time</th></tr></thead><tbody>
    ${r.plan.map((p, k) => `<tr><td><b>Day ${k + 1}</b><div class="small muted">${p.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div></td>
      <td>${p.items.map(t => `<div>${t.over ? "⚠ " : ""}<a href="${t.href}">${esc(t.label)}</a> <span class="small muted">${fmtH(t.h)}</span></div>`).join("")}</td>
      <td>${fmtH(p.items.reduce((a, t) => a + t.h, 0))}</td></tr>`).join("")}
    <tr><td><b>Exam day</b><div class="small muted">${new Date(S.plan.date + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div></td><td>Light flashcard warm-up only. Bring ID; ~45 s per question; answer every item.</td><td></td></tr>
    </tbody></table></div></div>`;
  };
  acts.gen = gen; acts.print = () => window.print();
  if (S.plan.date) gen();
}

function progressPage() {
  setTitle("Progress & data");
  const cs = cardStats();
  view.innerHTML = `<h1>Progress</h1>
  <div class="grid g3">

  </div>
  ${unitTable()}
  <h2>Quiz history</h2><div class="card" style="padding:6px 12px"><table><thead><tr><th>Unit</th><th>Attempts</th><th>Last</th><th>Best</th></tr></thead><tbody>
  ${U.map(u => { const a = uState(u.id).quiz; return `<tr><td>${esc(u.title)}</td><td>${a.length}</td><td>${a.length ? a[a.length - 1].p + "%" : "—"}</td><td>${a.length ? quizBest(u.id) + "%" : "—"}</td></tr>`; }).join("")}
  </tbody></table></div>
  <h2>Practice exams</h2><div class="card">${[1, 2].map(n => { const a = S.exams[n].attempts; return `<div>Exam ${n}: ${a.length ? a.map(x => x.score + "%").join(" → ") : "not taken"}</div>`; }).join("")}</div>
  <h2>Save or move your progress</h2>
  <div class="card"><p class="small">Progress is stored in this browser${storageOK ? "" : " (<b>currently blocked</b>, so export before closing!)"}. Export a JSON file to back it up or move it to another device.</p>
  <div class="row"><button class="btn pri" data-act="exp">Export progress (.json)</button><label class="btn">Import progress…<input type="file" id="imp" accept="application/json,.json" class="hide"></label><button class="btn" data-act="reset" style="color:var(--bad)">Reset everything</button></div>
  <p class="small muted" id="impMsg"></p></div>`;
  acts.exp = () => {
    const blob = new Blob([JSON.stringify({ app: "clep-wc1-study-guide", exported: new Date().toISOString(), state: S }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `clep-wc1-progress-${isoDate(new Date())}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  $("#imp").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); const st = d && d.state ? d.state : d;
        if (!st || typeof st !== "object" || !("units" in st) || !("exams" in st)) throw new Error("not a progress file");
        if (!confirm("Replace your current progress with this file?")) return;
        S = normalize(st); save(); applyTheme(); route();
      } catch (err) { $("#impMsg").textContent = "Import failed: " + err.message; }
    };
    rd.readAsText(f);
  };
  acts.reset = () => { if (confirm("Erase ALL progress (diagnostic, quizzes, cards, mistakes, exams)? Export first if unsure.")) { S = defaults(); save(); route(); } };
}

  <p class="small muted">Shares use the midpoint of each official range, normalized to 100%. Medieval History (23–27%) is split into two equal units. Question pools never overlap: diagnostic ${DATA.pools.diag.length}, unit quizzes ${Q.filter(q => q.pool === "quiz").length}, Practice Exam 1 ${DATA.pools.pe1.length}, Practice Exam 2 ${DATA.pools.pe2.length}.</p></div>
