<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP Western Civ I Study Guide</title>
<meta name="description" content="Self-paced, offline study guide for the CLEP Western Civilization I exam (Ancient Near East to 1648).">
<style>
:root{
  --bg:#f8f6f1; --surface:#ffffff; --surface2:#f1eee6; --text:#1f1d1a; --muted:#6a645a; --line:#e2ddd2;
  --accent:#2f4b8a; --accent-soft:#e6ecf8; --accent-text:#ffffff;
  --ok:#23704a; --ok-soft:#e3f3ea; --bad:#a83434; --bad-soft:#f8e6e4; --warn:#94650b; --warn-soft:#fbf0d9;
  --mk:#fff8e3; --mk-line:#e7c766;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, Cambria, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --surface2:#252932; --text:#e7e4dd; --muted:#a29c90; --line:#323743;
  --accent:#8fa9e8; --accent-soft:#263252; --accent-text:#10131a;
  --ok:#6ccf98; --ok-soft:#173326; --bad:#f08a8a; --bad-soft:#3b1f22; --warn:#e5b95a; --warn-soft:#3a2f17;
  --mk:#2b2716; --mk-line:#8a7430;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1d2027; --surface2:#252932; --text:#e7e4dd; --muted:#a29c90; --line:#323743;
    --accent:#8fa9e8; --accent-soft:#263252; --accent-text:#10131a;
    --ok:#6ccf98; --ok-soft:#173326; --bad:#f08a8a; --bad-soft:#3b1f22; --warn:#e5b95a; --warn-soft:#3a2f17;
    --mk:#2b2716; --mk-line:#8a7430; --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 24px}
.brand{font-weight:700;font-size:15px;line-height:1.25;padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.nav .dot.done{background:var(--ok)}
.nav .dot.part{background:var(--warn)}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0}
.top{display:none}
.wrap{max-width:780px;margin:0 auto;padding:28px 20px 80px}
.wrap.wide{max-width:1060px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
h2{font-size:21px;margin:30px 0 10px}
h3{font-size:18px;margin:24px 0 8px}
h4{font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin:14px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
.stat{font-size:26px;font-weight:700;line-height:1.1}
.stat small{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin:12px 0}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;font-size:14px;border-bottom:1px solid var(--line)}
/* lesson */
.lesson{font-family:var(--serif);font-size:18px;line-height:1.65}
.lesson p{margin:0 0 14px}
.lesson h3{font-family:var(--sans);font-size:19px;margin-top:30px;padding-top:6px}
.lesson h4{font-family:var(--sans)}
.lesson strong{font-weight:700}
.lesson ul{padding-left:22px;margin:0 0 14px}
.lesson table{font-family:var(--sans)}
.lesson blockquote{margin:14px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 18px;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.chain-step{background:var(--surface);border:1px solid var(--line);padding:10px 12px;position:relative}
.chain-step:first-child{border-radius:10px 0 0 10px}
.chain-step:last-child{border-radius:0 10px 10px 0}
.chain-step+.chain-step{border-left:none}
.chain-step+.chain-step::before{content:"→";position:absolute;left:-9px;top:50%;transform:translateY(-50%);background:var(--bg);color:var(--accent);font-weight:700;width:16px;text-align:center}
.chain-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:2px}
.mustknow{background:var(--mk);border:1px solid var(--mk-line);border-radius:12px;padding:16px 18px;margin:22px 0}
.mustknow h3{margin:0 0 8px;font-size:17px}
.mustknow ol{margin:0;padding-left:22px}
.mustknow li{margin:5px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.toc a{font-size:13.5px;padding:4px 10px;border-radius:99px;background:var(--surface2);text-decoration:none;color:var(--text)}
/* timeline */
.tl{position:relative;margin:12px 0;padding-left:0}
.tl-item{display:grid;grid-template-columns:118px 18px 1fr;align-items:start;min-height:34px}
.tl-year{text-align:right;padding-right:8px;font-weight:700;font-size:14px;color:var(--accent);padding-top:5px;font-variant-numeric:tabular-nums}
.tl-axis{position:relative;align-self:stretch}
.tl-axis::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-axis::after{content:"";position:absolute;left:4px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-item.key .tl-axis::after{background:var(--accent)}
.tl-text{padding:4px 0 10px 6px;font-size:15px}
.tl-item.key .tl-text{font-weight:600}
.tl.hide-dates .tl-year span{filter:blur(6px);cursor:pointer;user-select:none}
.tl.hide-dates .tl-year span.shown{filter:none}
.tl-gap{grid-column:1/-1;font-size:11px;color:var(--muted);padding-left:136px;margin:-4px 0 4px}
/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qstem{font-size:17.5px;line-height:1.5;margin:6px 0 12px;font-weight:500}
.qpass blockquote{margin:0 0 12px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-family:var(--serif);font-size:16.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-text)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .why{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.opt.right .why,.opt.wrong .why{color:var(--text)}
.opt[disabled]{cursor:default}
.opt-body{flex:1}
.feedback{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.kbd{display:inline-block;font:600 12px/1 var(--sans);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--muted)}
.timer{font:700 20px/1 var(--sans);font-variant-numeric:tabular-nums;padding:7px 12px;border-radius:9px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:12px 0}
.qgrid button{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;position:relative}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qgrid button.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qgrid button.r-ok{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.r-bad{background:var(--bad-soft);border-color:var(--bad)}
/* flashcards */
.fc{perspective:1200px;margin:10px 0}
.fc-inner{position:relative;min-height:230px;transition:transform .35s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.fc-face.back{transform:rotateY(180deg)}
.fc-front{font-size:24px;font-weight:700;font-family:var(--serif)}
.fc-back{font-size:17px;line-height:1.5}
.fc-meta{position:absolute;top:10px;left:14px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.fc-inner{transition:none}}
.boxes{display:flex;gap:4px;align-items:flex-end;height:46px}
.boxes div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.boxes div.new{background:var(--line)}
/* readiness */
.meter{position:relative;height:16px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--warn),var(--ok));border-radius:99px}
.ready-badge{font-size:18px;font-weight:800;padding:8px 14px;border-radius:10px;display:inline-block}
.ready-badge.yes{background:var(--ok-soft);color:var(--ok)}
.ready-badge.no{background:var(--surface2);color:var(--muted)}
.checklist{list-style:none;padding:0;margin:10px 0 0}
.checklist li{padding:4px 0 4px 26px;position:relative}
.checklist li::before{content:"○";position:absolute;left:4px;color:var(--muted)}
.checklist li.y::before{content:"✓";color:var(--ok);font-weight:700}
/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=number],input[type=date],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-height:42px}
/* cheat sheet */
.cheat{font-size:12.5px;line-height:1.35}
.cheat h2{font-size:15px;margin:10px 0 4px;border-bottom:2px solid var(--accent);padding-bottom:2px}
.cheat h3{font-size:13px;margin:8px 0 3px;color:var(--accent)}
.cheat-cols{columns:3 260px;column-gap:18px}
.cheat-cols>section{break-inside:avoid-column;margin-bottom:6px}
.cheat .ev{display:flex;gap:6px;padding:1px 0}
.cheat .ev b{flex:0 0 74px;text-align:right;font-variant-numeric:tabular-nums}
.cheat .pp{padding:1px 0}
.cheat table{font-size:11.5px}
.cheat th,.cheat td{padding:2px 4px}
.cheat .tblwrap{margin:4px 0}
.cheat.redraw .hideable{background:var(--surface2);color:transparent;border-radius:3px;cursor:pointer}
.cheat.redraw .hideable.shown{background:none;color:inherit}
.cheat.redraw .hideable *{color:transparent}
.cheat.redraw .hideable.shown *{color:inherit}
.verified{color:var(--ok)} .unverified{color:var(--warn)}
.footer-keys{margin-top:16px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width: 860px){
  .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px}
  .top .t{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap{padding:18px 16px 70px}
  h1{font-size:24px}
  .lesson{font-size:17px}
  .chain{grid-template-columns:1fr}
  .chain-step,.chain-step:first-child,.chain-step:last-child{border-radius:0;border-left:1px solid var(--line)!important}
  .chain-step:first-child{border-radius:10px 10px 0 0}
  .chain-step:last-child{border-radius:0 0 10px 10px}
  .chain-step+.chain-step{border-top:none}
  .chain-step+.chain-step::before{content:"↓";left:50%;top:-10px;transform:translateX(-50%)}
  .tl-item{grid-template-columns:86px 18px 1fr}
  .tl-gap{padding-left:104px}
  .tl-year{font-size:13px}
}
.scrim{display:none}
@media (max-width:860px){.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}}
@media print{
  @page{size:letter landscape;margin:.3in}
  body{background:#fff;color:#000;font-size:10pt}
  .side,.top,.noprint,.banner,.scrim{display:none!important}
  .wrap,.wrap.wide{max-width:none;padding:0}
  .card{box-shadow:none;border:none;padding:0;margin:0}
  .cheat{font-size:6.6pt;line-height:1.22;color:#000}
  .cheat h1{font-size:11pt;margin:0}
  .cheat h2{font-size:7.6pt;margin:3px 0 1px;border-bottom-width:1px;color:#000}
  .cheat h3{font-size:7pt;margin:3px 0 1px}
  .cheat-cols{columns:4;column-gap:10px}
  .cheat .ev b{flex-basis:50px}
  .cheat table{font-size:6.2pt}
  .cheat th,.cheat td{padding:0 2px;border-color:#bbb}
  .cheat .hideable{color:#000!important;background:none!important}
  .cheat .hideable *{color:#000!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div id="banner" class="banner hide"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="top">
      <button class="btn sm" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="t" id="topTitle">CLEP Western Civ I</div>
      <button class="btn sm" data-act="theme" aria-label="Toggle dark mode">◐</button>
    </div>
    <main id="view" class="wrap" tabindex="-1"></main>
  </div>
</div>

const DATA = {"outline":{"exam":"CLEP Western Civilization I: Ancient Near East to 1648","source_urls":["https://clep.collegeboard.org/history-and-social-sciences/western-civilization-1","https://secure-media.collegeboard.org/digitalServices/pdf/clep/western_civilization_I_fact_sheet.pdf"],"verification_note":"The College Board hosts were blocked by this build environment's network policy (connect_rejected), so the pages could not be loaded directly. Question count, time, and all six percentage ranges were confirmed through web-search results that quote the official College Board page and fact sheet (retrieved 2026-10-15). Items marked verified=false come from memory or third-party prep sites and should be checked against the official page.","retrieved":"2026-10-15","format":{"questions":{"value":"approximately 120","verified":true,"note":"Some are unscored pretest questions."},"time_minutes":{"value":90,"verified":true},"question_type":{"value":"multiple choice, 5 options","verified":false},"scaled_passing_score":{"value":"50 on a 20-80 scale (ACE recommendation)","verified":false},"credit_recommendation":{"value":"3 semester hours (ACE)","verified":false}},"topics":[{"id":"ne","name":"Ancient Near East","weight":"8%-10%","min":8,"max":10,"verified":true,"subtopics":[{"name":"Political evolution","verified":true},{"name":"Religion, culture, and technical developments in and near the Fertile Crescent","verified":true}]},{"id":"greece","name":"Ancient Greece and Hellenistic Civilization","weight":"15%-17%","min":15,"max":17,"verified":true,"subtopics":[{"name":"Political evolution to Periclean Athens","verified":false},{"name":"Periclean Athens to the Peloponnesian Wars","verified":true},{"name":"Culture, religion, and thought of ancient Greece","verified":false},{"name":"Hellenistic political structure","verified":true},{"name":"Hellenistic culture, religion, and thought","verified":true}]},{"id":"rome","name":"Ancient Rome","weight":"15%-17%","min":15,"max":17,"verified":true,"subtopics":[{"name":"Political evolution of the Republic and of the Empire (political, economic, and social)","verified":true},{"name":"Roman thought and culture","verified":true},{"name":"Early Christianity","verified":true},{"name":"The Germanic invasions","verified":true}]},{"id":"medieval","name":"Medieval History","weight":"23%-27%","min":23,"max":27,"verified":true,"subtopics":[{"name":"Byzantium and Islam","verified":true},{"name":"Early medieval politics and culture through Charlemagne","verified":true},{"name":"Feudal and manorial institutions","verified":false},{"name":"The medieval Church","verified":false},{"name":"Medieval thought and culture","verified":false},{"name":"Rise of the towns and changing economic forms","verified":false},{"name":"Feudal monarchies","verified":false},{"name":"The late medieval Church","verified":false}]},{"id":"rr","name":"Renaissance and Reformation","weight":"13%-17%","min":13,"max":17,"verified":true,"subtopics":[{"name":"The Renaissance in Italy","verified":false},{"name":"The Renaissance outside Italy","verified":false},{"name":"The New Monarchies","verified":false},{"name":"Protestantism and Catholicism reformed and reorganized","verified":false}]},{"id":"early_modern","name":"Early Modern Europe, 1560-1648","weight":"10%-15%","min":10,"max":15,"verified":true,"subtopics":[{"name":"The opening of the Atlantic","verified":true},{"name":"The Commercial Revolution","verified":true},{"name":"Dynastic and religious conflicts","verified":true},{"name":"Thought and culture","verified":true}]}],"unit_plan":{"basis":"Midpoint of each official range, normalized to 100% (midpoints sum to 93.5%). Medieval History (25% midpoint) is split into two units of equal weight.","units":[{"id":"ne","topic":"ne","title":"Ancient Near East","share":9.6,"quiz":10,"exam_each":11,"diag":3,"cards":17,"lesson_min":10,"study_hours":1.5},{"id":"gr","topic":"greece","title":"Ancient Greece & the Hellenistic World","share":17.1,"quiz":15,"exam_each":21,"diag":5,"cards":31,"lesson_min":18,"study_hours":2.5},{"id":"ro","topic":"rome","title":"Ancient Rome & Early Christianity","share":17.1,"quiz":15,"exam_each":21,"diag":5,"cards":31,"lesson_min":18,"study_hours":2.5},{"id":"ema","topic":"medieval","title":"Early Middle Ages: Byzantium, Islam, Franks, Feudalism","share":13.4,"quiz":12,"exam_each":16,"diag":4,"cards":24,"lesson_min":14,"study_hours":2.0},{"id":"hma","topic":"medieval","title":"High & Late Middle Ages","share":13.4,"quiz":12,"exam_each":16,"diag":4,"cards":24,"lesson_min":14,"study_hours":2.0},{"id":"rr","topic":"rr","title":"Renaissance & Reformation","share":16.0,"quiz":14,"exam_each":19,"diag":5,"cards":29,"lesson_min":17,"study_hours":2.5},{"id":"em","topic":"early_modern","title":"Early Modern Europe, 1560-1648","share":13.4,"quiz":12,"exam_each":16,"diag":4,"cards":24,"lesson_min":14,"study_hours":2.0}],"totals":{"questions":360,"diagnostic":30,"unit_quizzes":90,"practice_exam_each":120,"flashcards":180}}},"units":[{"id":"ne","title":"Ancient Near East","topic":"ne","share":9.6,"quizN":10,"examN":11,"diagN":3,"cardTarget":17,"lessonMin":10,"studyHours":1.5,"intro":"Where civilization starts: farming, cities, writing, law codes, empires, and the first monotheism. Small slice of the exam (8–10%), but the ideas reappear everywhere later.","lesson":"<h3>1. Why here? The Fertile Crescent<\/h3>\n<p>The <strong>Fertile Crescent<\/strong> is the arc of good farmland running from Egypt's Nile valley up through the eastern Mediterranean coast and down the <strong>Tigris and Euphrates<\/strong> rivers in <strong>Mesopotamia<\/strong> (Greek for \"land between the rivers,\" modern Iraq). Around <strong>10,000 BCE<\/strong> people here began planting crops and herding animals: the <strong>Neolithic (Agricultural) Revolution<\/strong>.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Farming produces a food surplus<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Permanent villages grow into cities<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Specialized jobs, social classes, government, and writing appear<\/div><\/div>\n<p>A surplus meant not everyone had to farm. Some people became priests, scribes, soldiers, and artisans. Historians call a society with cities, organized government, organized religion, job specialization, social classes, writing, and public works a <strong>civilization<\/strong>.<\/p>\n<h3>2. Sumer: the first cities<\/h3>\n<p>By about <strong>3500 BCE<\/strong>, the <strong>Sumerians<\/strong> in southern Mesopotamia had built independent <strong>city-states<\/strong> such as <strong>Ur<\/strong>, <strong>Uruk<\/strong>, and <strong>Lagash<\/strong>. Each controlled its own farmland and fought its neighbors over water and borders. Rivers here flooded <strong>unpredictably and violently<\/strong>, so the Sumerians needed large <strong>irrigation<\/strong> systems and strong leaders to organize labor.<\/p>\n<ul><li><strong>Religion:<\/strong> <strong>polytheism<\/strong> (many gods who controlled nature). Each city had a patron god honored in a stepped temple-tower called a <strong>ziggurat<\/strong>. Priests were powerful; early rulers were often priest-kings, later war-kings (<em>lugal<\/em>).<\/li><li><strong>Worldview:<\/strong> gloomy. The gods were moody, and the afterlife was a dim \"land of no return.\"<\/li><li><strong>Writing:<\/strong> <strong>cuneiform<\/strong> (\"wedge-shaped\"), pressed into clay tablets with a reed stylus, <strong>c. 3200 BCE<\/strong>. It began as record-keeping for temples and trade.<\/li><li><strong>Literature:<\/strong> the <strong>Epic of Gilgamesh<\/strong>, the story of a king of Uruk searching for immortality. It contains a <strong>flood story<\/strong> strikingly like Noah's.<\/li><li><strong>Technology &amp; science:<\/strong> the <strong>wheel<\/strong>, the plow, bronze tools, and a <strong>base-60 number system<\/strong>. That is why we still have 60-minute hours and 360-degree circles.<\/li><\/ul>\n<h3>3. Empires of Mesopotamia<\/h3>\n<p>Rich but disunited city-states were easy prey. Around <strong>2340 BCE<\/strong>, <strong>Sargon of Akkad<\/strong> conquered Sumer and built history's <strong>first empire<\/strong> (one ruler over many peoples and cities).<\/p>\n<p>Later, <strong>Hammurabi<\/strong> of <strong>Babylon<\/strong> (ruled c. 1792–1750 BCE) unified Mesopotamia and issued the <strong>Code of Hammurabi<\/strong>: about 282 laws carved on a stone pillar so everyone could see them. Key features:<\/p>\n<ul><li><strong>\"An eye for an eye\"<\/strong> (retribution, <em>lex talionis<\/em>).<\/li><li>Punishments depended on <strong>social class<\/strong>: injuring a noble cost more than injuring a commoner or slave.<\/li><li>Laws covered trade, wages, marriage, and property. The king claimed the god Shamash gave him the authority to make law.<\/li><\/ul>\n<p>The big idea to remember: <strong>written law<\/strong>, publicly displayed, was a step toward rule of law, but it was <strong>not<\/strong> equality before the law.<\/p>\n<h3>4. Egypt: gift of the Nile<\/h3>\n<p>Egypt grew along the <strong>Nile<\/strong>, which flooded <strong>predictably<\/strong> every year and left rich silt. Deserts on both sides protected Egypt from invasion. The results: <strong>stability<\/strong>, a unified state, and an <strong>optimistic<\/strong> religion.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Predictable Nile floods + desert barriers<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Unified, stable kingdom lasting ~3,000 years<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Confident, optimistic culture focused on the afterlife<\/div><\/div>\n<p>Around <strong>3100 BCE<\/strong>, <strong>Menes<\/strong> (also called <strong>Narmer<\/strong>) united <strong>Upper Egypt<\/strong> (the south, upriver) and <strong>Lower Egypt<\/strong> (the delta in the north). The ruler, the <strong>pharaoh<\/strong>, was considered a <strong>living god<\/strong> who maintained <strong>ma'at<\/strong>, the divine order of truth, justice, and balance.<\/p>\n<p>Egyptian history divides into three \"kingdoms\" separated by periods of disorder:<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Period<\/th><th>Dates (approx.)<\/th><th>Highlights<\/th><\/tr><\/thead><tbody><tr><td><strong>Old Kingdom<\/strong><\/td><td>2700–2200 BCE<\/td><td>\"Age of the Pyramids\"; Great Pyramid of <strong>Khufu<\/strong> at <strong>Giza<\/strong> (c. 2560 BCE)<\/td><\/tr><tr><td><strong>Middle Kingdom<\/strong><\/td><td>2050–1650 BCE<\/td><td>Public works, trade; ended when the <strong>Hyksos<\/strong> invaded and introduced the horse-drawn <strong>chariot<\/strong><\/td><\/tr><tr><td><strong>New Kingdom<\/strong><\/td><td>1550–1070 BCE<\/td><td>Empire into Syria-Palestine; <strong>Hatshepsut<\/strong> (female pharaoh, trade expeditions); <strong>Thutmose III<\/strong>; <strong>Akhenaten<\/strong>; <strong>Ramses II<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Akhenaten<\/strong> (c. 1350 BCE) tried to make Egyptians worship only one god, the sun disk <strong>Aten<\/strong>, a radical, short-lived experiment that priests reversed after his death (his successor was the boy-king <strong>Tutankhamun<\/strong>). <strong>Ramses II<\/strong> fought the <strong>Hittites<\/strong> at the <strong>Battle of Kadesh (1274 BCE)<\/strong>; the two powers later signed one of history's first recorded <strong>peace treaties<\/strong>.<\/p>\n<p>Egyptian culture to know: <strong>hieroglyphics<\/strong> (picture-writing on stone and <strong>papyrus<\/strong>), deciphered in 1822 using the <strong>Rosetta Stone<\/strong>, which had the same text in Greek and two Egyptian scripts. <strong>Mummification<\/strong> and the <strong>Book of the Dead<\/strong> reflected belief in an afterlife judged by <strong>Osiris<\/strong>, where your heart was weighed against the feather of ma'at. Egyptians also built a 365-day solar calendar and practiced advanced medicine and geometry for surveying flooded fields.<\/p>\n<h3>5. Small peoples, big legacies<\/h3>\n<p>Around <strong>1200 BCE<\/strong>, the <strong>Late Bronze Age collapse<\/strong> hit the region: invasions by the mysterious <strong>Sea Peoples<\/strong>, drought, and trade breakdown toppled the Hittite Empire and weakened Egypt. Iron-working, pioneered by the <strong>Hittites<\/strong> of Anatolia (modern Turkey), spread widely afterward. In the power vacuum, smaller peoples flourished.<\/p>\n<p><strong>Phoenicians<\/strong> (coastal cities <strong>Tyre<\/strong> and <strong>Sidon<\/strong>, modern Lebanon) were seafaring <strong>traders<\/strong>, famous for purple dye and for founding colonies such as <strong>Carthage<\/strong> in North Africa. Their great gift: a simple <strong>alphabet<\/strong> of about 22 consonant symbols (c. 1100 BCE). The <strong>Greeks<\/strong> adopted it and added vowels, and the <strong>Romans<\/strong> adapted the Greek version. You are reading its descendant now.<\/p>\n<p><strong>Lydians<\/strong> (western Anatolia) were the first to use <strong>coined money<\/strong> (c. 600s BCE), which made trade far easier.<\/p>\n<h3>6. The Hebrews: ethical monotheism<\/h3>\n<p>The <strong>Hebrews<\/strong> (Israelites) left the most important religious legacy of the ancient Near East. Their history is recorded in the <strong>Hebrew Bible<\/strong>, whose first five books are the <strong>Torah<\/strong>.<\/p>\n<ul><li><strong>Abraham<\/strong> made a <strong>covenant<\/strong> (binding agreement) with God: God would protect his descendants, and they would obey God.<\/li><li><strong>Moses<\/strong> led the <strong>Exodus<\/strong> from slavery in Egypt and received the <strong>Ten Commandments<\/strong> on Mount Sinai.<\/li><li>Their faith was <strong>monotheism<\/strong>: one all-powerful God who is not part of nature. It was <strong>ethical monotheism<\/strong> because God demanded moral behavior and justice, not just ritual. <strong>Prophets<\/strong> such as <strong>Amos, Isaiah, and Jeremiah<\/strong> condemned the rich for oppressing the poor.<\/li><\/ul>\n<p>Political story:<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Unified kingdom under <strong>Saul<\/strong>, <strong>David<\/strong> (capital <strong>Jerusalem<\/strong>), and <strong>Solomon<\/strong> (built the <strong>Temple<\/strong>)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Kingdom splits c. 922 BCE into <strong>Israel<\/strong> (north) and <strong>Judah<\/strong> (south)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Israel falls to <strong>Assyria (722 BCE)<\/strong>; Judah falls to <strong>Babylon (586 BCE)<\/strong><\/div><\/div>\n<p>In <strong>586 BCE<\/strong>, the Chaldean (Neo-Babylonian) king <strong>Nebuchadnezzar II<\/strong> destroyed Jerusalem and the Temple and deported the leaders to Babylon: the <strong>Babylonian Captivity (Exile)<\/strong>. Far from home, the exiles preserved their identity through scripture and law, which is why Judaism survived when other conquered faiths vanished. The scattering of Jews outside their homeland is called the <strong>Diaspora<\/strong>.<\/p>\n<h3>7. The great empires: Assyria and Persia<\/h3>\n<p><strong>Assyria<\/strong> (capital <strong>Nineveh<\/strong>) built an empire through a ruthless, efficient army using <strong>iron weapons<\/strong>, siege engines, and deliberate <strong>terror<\/strong>. Assyrians <strong>deported<\/strong> conquered peoples to break rebellions (as with Israel in 722 BCE). Their king <strong>Ashurbanipal<\/strong> collected a huge library of cuneiform tablets. Hatred ran deep: in <strong>612 BCE<\/strong> the <strong>Chaldeans<\/strong> (Neo-Babylonians) and <strong>Medes<\/strong> destroyed Nineveh. The Chaldeans' <strong>Nebuchadnezzar II<\/strong> rebuilt Babylon in splendor (the legendary Hanging Gardens) and advanced astronomy.<\/p>\n<p><strong>Persia<\/strong> built the largest empire yet, and it ruled very differently:<\/p>\n<ul><li><strong>Cyrus the Great<\/strong> (founded the empire c. 550 BCE) conquered Babylon in <strong>539 BCE<\/strong> and became famous for <strong>tolerance<\/strong>. He let local peoples keep their customs and religions and allowed the Jews to <strong>return to Jerusalem<\/strong> and rebuild the Temple.<\/li><li><strong>Darius I<\/strong> (522–486 BCE) organized the empire into provinces called <strong>satrapies<\/strong>, each run by a governor (<strong>satrap<\/strong>), watched by royal inspectors known as the \"<strong>eyes and ears of the king<\/strong>.\" He built the <strong>Royal Road<\/strong> (about 1,600 miles from Sardis to Susa), standardized coins, weights, and measures, and began the ceremonial capital <strong>Persepolis<\/strong>.<\/li><li>Darius and his son <strong>Xerxes<\/strong> later invaded Greece (the Persian Wars, Unit 2).<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Assyria rules by terror<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Conquered peoples revolt; Nineveh destroyed 612 BCE<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Persia learns the lesson: rules by tolerance and good administration, and lasts over 200 years<\/div><\/div>\n<p><strong>Zoroastrianism<\/strong>, founded by the prophet <strong>Zoroaster (Zarathustra)<\/strong>, became Persia's major faith. It taught a cosmic struggle between <strong>Ahura Mazda<\/strong> (god of good and light) and <strong>Ahriman<\/strong> (evil and darkness), <strong>free will<\/strong> to choose sides, and a <strong>final judgment<\/strong> with heaven and hell. This <strong>dualism<\/strong> may have influenced later Jewish, Christian, and Islamic ideas about the devil and the afterlife.<\/p>\n<h3>Big picture for the exam<\/h3>\n<p>The exam asks you to <strong>match a people to its contribution<\/strong>: Sumerians = cuneiform, ziggurats, wheel, base-60; Babylonians = Hammurabi's code; Egyptians = pharaoh-gods, pyramids, hieroglyphs; Hittites = iron, chariots; Phoenicians = alphabet and trade; Lydians = coins; Hebrews = ethical monotheism; Assyrians = military terror; Persians = tolerant administration (satrapies, Royal Road) and Zoroastrian dualism.<\/p>","words":1405,"mustKnow":["<strong>Sumer<\/strong> (southern Mesopotamia): first city-states, <strong>cuneiform<\/strong> (c. 3200 BCE), <strong>ziggurats<\/strong>, the wheel, base-60 math, the <strong>Epic of Gilgamesh<\/strong> (includes a flood story).","<strong>Sargon of Akkad<\/strong> (c. 2340 BCE) created the <strong>first empire<\/strong>.","<strong>Code of Hammurabi<\/strong> (Babylon, c. 1754 BCE): written public law, \"eye for an eye,\" punishments varied by <strong>social class<\/strong>.","<strong>Mesopotamia vs. Egypt:<\/strong> unpredictable floods and open borders gave Mesopotamia warring city-states and a pessimistic religion; the predictable <strong>Nile<\/strong> and desert barriers gave Egypt unity, stability, and an optimistic afterlife.","<strong>Pharaoh<\/strong> = living god maintaining <strong>ma'at<\/strong>; Old Kingdom = <strong>pyramids<\/strong>; <strong>Akhenaten<\/strong> = worship of <strong>Aten<\/strong> alone; <strong>Rosetta Stone<\/strong> unlocked <strong>hieroglyphics<\/strong>.","<strong>Phoenicians<\/strong> spread the <strong>alphabet<\/strong> (adopted by the Greeks, who added vowels); <strong>Lydians<\/strong> invented <strong>coined money<\/strong>; <strong>Hittites<\/strong> pioneered <strong>iron<\/strong>.","<strong>Hebrews:<\/strong> <strong>ethical monotheism<\/strong>, covenant, Ten Commandments, prophets demanding social justice; Israel fell to <strong>Assyria (722 BCE)<\/strong>, Judah to <strong>Babylon (586 BCE)<\/strong>, the <strong>Babylonian Captivity<\/strong>.","<strong>Assyria<\/strong> ruled by <strong>terror and deportation<\/strong>; Nineveh fell in <strong>612 BCE<\/strong>.","<strong>Persia:<\/strong> <strong>Cyrus<\/strong> = tolerance, freed the Jews (539 BCE); <strong>Darius<\/strong> = <strong>satrapies<\/strong>, <strong>Royal Road<\/strong>, standardized coinage.","<strong>Zoroastrianism:<\/strong> dualism of <strong>Ahura Mazda<\/strong> vs. <strong>Ahriman<\/strong>, free will, final judgment."],"timeline":[{"y":-10000.0,"label":"c. 10,000 BCE","text":"<strong>Neolithic Revolution<\/strong>: farming begins in the Fertile Crescent","key":true},{"y":-3500.0,"label":"c. 3500 BCE","text":"Sumerian city-states (Ur, Uruk) arise in southern Mesopotamia","key":false},{"y":-3200.0,"label":"c. 3200 BCE","text":"<strong>Cuneiform<\/strong> writing in Sumer; hieroglyphics appear in Egypt soon after","key":true},{"y":-3100.0,"label":"c. 3100 BCE","text":"<strong>Menes (Narmer)<\/strong> unites Upper and Lower Egypt","key":true},{"y":-2560.0,"label":"c. 2560 BCE","text":"Great Pyramid of Khufu at Giza (Old Kingdom)","key":false},{"y":-2340.0,"label":"c. 2340 BCE","text":"<strong>Sargon of Akkad<\/strong> builds the first empire","key":true},{"y":-1754.0,"label":"c. 1754 BCE","text":"<strong>Code of Hammurabi<\/strong> in Babylon","key":true},{"y":-1650.0,"label":"c. 1650 BCE","text":"Hyksos invade Egypt, bringing the horse-drawn chariot","key":false},{"y":-1550.0,"label":"c. 1550 BCE","text":"Egypt's New Kingdom: the age of empire","key":false},{"y":-1350.0,"label":"c. 1350 BCE","text":"<strong>Akhenaten<\/strong> promotes worship of Aten alone","key":false},{"y":-1274.0,"label":"1274 BCE","text":"Battle of Kadesh: Ramses II vs. the Hittites","key":false},{"y":-1200.0,"label":"c. 1200 BCE","text":"Late Bronze Age collapse; Sea Peoples; iron spreads","key":true},{"y":-1100.0,"label":"c. 1100 BCE","text":"Phoenician alphabet spreads by trade","key":false},{"y":-1000.0,"label":"c. 1000 BCE","text":"David makes Jerusalem the capital; Solomon builds the Temple","key":false},{"y":-922.0,"label":"c. 922 BCE","text":"Hebrew kingdom splits into Israel (north) and Judah (south)","key":false},{"y":-722.0,"label":"722 BCE","text":"<strong>Assyria<\/strong> conquers Israel and deports its people","key":true},{"y":-612.0,"label":"612 BCE","text":"Nineveh destroyed; Assyrian Empire ends","key":true},{"y":-586.0,"label":"586 BCE","text":"<strong>Nebuchadnezzar II<\/strong> destroys the Temple; Babylonian Captivity begins","key":true},{"y":-539.0,"label":"539 BCE","text":"<strong>Cyrus the Great<\/strong> takes Babylon and lets the Jews return","key":true},{"y":-522.0,"label":"522–486 BCE","text":"<strong>Darius I<\/strong>: satrapies, Royal Road, standard coinage","key":false}],"people":[{"name":"Sargon of Akkad","desc":"Conquered Sumer c. 2340 BCE; first empire"},{"name":"Hammurabi","desc":"Babylonian king; law code, \"eye for an eye,\" class-based penalties"},{"name":"Menes (Narmer)","desc":"United Upper and Lower Egypt c. 3100 BCE"},{"name":"Akhenaten","desc":"Pharaoh who promoted worship of the sun disk Aten alone"},{"name":"Ramses II","desc":"New Kingdom pharaoh; fought the Hittites at Kadesh"},{"name":"Moses","desc":"Led the Exodus; received the Ten Commandments"},{"name":"Nebuchadnezzar II","desc":"Chaldean king; destroyed Jerusalem 586 BCE; rebuilt Babylon"},{"name":"Cyrus the Great","desc":"Founded the Persian Empire; tolerant; freed the Jews (539 BCE)"},{"name":"Darius I","desc":"Organized Persia into satrapies; built the Royal Road"},{"name":"Zoroaster","desc":"Persian prophet; dualism of Ahura Mazda vs. Ahriman"}],"cards":[{"id":"ne-c1","f":"Fertile Crescent","b":"Arc of farmland from the Nile through the eastern Mediterranean coast to the Tigris–Euphrates valley; birthplace of farming and the first cities."},{"id":"ne-c2","f":"Neolithic Revolution","b":"Shift from hunting-gathering to farming and herding (c. 10,000 BCE); the food surplus made cities and specialization possible."},{"id":"ne-c3","f":"Cuneiform","b":"Sumerian wedge-shaped writing pressed into clay tablets (c. 3200 BCE); began as record-keeping."},{"id":"ne-c4","f":"Ziggurat","b":"Stepped Mesopotamian temple-tower honoring a city's patron god."},{"id":"ne-c5","f":"Epic of Gilgamesh","b":"Mesopotamian poem about a king of Uruk seeking immortality; includes a great-flood story."},{"id":"ne-c6","f":"Sargon of Akkad","b":"Conquered the Sumerian city-states c. 2340 BCE, creating the world's first empire."},{"id":"ne-c7","f":"Code of Hammurabi","b":"Babylonian law code (c. 1754 BCE) displayed in public; \"eye for an eye\"; punishments varied by social class."},{"id":"ne-c8","f":"Ma'at","b":"Egyptian principle of cosmic order, truth, and justice that the god-king pharaoh was responsible for upholding."},{"id":"ne-c9","f":"Rosetta Stone","b":"Stone with one decree in Greek and two Egyptian scripts; key to deciphering hieroglyphics (1822)."},{"id":"ne-c10","f":"Akhenaten","b":"New Kingdom pharaoh (c. 1350 BCE) who tried to replace traditional gods with worship of the sun disk Aten alone."},{"id":"ne-c11","f":"Hittites","b":"Anatolian empire known for early iron-working and chariots; fought Egypt at Kadesh (1274 BCE)."},{"id":"ne-c12","f":"Phoenicians","b":"Seafaring traders of Tyre and Sidon; spread a 22-letter consonant alphabet; founded Carthage."},{"id":"ne-c13","f":"Ethical monotheism","b":"Hebrew belief in one God who demands moral behavior and justice, not just ritual."},{"id":"ne-c14","f":"Babylonian Captivity (Exile)","b":"Deportation of Judah's leaders to Babylon after Nebuchadnezzar II destroyed Jerusalem's Temple in 586 BCE."},{"id":"ne-c15","f":"Assyrians","b":"Iron-armed, militaristic empire (capital Nineveh) that ruled by terror and mass deportation; fell in 612 BCE."},{"id":"ne-c16","f":"Satrapy","b":"Province of the Persian Empire run by a governor (satrap) and checked by the king's inspectors, the \"eyes and ears of the king.\""},{"id":"ne-c17","f":"Zoroastrianism","b":"Persian religion of Zoroaster: dualism of Ahura Mazda (good) vs. Ahriman (evil), free will, final judgment."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Mesopotamia<\/th><th>Egypt<\/th><\/tr><\/thead><tbody><tr><td>Rivers<\/td><td>Tigris &amp; Euphrates: unpredictable, violent floods<\/td><td>Nile: predictable yearly flood<\/td><\/tr><tr><td>Geography<\/td><td>Open plains, easily invaded<\/td><td>Deserts protect it<\/td><\/tr><tr><td>Politics<\/td><td>Rival city-states, then a string of conquering empires<\/td><td>Unified kingdom under a divine pharaoh<\/td><\/tr><tr><td>Religion<\/td><td>Pessimistic; gloomy afterlife<\/td><td>Optimistic; rewarding afterlife (Osiris)<\/td><\/tr><tr><td>Writing<\/td><td>Cuneiform on clay<\/td><td>Hieroglyphics on stone/papyrus<\/td><\/tr><tr><td>Monuments<\/td><td>Ziggurats (temples)<\/td><td>Pyramids (royal tombs)<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"gr","title":"Ancient Greece & the Hellenistic World","topic":"greece","share":17.1,"quizN":15,"examN":21,"diagN":5,"cardTarget":31,"lessonMin":12,"studyHours":2.5,"intro":"The Greeks invented the polis, democracy, philosophy, history writing, and drama; then Alexander spread Greek culture from Egypt to India. This is one of the two biggest ancient units (15–17%).","lesson":"<h3>1. Geography and the Bronze Age<\/h3>\n<p>Greece is mountains and sea. The <strong>mountains<\/strong> split the land into small valleys, so Greeks never formed one country. Instead they built hundreds of independent city-states. The <strong>sea<\/strong> made them traders and colonizers.<\/p>\n<p>Two Bronze Age civilizations came first:<\/p>\n<ul><li><strong>Minoans<\/strong> on the island of <strong>Crete<\/strong> (c. 2000–1450 BCE): sea traders with a huge palace at <strong>Knossos<\/strong>, colorful frescoes, and an undeciphered script (<strong>Linear A<\/strong>). Named by archaeologists after the legendary King Minos.<\/li><li><strong>Mycenaeans<\/strong> on the mainland (c. 1600–1100 BCE): warrior-kings in fortified palaces (Mycenae), who wrote an early form of Greek (<strong>Linear B<\/strong>). Their war against <strong>Troy<\/strong> (c. 1200 BCE) became legend.<\/li><\/ul>\n<p>After the Late Bronze Age collapse (c. 1100 BCE), Greece fell into a <strong>Dark Age<\/strong> (c. 1100–800 BCE): trade shrank and <strong>writing was lost<\/strong>. Around 750 BCE, the poet <strong>Homer<\/strong> gave Greeks a shared cultural memory with the <strong>Iliad<\/strong> (the Trojan War, the hero Achilles) and the <strong>Odyssey<\/strong> (Odysseus' journey home). Homer's heroes model <strong>arete<\/strong>: excellence, courage, and honor.<\/p>\n<h3>2. The polis and the Archaic Age (800–500 BCE)<\/h3>\n<p>The <strong>polis<\/strong> (city-state) was a city plus its surrounding farmland, run by its <strong>citizens<\/strong>. Each had a fortified hill (<strong>acropolis<\/strong>) with temples and an open marketplace and meeting place (<strong>agora<\/strong>). Greeks felt loyalty first to their polis. What united them was <strong>language, religion, and festivals<\/strong> such as the <strong>Olympic Games<\/strong> (traditionally first held <strong>776 BCE<\/strong>) honoring <strong>Zeus<\/strong>. Greeks also consulted oracles, above all the <strong>Oracle of Apollo at Delphi<\/strong>.<\/p>\n<p>Overpopulation and land hunger drove <strong>colonization<\/strong> (c. 750–550 BCE) around the Mediterranean and Black Sea, including southern Italy and Sicily (<strong>Magna Graecia<\/strong>) and Massilia (Marseille).<\/p>\n<p>How governments changed:<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Iron weapons are cheaper; middle-class farmers can afford armor<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Citizen-soldiers fight as <strong>hoplites<\/strong> in a tight shield wall, the <strong>phalanx<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>The men who defend the polis demand a political voice, weakening aristocrats<\/div><\/div>\n<p>A common sequence: <strong>monarchy<\/strong> (a king) → <strong>aristocracy/oligarchy<\/strong> (rule by a few rich nobles) → <strong>tyranny<\/strong> (one man seizes power, often with popular support; \"tyrant\" did not yet mean cruel) → <strong>democracy<\/strong> (rule by the citizens).<\/p>\n<h3>3. Sparta vs. Athens<\/h3>\n<p><strong>Sparta<\/strong> (in the Peloponnese) conquered its neighbors and turned them into <strong>helots<\/strong>, state-owned serfs who outnumbered Spartans many times over. Fear of helot revolt made Sparta a <strong>military state<\/strong>:<\/p>\n<ul><li>Boys entered the state training system (<strong>agoge<\/strong>) at <strong>age 7<\/strong>; men served in the army until 60.<\/li><li>Government (credited to the lawgiver <strong>Lycurgus<\/strong>) was an <strong>oligarchy<\/strong> with <strong>two kings<\/strong>, five elected <strong>ephors<\/strong> who ran daily affairs, a <strong>council of elders<\/strong>, and an assembly of citizens.<\/li><li>Spartan <strong>women<\/strong> had unusual freedom: they exercised, <strong>owned property<\/strong>, and ran estates while men served.<\/li><li>Sparta discouraged trade, luxury, and outside ideas and led the <strong>Peloponnesian League<\/strong>.<\/li><\/ul>\n<p><strong>Athens<\/strong> went the other way: toward democracy, step by step.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Leader<\/th><th>Date<\/th><th>What he did<\/th><\/tr><\/thead><tbody><tr><td><strong>Draco<\/strong><\/td><td>621 BCE<\/td><td>First written law code, famously harsh (death for small crimes): our word \"draconian\"<\/td><\/tr><tr><td><strong>Solon<\/strong><\/td><td>594 BCE<\/td><td><strong>Cancelled debts and banned debt slavery<\/strong>; ranked citizens by wealth, not birth<\/td><\/tr><tr><td><strong>Peisistratus<\/strong><\/td><td>560s–527 BCE<\/td><td>Popular tyrant; helped small farmers; public works and festivals<\/td><\/tr><tr><td><strong>Cleisthenes<\/strong><\/td><td>508/507 BCE<\/td><td><strong>\"Father of Athenian democracy\"<\/strong>: reorganized citizens into <strong>10 tribes<\/strong>, created the <strong>Council of 500<\/strong> (chosen by lot), introduced <strong>ostracism<\/strong> (voting to exile a dangerous man for 10 years)<\/td><\/tr><tr><td><strong>Pericles<\/strong><\/td><td>461–429 BCE<\/td><td>Golden Age leader; <strong>paid citizens for jury and public service<\/strong> so the poor could participate<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Athenian democracy was <strong>direct<\/strong>: citizens voted in the <strong>Assembly<\/strong> themselves, and many officials were chosen <strong>by lot<\/strong>. But it was limited. Only <strong>adult males with citizen parents<\/strong> (Pericles' law of 451 BCE required both parents) could take part. <strong>Women, slaves, and metics<\/strong> (resident foreigners) were excluded.<\/p>\n<h4>How Athenian democracy actually worked<\/h4>\n<ul><li><strong>Assembly (Ekklesia):<\/strong> all male citizens, meeting about 40 times a year on the Pnyx hill; voted directly on war, peace, and laws.<\/li><li><strong>Council of 500 (Boule):<\/strong> 50 men from each of the 10 tribes, chosen <strong>by lot<\/strong> for one year; prepared the Assembly's agenda.<\/li><li><strong>Courts:<\/strong> huge juries (often 201 to 501 citizens) chosen by lot. No professional judges or lawyers; citizens argued their own cases.<\/li><li><strong>Generals (strategoi):<\/strong> the one major office that was <strong>elected<\/strong>, not chosen by lot, because it needed skill. Ten were chosen each year and could be re-elected; Pericles held the office for years.<\/li><li>The older <strong>Areopagus<\/strong> council of ex-officials (aristocratic) lost most of its power in the 460s.<\/li><\/ul>\n<h4>Daily life: households, women, slaves<\/h4>\n<p>The Greek household (<em>oikos<\/em>) was the basic economic unit. In Athens, <strong>women<\/strong> married young, managed the home, and had <strong>no political rights<\/strong>; respectable women rarely appeared in public except at religious festivals. <strong>Slavery<\/strong> was everywhere: perhaps a third of Athens' population was enslaved, mostly war captives and non-Greeks, working in homes, workshops, and the brutal <strong>Laurium silver mines<\/strong> that funded the navy. Aristotle even defended \"natural slavery.\" The paradox the exam likes: <strong>Athens' freedom for citizens rested on the unfreedom of many others.<\/strong><\/p>\n<p>Most Greeks were small farmers growing the \"Mediterranean triad\" of <strong>grain, olives, and grapes<\/strong>. Thin soil pushed Athens to import grain from the Black Sea, which is why control of the sea mattered so much.<\/p>\n<h3>4. The Persian Wars (499–479 BCE)<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Ionian Greek cities in Asia Minor revolt against Persia (499 BCE), and Athens sends help<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Darius I<\/strong>, then <strong>Xerxes<\/strong>, invade Greece<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Greek victory; Athens' confidence and power soar<\/div><\/div>\n<ul><li><strong>Marathon (490 BCE):<\/strong> Athenian hoplites defeat Darius' landing force. (A runner's legendary dash to Athens gave us the marathon.)<\/li><li><strong>Thermopylae (480 BCE):<\/strong> King <strong>Leonidas<\/strong> and <strong>300 Spartans<\/strong> (with allies) hold a mountain pass against Xerxes' huge army before being wiped out.<\/li><li><strong>Salamis (480 BCE):<\/strong> <strong>Themistocles<\/strong> lures the Persian fleet into narrow straits, where Athenian <strong>triremes<\/strong> (oared warships) crush it. This was the decisive naval battle.<\/li><li><strong>Plataea (479 BCE):<\/strong> combined Greek army, led by Sparta, defeats the Persian army on land.<\/li><\/ul>\n<p>The historian <strong>Herodotus<\/strong>, the \"<strong>father of history<\/strong>,\" wrote the story of these wars, mixing research with legend.<\/p>\n<h3>5. Athens' Golden Age and the Peloponnesian War<\/h3>\n<p>After the war, Athens organized the <strong>Delian League<\/strong> (478 BCE), an alliance of Aegean cities paying into a treasury on the island of Delos to defend against Persia. Athens gradually turned it into an <strong>Athenian empire<\/strong>: it forced members to stay, and in 454 BCE moved the treasury to Athens. Pericles used the money to rebuild the <strong>Acropolis<\/strong>, including the <strong>Parthenon<\/strong> (temple of Athena, <strong>Doric<\/strong> style, sculptures supervised by <strong>Phidias<\/strong>).<\/p>\n<p>Sparta and its allies feared Athenian power. The result was the <strong>Peloponnesian War (431–404 BCE)<\/strong>:<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Fear of Athens' growing empire (Thucydides' explanation)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Athens (sea power) vs. Sparta (land power), 27 years of war<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Athens defeated; all of Greece exhausted and open to outside conquest<\/div><\/div>\n<ul><li><strong>Pericles' strategy:<\/strong> keep everyone behind Athens' <strong>Long Walls<\/strong> to the port and rely on the navy. Then a <strong>plague (430 BCE)<\/strong> swept the crowded city and killed Pericles (429 BCE).<\/li><li><strong>Sicilian Expedition (415–413 BCE):<\/strong> Athens, urged on by <strong>Alcibiades<\/strong>, attacked Syracuse and lost its whole force, a catastrophe.<\/li><li>Sparta built a navy with <strong>Persian gold<\/strong> and destroyed Athens' fleet at <strong>Aegospotami (405 BCE)<\/strong>. Athens surrendered in <strong>404 BCE<\/strong>, and Sparta installed the brutal \"<strong>Thirty Tyrants<\/strong>\" (soon overthrown).<\/li><\/ul>\n<p>The historian <strong>Thucydides<\/strong>, an Athenian general, wrote the war's history with critical analysis of causes and evidence and without divine explanations. He preserved <strong>Pericles' Funeral Oration<\/strong>, a famous praise of Athenian democracy. Afterward, Sparta and then <strong>Thebes<\/strong> (victory at Leuctra, 371 BCE) briefly dominated a weakened Greece.<\/p>\n<h3>6. Greek culture and thought<\/h3>\n<p><strong>Religion:<\/strong> Olympian gods with human personalities; public festivals; no sacred scripture or powerful priestly class. This left room for rational inquiry.<\/p>\n<p><strong>Drama<\/strong> grew out of festivals for <strong>Dionysus<\/strong>. Tragedies often show a great person destroyed by <strong>hubris<\/strong> (excessive pride), followed by divine punishment (<em>nemesis<\/em>).<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Writer<\/th><th>Type<\/th><th>Known for<\/th><\/tr><\/thead><tbody><tr><td><strong>Aeschylus<\/strong><\/td><td>Tragedy<\/td><td><em>Oresteia<\/em>: from blood revenge to justice through courts<\/td><\/tr><tr><td><strong>Sophocles<\/strong><\/td><td>Tragedy<\/td><td><em>Oedipus Rex<\/em>, <em>Antigone<\/em> (divine law vs. the state's law)<\/td><\/tr><tr><td><strong>Euripides<\/strong><\/td><td>Tragedy<\/td><td><em>Medea<\/em>, <em>The Trojan Women<\/em>: realistic, questioned war and tradition<\/td><\/tr><tr><td><strong>Aristophanes<\/strong><\/td><td>Comedy<\/td><td><em>Lysistrata<\/em>, <em>The Clouds<\/em>: political satire (mocked Socrates)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Philosophy<\/strong> began when thinkers sought <strong>natural, rational explanations<\/strong> instead of myths:<\/p>\n<ul><li><strong>Thales<\/strong> of Miletus: everything is made of <strong>water<\/strong> (the first to look for a natural first substance). <strong>Pythagoras<\/strong>: reality is explained by <strong>numbers<\/strong>. <strong>Democritus<\/strong>: everything is made of tiny <strong>atoms<\/strong>.<\/li><li><strong>Hippocrates<\/strong>: \"father of medicine.\" Disease has <strong>natural causes<\/strong>, not divine ones; the Hippocratic Oath.<\/li><li><strong>Sophists<\/strong>: paid teachers of <strong>rhetoric<\/strong> who taught that truth is relative. <strong>Protagoras<\/strong>: \"<strong>Man is the measure of all things.<\/strong>\"<\/li><\/ul>\n<p>The big three (learn the order <strong>S-P-A<\/strong>: each taught the next):<\/p>\n<ul><li><strong>Socrates<\/strong> (469–399 BCE) wrote nothing. He used the <strong>Socratic method<\/strong>, asking probing questions to expose ignorance and reach truth. \"<strong>The unexamined life is not worth living.<\/strong>\" Athens executed him in <strong>399 BCE<\/strong> (by hemlock) for impiety and \"corrupting the youth.\"<\/li><li><strong>Plato<\/strong> (Socrates' student) founded the <strong>Academy<\/strong>. In his <strong>Theory of Forms<\/strong>, the physical world is a shadow of perfect, unchanging ideas (the <strong>Allegory of the Cave<\/strong>). In the <strong>Republic<\/strong>, he described an ideal state ruled by <strong>philosopher-kings<\/strong>. He distrusted democracy, which had killed his teacher.<\/li><li><strong>Aristotle<\/strong> (Plato's student; tutor of Alexander) founded the <strong>Lyceum<\/strong>. He relied on <strong>observation and classification<\/strong> (biology), formal <strong>logic<\/strong> (the syllogism), and in <em>Politics<\/em> favored a balanced, <strong>mixed constitution<\/strong>; in <em>Ethics<\/em>, the <strong>golden mean<\/strong> (virtue lies between extremes). His works later shaped Islamic and medieval Christian thought (Aquinas).<\/li><\/ul>\n<p><strong>Art and architecture:<\/strong> Classical style aimed at <strong>balance, proportion, and idealized human beauty<\/strong>. Three column orders: <strong>Doric<\/strong> (plain; the Parthenon), <strong>Ionic<\/strong> (scroll capitals), and <strong>Corinthian<\/strong> (leafy, ornate).<\/p>\n<h3>7. Macedon and Alexander the Great<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Greek city-states exhaust each other in endless wars<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Philip II<\/strong> of Macedon, with a reformed phalanx using long pikes (<em>sarissas<\/em>), defeats Athens and Thebes at <strong>Chaeronea (338 BCE)<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Greek independence ends; Philip controls Greece through the League of Corinth<\/div><\/div>\n<p>Philip was assassinated in 336 BCE. His son <strong>Alexander the Great<\/strong> (ruled 336–323 BCE), taught by <strong>Aristotle<\/strong>, invaded Persia: victories at the <strong>Granicus (334)<\/strong>, <strong>Issus (333)<\/strong>, and <strong>Gaugamela (331)<\/strong> destroyed the empire of <strong>Darius III<\/strong>. He took Egypt and founded <strong>Alexandria<\/strong>, and pushed to the Indus River in <strong>India<\/strong> (326 BCE) before his exhausted army refused to go on. He died in Babylon in <strong>323 BCE<\/strong>, age 32, with no clear heir.<\/p>\n<h3>8. The Hellenistic Age (323–31 BCE)<\/h3>\n<p>\"Hellenistic\" means \"Greek-like\": a blend of Greek culture with Egyptian, Persian, and other Near Eastern cultures.<\/p>\n<p><strong>Politics:<\/strong> Alexander's generals (the <em>Diadochi<\/em>, \"successors\") split the empire into three big kingdoms ruled by Greek-Macedonian dynasties:<\/p>\n<ul><li><strong>Ptolemaic<\/strong> Egypt (capital Alexandria; its last ruler was <strong>Cleopatra VII<\/strong>)<\/li><li><strong>Seleucid<\/strong> Empire (Syria, Mesopotamia, Persia)<\/li><li><strong>Antigonid<\/strong> Macedonia (dominating Greece)<\/li><\/ul>\n<p>These were <strong>monarchies<\/strong> with Greek-speaking elites over non-Greek majorities. Rome conquered them one by one; the last, Egypt, fell in <strong>31–30 BCE<\/strong>.<\/p>\n<p><strong>Culture:<\/strong> a <strong>cosmopolitan<\/strong> world united by a common Greek dialect, <strong>koine<\/strong>. <strong>Alexandria<\/strong> became the greatest city, with its <strong>Library<\/strong> and <strong>Museum<\/strong> (a research center) and the <strong>Pharos lighthouse<\/strong>.<\/p>\n<p><strong>Science<\/strong> flourished:<\/p>\n<ul><li><strong>Euclid<\/strong>: <em>Elements<\/em>, the foundation of <strong>geometry<\/strong>.<\/li><li><strong>Archimedes<\/strong>: lever, buoyancy (\"<strong>Eureka!<\/strong>\"), approximation of pi.<\/li><li><strong>Eratosthenes<\/strong>: measured the <strong>Earth's circumference<\/strong> with remarkable accuracy.<\/li><li><strong>Aristarchus<\/strong>: proposed that the Earth revolves around the <strong>Sun<\/strong> (heliocentrism), an idea mostly rejected until Copernicus.<\/li><\/ul>\n<p><strong>Philosophy<\/strong> turned from the polis to the individual: how to find peace in a big, uncertain world?<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>School<\/th><th>Founder<\/th><th>Core idea<\/th><\/tr><\/thead><tbody><tr><td><strong>Stoicism<\/strong><\/td><td><strong>Zeno<\/strong><\/td><td>Live by reason and virtue; accept fate calmly; all people share a universal reason (<strong>natural law, brotherhood of humanity<\/strong>); do your duty. Later very popular in Rome.<\/td><\/tr><tr><td><strong>Epicureanism<\/strong><\/td><td><strong>Epicurus<\/strong><\/td><td>Goal is <strong>pleasure understood as absence of pain<\/strong> and peace of mind (<em>ataraxia<\/em>); avoid politics; the universe is atoms; gods don't interfere.<\/td><\/tr><tr><td><strong>Cynicism<\/strong><\/td><td><strong>Diogenes<\/strong><\/td><td>Reject wealth, social convention, and comfort; live simply \"like a dog.\"<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Art<\/strong> shifted from calm idealism to <strong>realism and emotion<\/strong>: wrinkled old people, suffering, and dramatic motion (<em>Laocoön<\/em>, <em>Winged Victory of Samothrace<\/em>, <em>Dying Gaul<\/em>). <strong>Religion:<\/strong> many turned to <strong>mystery religions<\/strong> (like the cult of <strong>Isis<\/strong>) that promised personal salvation.<\/p>\n<h3>Big picture for the exam<\/h3>\n<p>Know the <strong>Athens vs. Sparta<\/strong> contrast, the <strong>Athenian reformers in order<\/strong> (Draco → Solon → Peisistratus → Cleisthenes → Pericles), the <strong>Persian War battles<\/strong> and their winners, the <strong>causes and results of the Peloponnesian War<\/strong>, <strong>who said/wrote what<\/strong> (philosophers, dramatists, historians), and <strong>Classical vs. Hellenistic<\/strong> differences in politics, art, and philosophy.<\/p>","words":2035,"mustKnow":["<strong>Polis<\/strong> = independent city-state (acropolis + agora); mountains kept Greece politically divided; shared language, gods, and <strong>Olympics (776 BCE)<\/strong> united it culturally.","<strong>Hoplite phalanx<\/strong> gave middle-class citizen-soldiers political power, undermining aristocracy.","<strong>Sparta:<\/strong> helots, military training from age 7, two kings + ephors (oligarchy), women could own property.","Athens' path to democracy: <strong>Draco<\/strong> (harsh written law) → <strong>Solon<\/strong> (ended debt slavery) → <strong>Cleisthenes<\/strong> (10 tribes, Council of 500, ostracism; \"father of democracy\") → <strong>Pericles<\/strong> (pay for public service).","Athenian democracy was <strong>direct<\/strong> but excluded <strong>women, slaves, and metics<\/strong>.","Persian Wars: <strong>Marathon 490<\/strong> (Athens wins), <strong>Thermopylae 480<\/strong> (Spartan stand), <strong>Salamis 480<\/strong> (decisive naval win, Themistocles). Herodotus wrote the history.","<strong>Delian League<\/strong> became an Athenian empire → Sparta's fear → <strong>Peloponnesian War 431–404<\/strong> (plague, Sicilian disaster, Sparta wins with Persian money). Thucydides wrote the history.","<strong>Socrates<\/strong> (questioning method; executed 399) → <strong>Plato<\/strong> (Forms, Republic, philosopher-kings) → <strong>Aristotle<\/strong> (observation, logic, golden mean; tutored Alexander).","<strong>Alexander<\/strong> (336–323) conquered Persia to India; <strong>Hellenistic<\/strong> kingdoms: Ptolemaic Egypt, Seleucid Asia, Antigonid Macedon; <strong>Alexandria<\/strong> = Library and Museum.","Hellenistic thought: <strong>Stoicism<\/strong> (Zeno; virtue, duty, natural law, brotherhood), <strong>Epicureanism<\/strong> (Epicurus; tranquility as absence of pain); science of <strong>Euclid, Archimedes, Eratosthenes, Aristarchus<\/strong>; art turns <strong>realistic and emotional<\/strong>."],"timeline":[{"y":-2000.0,"label":"c. 2000 BCE","text":"Minoan palace civilization on Crete (Knossos)","key":false},{"y":-1600.0,"label":"c. 1600 BCE","text":"Mycenaean kingdoms on the mainland (Linear B)","key":false},{"y":-1200.0,"label":"c. 1200 BCE","text":"Legendary Trojan War; then Mycenaean collapse","key":false},{"y":-1100.0,"label":"c. 1100–800 BCE","text":"Greek Dark Age: writing lost","key":false},{"y":-776.0,"label":"776 BCE","text":"First Olympic Games (traditional date)","key":true},{"y":-750.0,"label":"c. 750 BCE","text":"Homer's <em>Iliad<\/em> and <em>Odyssey<\/em>; colonization begins; Greek alphabet","key":false},{"y":-621.0,"label":"621 BCE","text":"Draco's harsh law code in Athens","key":false},{"y":-594.0,"label":"594 BCE","text":"<strong>Solon<\/strong> cancels debts and ends debt slavery","key":true},{"y":-508.0,"label":"508/507 BCE","text":"<strong>Cleisthenes<\/strong>' reforms: Athenian democracy","key":true},{"y":-499.0,"label":"499 BCE","text":"Ionian Revolt against Persia","key":false},{"y":-490.0,"label":"490 BCE","text":"<strong>Battle of Marathon<\/strong>: Athens defeats Darius","key":true},{"y":-480.0,"label":"480 BCE","text":"<strong>Thermopylae<\/strong> and <strong>Salamis<\/strong>: Xerxes' invasion stopped","key":true},{"y":-479.0,"label":"479 BCE","text":"Plataea: Persian army defeated","key":false},{"y":-478.0,"label":"478 BCE","text":"Delian League formed under Athens","key":false},{"y":-461.0,"label":"461–429 BCE","text":"<strong>Age of Pericles<\/strong>; Parthenon built (447–432)","key":true},{"y":-431.0,"label":"431–404 BCE","text":"<strong>Peloponnesian War<\/strong>: Sparta defeats Athens","key":true},{"y":-415.0,"label":"415–413 BCE","text":"Athens' Sicilian Expedition ends in disaster","key":false},{"y":-399.0,"label":"399 BCE","text":"<strong>Socrates<\/strong> executed","key":true},{"y":-387.0,"label":"c. 387 BCE","text":"Plato founds the Academy","key":false},{"y":-338.0,"label":"338 BCE","text":"<strong>Chaeronea<\/strong>: Philip II of Macedon conquers Greece","key":true},{"y":-334.0,"label":"334–323 BCE","text":"<strong>Alexander the Great<\/strong> conquers the Persian Empire","key":true},{"y":-323.0,"label":"323 BCE","text":"Alexander dies; <strong>Hellenistic Age<\/strong> begins","key":true},{"y":-300.0,"label":"c. 300 BCE","text":"Euclid in Alexandria; Zeno and Epicurus teach in Athens","key":false},{"y":-31.0,"label":"31–30 BCE","text":"Rome conquers Ptolemaic Egypt; Hellenistic Age ends","key":false}],"people":[{"name":"Homer","desc":"Epic poet: <em>Iliad<\/em> and <em>Odyssey<\/em>; heroic ideal of <em>arete<\/em>"},{"name":"Solon","desc":"Athenian reformer: cancelled debts, ended debt slavery (594 BCE)"},{"name":"Cleisthenes","desc":"\"Father of Athenian democracy\": 10 tribes, Council of 500, ostracism"},{"name":"Pericles","desc":"Leader of Golden Age Athens; Parthenon; pay for public office; Funeral Oration"},{"name":"Themistocles","desc":"Built Athens' navy; won at Salamis (480 BCE)"},{"name":"Herodotus","desc":"\"Father of history\"; wrote on the Persian Wars"},{"name":"Thucydides","desc":"Critical historian of the Peloponnesian War"},{"name":"Socrates","desc":"Questioning (Socratic) method; executed 399 BCE"},{"name":"Plato","desc":"Theory of Forms; <em>Republic<\/em> with philosopher-kings; Academy"},{"name":"Aristotle","desc":"Logic, observation, golden mean; Lyceum; tutored Alexander"},{"name":"Sophocles","desc":"Tragedian: <em>Oedipus Rex<\/em>, <em>Antigone<\/em>"},{"name":"Aristophanes","desc":"Comic playwright; satire (<em>Lysistrata<\/em>, <em>The Clouds<\/em>)"},{"name":"Alexander the Great","desc":"Conquered Persia to India (336–323 BCE); spread Greek culture"},{"name":"Zeno / Epicurus","desc":"Founders of Stoicism / Epicureanism"},{"name":"Euclid / Archimedes","desc":"Hellenistic geometry / physics and engineering"}],"cards":[{"id":"gr-c1","f":"Polis","b":"Greek city-state: a city and its farmland governed by citizens; typically with an acropolis and agora."},{"id":"gr-c2","f":"Acropolis","b":"Fortified hilltop of a Greek city with its main temples (Athens: the Parthenon)."},{"id":"gr-c3","f":"Agora","b":"Open marketplace and public meeting place of a Greek polis."},{"id":"gr-c4","f":"Hoplite / phalanx","b":"Heavily armed citizen-infantryman fighting in a tight shield wall; gave middle-class men political leverage."},{"id":"gr-c5","f":"Tyrant (Greek)","b":"Ruler who seized power outside the normal rules, often with popular support; not necessarily cruel."},{"id":"gr-c6","f":"Helots","b":"State-owned serfs of Sparta; fear of their revolt shaped Sparta's military society."},{"id":"gr-c7","f":"Ephors","b":"Five annually elected Spartan officials who ran daily government and checked the two kings."},{"id":"gr-c8","f":"Draco","b":"Athenian lawgiver (621 BCE) whose first written code was extremely harsh (\"draconian\")."},{"id":"gr-c9","f":"Solon","b":"Athenian reformer (594 BCE) who cancelled debts, abolished debt slavery, and ranked citizens by wealth."},{"id":"gr-c10","f":"Cleisthenes","b":"\"Father of Athenian democracy\" (508/507 BCE): 10 tribes, Council of 500, ostracism."},{"id":"gr-c11","f":"Ostracism","b":"Athenian vote to exile a potentially dangerous citizen for 10 years."},{"id":"gr-c12","f":"Metics","b":"Resident foreigners in Athens: free, could trade, but could not vote or own land."},{"id":"gr-c13","f":"Battle of Marathon","b":"490 BCE: Athenian hoplites defeated Darius I's invading force."},{"id":"gr-c14","f":"Battle of Salamis","b":"480 BCE: Themistocles' Athenian-led fleet destroyed Xerxes' navy; decisive victory of the Persian Wars."},{"id":"gr-c15","f":"Delian League","b":"Athenian-led alliance against Persia (478 BCE) that Athens turned into its own empire."},{"id":"gr-c16","f":"Pericles","b":"Leader of Athens 461–429 BCE: Golden Age, Parthenon, paid public service; died of the plague."},{"id":"gr-c17","f":"Peloponnesian War","b":"431–404 BCE war of Athens vs. Sparta; Sparta won with Persian help; recorded by Thucydides."},{"id":"gr-c18","f":"Herodotus vs. Thucydides","b":"Herodotus = \"father of history,\" Persian Wars, includes legends; Thucydides = Peloponnesian War, critical analysis."},{"id":"gr-c19","f":"Hubris","b":"Excessive pride that leads to a tragic hero's downfall in Greek drama."},{"id":"gr-c20","f":"Sophists","b":"Paid teachers of rhetoric who taught truth is relative (\"Man is the measure of all things\": Protagoras)."},{"id":"gr-c21","f":"Socratic method","b":"Teaching by asking probing questions to expose contradictions and reach truth."},{"id":"gr-c22","f":"Theory of Forms","b":"Plato's idea that the material world is an imperfect copy of perfect, eternal ideas (Allegory of the Cave)."},{"id":"gr-c23","f":"Aristotle","b":"Plato's student; empirical observation, logic (syllogism), golden mean, mixed constitution; tutored Alexander."},{"id":"gr-c24","f":"Golden mean","b":"Aristotle's idea that virtue lies between two extremes (courage between cowardice and rashness)."},{"id":"gr-c25","f":"Doric / Ionic / Corinthian","b":"Greek column orders: plain (Parthenon) / scroll capital / ornate leaves."},{"id":"gr-c26","f":"Philip II of Macedon","b":"Conquered Greece at Chaeronea (338 BCE) with a reformed pike phalanx; father of Alexander."},{"id":"gr-c27","f":"Alexander the Great","b":"King of Macedon 336–323 BCE; conquered the Persian Empire to India; founded Alexandria."},{"id":"gr-c28","f":"Hellenistic","b":"\"Greek-like\" era (323–31 BCE) blending Greek and Near Eastern cultures in large monarchies."},{"id":"gr-c29","f":"Alexandria","b":"Ptolemaic Egypt's capital; Library, Museum, Pharos lighthouse; center of Hellenistic science."},{"id":"gr-c30","f":"Stoicism","b":"Zeno's philosophy: live by reason and virtue, accept fate, do your duty; all humans share reason (natural law)."},{"id":"gr-c31","f":"Epicureanism","b":"Epicurus' philosophy: happiness = pleasure as absence of pain and fear; tranquility; avoid public life."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Sparta<\/th><th>Athens<\/th><\/tr><\/thead><tbody><tr><td>Government<\/td><td>Oligarchy: 2 kings, 5 ephors, council of elders<\/td><td>Direct democracy (after Cleisthenes)<\/td><\/tr><tr><td>Economy<\/td><td>Farming by helots; trade discouraged<\/td><td>Trade, silver mines, navy, empire<\/td><\/tr><tr><td>Military<\/td><td>Professional land army; training from age 7<\/td><td>Navy of triremes rowed by poorer citizens<\/td><\/tr><tr><td>Women<\/td><td>Exercised, owned property<\/td><td>Secluded at home; no political rights<\/td><\/tr><tr><td>Culture<\/td><td>Austere; few arts<\/td><td>Philosophy, drama, architecture<\/td><\/tr><tr><td>Alliance<\/td><td>Peloponnesian League<\/td><td>Delian League<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Classical (c. 480–323 BCE)<\/th><th>Hellenistic (323–31 BCE)<\/th><\/tr><\/thead><tbody><tr><td>Political unit<\/td><td>Independent polis<\/td><td>Large monarchies (Ptolemies, Seleucids, Antigonids)<\/td><\/tr><tr><td>Center<\/td><td>Athens<\/td><td>Alexandria<\/td><\/tr><tr><td>Philosophy<\/td><td>Socrates, Plato, Aristotle: the good citizen and state<\/td><td>Stoics, Epicureans, Cynics: individual peace of mind<\/td><\/tr><tr><td>Art<\/td><td>Idealized, calm, balanced<\/td><td>Realistic, emotional, dramatic<\/td><\/tr><tr><td>Outlook<\/td><td>Greek vs. \"barbarian\"<\/td><td>Cosmopolitan; koine Greek everywhere<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ro","title":"Ancient Rome & Early Christianity","topic":"rome","share":17.1,"quizN":15,"examN":21,"diagN":5,"cardTarget":31,"lessonMin":13,"studyHours":2.5,"intro":"How a small city on the Tiber built a republic, conquered the Mediterranean, became an empire, adopted Christianity, and lost its western half to Germanic kingdoms. Worth 15–17% of the exam.","lesson":"<h3>1. Origins and the early Republic<\/h3>\n<p>Rome sits on the <strong>Tiber River<\/strong> in central Italy, with good farmland and a central position in the Mediterranean. Legend says <strong>Romulus and Remus<\/strong> founded it in <strong>753 BCE<\/strong>. Early Rome was ruled by kings and strongly influenced by its northern neighbors, the <strong>Etruscans<\/strong> (engineering, the arch, the toga, gladiator contests, and the alphabet they had borrowed from the Greeks). Greek colonies in the south passed on Greek gods, art, and ideas.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Romans hate the arrogant Etruscan king <strong>Tarquin the Proud<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>They expel him in <strong>509 BCE<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>They create a <strong>republic<\/strong> (\"res publica,\" the public thing) designed so that no one man could ever be king again<\/div><\/div>\n<h4>Government of the Republic<\/h4>\n<div class=\"tblwrap\"><table><thead><tr><th>Institution<\/th><th>Who / how<\/th><th>Power<\/th><\/tr><\/thead><tbody><tr><td><strong>Consuls<\/strong> (2)<\/td><td>Elected for <strong>1 year<\/strong><\/td><td>Ran government and commanded armies; each could <strong>veto<\/strong> the other<\/td><\/tr><tr><td><strong>Senate<\/strong><\/td><td>About 300 men, originally <strong>patricians<\/strong>, served for life<\/td><td>Controlled finances and foreign policy; advised magistrates; most prestige<\/td><\/tr><tr><td><strong>Dictator<\/strong><\/td><td>Appointed in emergency for <strong>max 6 months<\/strong><\/td><td>Absolute power. Model: <strong>Cincinnatus<\/strong>, who saved Rome, then returned to his plow<\/td><\/tr><tr><td><strong>Tribunes<\/strong><\/td><td>Elected by the plebeians<\/td><td>Protected plebeians; could <strong>veto<\/strong> (\"I forbid\") acts of magistrates and the Senate<\/td><\/tr><tr><td><strong>Assemblies<\/strong><\/td><td>Citizens voting in groups<\/td><td>Elected magistrates and passed laws<\/td><\/tr><tr><td>Praetors, censors<\/td><td>Elected officials<\/td><td>Justice; census and public morals<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The Greek historian <strong>Polybius<\/strong> admired this <strong>mixed constitution<\/strong>: consuls (monarchy), Senate (aristocracy), and assemblies (democracy) checking one another. Its ideas of <strong>checks and balances<\/strong> and <strong>veto<\/strong> influenced later republics, including the United States.<\/p>\n<h4>Struggle of the Orders (494–287 BCE)<\/h4>\n<p>Rome's society split into <strong>patricians<\/strong> (wealthy landowning aristocrats) and <strong>plebeians<\/strong> (the common majority: farmers, artisans, merchants). Plebeians fought for equality mostly by <strong>refusing to fight<\/strong> (going on strike, called \"secession\"), since the army needed them.<\/p>\n<ul><li><strong>494 BCE:<\/strong> plebeians win their own officials, the <strong>tribunes<\/strong>.<\/li><li><strong>c. 450 BCE:<\/strong> the <strong>Twelve Tables<\/strong>, Rome's first written laws, posted publicly in the Forum so patrician judges could not twist unwritten custom
