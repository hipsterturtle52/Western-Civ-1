:"Thomas Becket murdered","key":false},{"y":1176.0,"label":"1176","text":"Lombard League defeats Barbarossa at Legnano","key":false},{"y":1187.0,"label":"1187","text":"<strong>Saladin<\/strong> retakes Jerusalem; Third Crusade follows","key":true},{"y":1204.0,"label":"1204","text":"<strong>Fourth Crusade sacks Constantinople<\/strong>; France takes Normandy","key":true},{"y":1209.0,"label":"1209","text":"Albigensian Crusade; Francis of Assisi's order approved","key":false},{"y":1215.0,"label":"1215","text":"<strong>Magna Carta<\/strong>; Fourth Lateran Council","key":true},{"y":1265.0,"label":"c. 1265–1274","text":"Aquinas writes the <em>Summa Theologica<\/em>","key":false},{"y":1295.0,"label":"1295","text":"Edward I's Model Parliament","key":false},{"y":1302.0,"label":"1302","text":"<em>Unam Sanctam<\/em>; first Estates-General in France","key":true},{"y":1309.0,"label":"1309–1377","text":"<strong>Avignon papacy<\/strong> (\"Babylonian Captivity\")","key":true},{"y":1315.0,"label":"1315–1317","text":"Great Famine","key":false},{"y":1337.0,"label":"1337–1453","text":"<strong>Hundred Years' War<\/strong>","key":true},{"y":1346.0,"label":"1346","text":"Crécy: English longbows defeat French knights","key":false},{"y":1347.0,"label":"1347–1351","text":"<strong>Black Death<\/strong> kills about one-third of Europe","key":true},{"y":1356.0,"label":"1356","text":"Golden Bull: seven electors choose the emperor","key":false},{"y":1358.0,"label":"1358","text":"Jacquerie peasant revolt in France","key":false},{"y":1378.0,"label":"1378–1417","text":"<strong>Great Western Schism<\/strong> (rival popes)","key":true},{"y":1381.0,"label":"1381","text":"English Peasants' Revolt","key":false},{"y":1414.0,"label":"1414–1418","text":"Council of Constance; Jan Hus burned (1415)","key":false},{"y":1429.0,"label":"1429","text":"Joan of Arc lifts the siege of Orléans","key":false},{"y":1453.0,"label":"1453","text":"Ottomans take <strong>Constantinople<\/strong>; Hundred Years' War ends","key":true}],"people":[{"name":"Gregory VII","desc":"Reform pope; Investiture Controversy; Canossa (1077)"},{"name":"Henry IV","desc":"German emperor humbled at Canossa"},{"name":"Innocent III","desc":"Height of papal power; Fourth Lateran Council (1215)"},{"name":"Urban II","desc":"Launched the First Crusade (1095)"},{"name":"Saladin","desc":"Muslim sultan who retook Jerusalem (1187)"},{"name":"Francis of Assisi","desc":"Founder of the Franciscans; radical poverty"},{"name":"William the Conqueror","desc":"Won at Hastings (1066); Domesday Book"},{"name":"Henry II","desc":"English common law, juries; clash with Becket"},{"name":"King John","desc":"Lost Normandy; forced to sign Magna Carta (1215)"},{"name":"Philip IV","desc":"French king; Estates-General; clash with Boniface VIII"},{"name":"Thomas Aquinas","desc":"<em>Summa Theologica<\/em>; faith and reason united"},{"name":"Dante / Chaucer","desc":"<em>Divine Comedy<\/em> (Italian) / <em>Canterbury Tales<\/em> (English)"},{"name":"Joan of Arc","desc":"Lifted siege of Orléans (1429); burned 1431"},{"name":"John Wycliffe / Jan Hus","desc":"Pre-Reformation critics of the papacy"}],"cards":[{"id":"hma-c1","f":"Charter (town)","b":"Document from a lord or king granting a town self-government and freedoms."},{"id":"hma-c2","f":"Guilds","b":"Associations of merchants or craftsmen regulating prices, quality, and training (apprentice → journeyman → master)."},{"id":"hma-c3","f":"Hanseatic League","b":"Alliance of north German trading towns dominating Baltic and North Sea commerce."},{"id":"hma-c4","f":"Simony","b":"The buying and selling of church offices."},{"id":"hma-c5","f":"Investiture Controversy","b":"Conflict over whether popes or kings appoint bishops; Canossa (1077); Concordat of Worms (1122)."},{"id":"hma-c6","f":"Concordat of Worms","b":"1122 compromise: the Church invests bishops with spiritual authority; the emperor grants their lands."},{"id":"hma-c7","f":"Innocent III","b":"Pope (1198–1216) at the height of papal power; interdict on England; Fourth Lateran Council."},{"id":"hma-c8","f":"Interdict","b":"Papal penalty suspending church services and sacraments in an entire region."},{"id":"hma-c9","f":"Mendicant orders","b":"Begging friars who worked in towns: Franciscans (poverty) and Dominicans (preaching, fighting heresy)."},{"id":"hma-c10","f":"First Crusade","b":"Called by Urban II at Clermont (1095); captured Jerusalem (1099); founded crusader states."},{"id":"hma-c11","f":"Fourth Crusade","b":"Diverted by Venice; sacked Christian Constantinople (1204)."},{"id":"hma-c12","f":"Saladin","b":"Muslim sultan who recaptured Jerusalem in 1187, prompting the Third Crusade."},{"id":"hma-c13","f":"Domesday Book","b":"William the Conqueror's 1086 survey of English landholding for taxation."},{"id":"hma-c14","f":"Common law","b":"English law based on royal court decisions and precedent, common to the whole kingdom (Henry II)."},{"id":"hma-c15","f":"Magna Carta","b":"1215 charter barons forced on King John: king subject to law; no taxes without council's consent; lawful judgment."},{"id":"hma-c16","f":"Model Parliament","b":"Edward I's 1295 Parliament including nobles, clergy, and commoners from towns and shires."},{"id":"hma-c17","f":"Estates-General","b":"French assembly of clergy, nobles, and townspeople, first called by Philip IV in 1302."},{"id":"hma-c18","f":"Scholasticism","b":"Medieval method using reason and Aristotle's logic to explain and defend Christian faith."},{"id":"hma-c19","f":"Summa Theologica","b":"Thomas Aquinas' synthesis of Aristotle and Christian theology; faith and reason agree."},{"id":"hma-c20","f":"Gothic architecture","b":"Pointed arches, ribbed vaults, flying buttresses, stained glass; began at Saint-Denis (1140s)."},{"id":"hma-c21","f":"Black Death","b":"Bubonic plague, 1347–1351; killed about a third of Europe; led to labor shortages and higher wages."},{"id":"hma-c22","f":"Hundred Years' War","b":"England vs. France, 1337–1453; longbow victories; Joan of Arc; France wins."},{"id":"hma-c23","f":"Avignon papacy","b":"Popes resided in Avignon under French influence, 1309–1377 (\"Babylonian Captivity\" of the Church)."},{"id":"hma-c24","f":"Great Western Schism","b":"1378–1417: two, then three, rival popes; ended by the Council of Constance."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>England<\/th><th>France<\/th><th>Holy Roman Empire<\/th><\/tr><\/thead><tbody><tr><td>Founding moment<\/td><td>Norman Conquest, 1066<\/td><td>Hugh Capet, 987<\/td><td>Otto I crowned, 962<\/td><\/tr><tr><td>Key kings<\/td><td>William I, Henry II, John, Edward I<\/td><td>Philip II, Louis IX, Philip IV<\/td><td>Henry IV, Frederick Barbarossa<\/td><\/tr><tr><td>Limits on king<\/td><td>Magna Carta (1215), Parliament<\/td><td>Estates-General (rarely binding)<\/td><td>Powerful princes, electors, popes<\/td><\/tr><tr><td>Outcome by 1450<\/td><td>Centralized law, but king shares power with Parliament<\/td><td>Strong, centralizing monarchy<\/td><td>Fragmented into many states<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"rr","title":"Renaissance & Reformation","topic":"rr","share":16.0,"quizN":14,"examN":19,"diagN":5,"cardTarget":29,"lessonMin":12,"studyHours":2.5,"intro":"Roughly 1350–1565: Italian humanism and art, the printing press and northern Christian humanism, kings building \"new monarchies,\" and the split of Western Christianity into Protestant and reformed Catholic churches. Worth 13–17%.","lesson":"<h3>1. Why the Renaissance began in Italy<\/h3>\n<p>\"Renaissance\" means <strong>rebirth<\/strong>, meaning the rebirth of interest in the art and learning of <strong>classical Greece and Rome<\/strong>. It began in northern Italy around <strong>1350<\/strong> and spread north after about 1450.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Italian city-states grow rich from Mediterranean <strong>trade and banking<\/strong>; Roman ruins all around; Greek scholars arrive from Byzantium (especially after <strong>1453<\/strong>)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Wealthy merchants, princes, and popes become <strong>patrons<\/strong>, spending on scholars, artists, and buildings to win prestige<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>A burst of classical learning and art centered in <strong>Florence<\/strong>, then Rome and Venice<\/div><\/div>\n<p><strong>Italian politics:<\/strong> no unified kingdom. Five major powers: <strong>Florence<\/strong> (a republic dominated by the <strong>Medici<\/strong> banking family: Cosimo and <strong>Lorenzo \"the Magnificent\"<\/strong>), <strong>Venice<\/strong> (a merchant republic led by an elected doge), <strong>Milan<\/strong> (dukes, the Sforza), the <strong>Papal States<\/strong>, and the <strong>Kingdom of Naples<\/strong>. The <strong>Peace of Lodi (1454)<\/strong> created a <strong>balance of power<\/strong> among them, and Italians developed modern <strong>diplomacy<\/strong> with permanent ambassadors. The balance broke when <strong>France invaded in 1494<\/strong>, beginning decades of <strong>Italian Wars<\/strong>. In Florence, the fiery Dominican friar <strong>Savonarola<\/strong> briefly ruled (1494–1498), burned luxuries in the \"bonfire of the vanities,\" and was himself burned. In <strong>1527<\/strong>, mutinous troops of Emperor <strong>Charles V<\/strong> <strong>sacked Rome<\/strong>.<\/p>\n<h3>2. Humanism<\/h3>\n<p><strong>Humanism<\/strong> was an educational and intellectual movement: the study of the classics, the <strong><em>studia humanitatis<\/strong><\/em> (grammar, rhetoric, poetry, history, moral philosophy), to produce eloquent, virtuous, active citizens. Humanists were <strong>not anti-religious<\/strong>, but they focused on <strong>human potential and achievement in this world<\/strong> (<strong>secularism<\/strong>) and celebrated <strong>individualism<\/strong>.<\/p>\n<ul><li><strong>Petrarch<\/strong> (1304–1374), the \"<strong>father of humanism<\/strong>\": hunted down lost classical manuscripts, wrote letters to the long-dead Cicero, wrote sonnets in Italian, and called the centuries after Rome a \"dark\" age.<\/li><li><strong>Boccaccio:<\/strong> the <strong><em>Decameron<\/strong><\/em>, worldly tales told by people fleeing the Black Death.<\/li><li><strong>Civic humanism<\/strong> (Leonardo <strong>Bruni<\/strong>, Florence): classical learning should serve active public life in a republic.<\/li><li><strong>Lorenzo Valla<\/strong> used <strong>textual analysis (philology)<\/strong> to prove that the <strong>Donation of Constantine<\/strong>, a document supporting papal claims to rule the West, was a <strong>forgery<\/strong> (1440).<\/li><li><strong>Marsilio Ficino<\/strong> led the <strong>Platonic Academy<\/strong> in Florence and translated Plato.<\/li><li><strong>Pico della Mirandola<\/strong>, <strong><em>Oration on the Dignity of Man<\/strong><\/em> (1486): humans have free will to shape themselves, rising toward angels or sinking toward beasts.<\/li><li><strong>Baldassare Castiglione<\/strong>, <strong><em>The Book of the Courtier<\/strong><\/em> (1528): the ideal gentleman is skilled in arms, letters, music, and conversation, all done with effortless grace (<em>sprezzatura<\/em>): the \"<strong>Renaissance man<\/strong>.\"<\/li><li><strong>Niccolò Machiavelli<\/strong>, <strong><em>The Prince<\/strong><\/em> (1513): a ruler must be guided by <strong>political realism<\/strong>, not Christian morality; \"it is <strong>safer to be feared than loved<\/strong>\"; a prince must sometimes do evil to preserve the state. Machiavelli is called the father of modern <strong>political science<\/strong>.<\/li><\/ul>\n<p>Educated elite women could gain humanist learning, and some were major patrons (<strong>Isabella d'Este<\/strong>), but most women's legal and social position did not improve.<\/p>\n<h3>3. Renaissance art<\/h3>\n<p>Renaissance art featured <strong>realism<\/strong>, <strong>classical themes and forms<\/strong>, <strong>individual portraits<\/strong>, and new techniques: <strong>linear perspective<\/strong> (a vanishing point creating depth), <strong>chiaroscuro<\/strong> (light and shadow), and <strong>oil paint<\/strong>.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Artist<\/th><th>Known for<\/th><\/tr><\/thead><tbody><tr><td><strong>Giotto<\/strong> (c. 1300)<\/td><td>Forerunner: natural, emotional figures<\/td><\/tr><tr><td><strong>Brunelleschi<\/strong><\/td><td>Worked out <strong>linear perspective<\/strong>; built the great <strong>dome of Florence Cathedral<\/strong><\/td><\/tr><tr><td><strong>Masaccio<\/strong><\/td><td>First painter to use perspective systematically (<em>Holy Trinity<\/em>)<\/td><\/tr><tr><td><strong>Donatello<\/strong><\/td><td>Bronze <strong><em>David<\/strong><\/em>: first freestanding nude statue since antiquity<\/td><\/tr><tr><td><strong>Botticelli<\/strong><\/td><td><strong><em>Birth of Venus<\/strong><\/em>: classical mythology for Medici patrons<\/td><\/tr><tr><td><strong>Leonardo da Vinci<\/strong><\/td><td><strong><em>Last Supper<\/strong><\/em>, <strong><em>Mona Lisa<\/strong><\/em>, notebooks of anatomy and inventions: the ultimate \"Renaissance man\"<\/td><\/tr><tr><td><strong>Michelangelo<\/strong><\/td><td>Marble <strong><em>David<\/strong><\/em>, <strong>Sistine Chapel ceiling<\/strong> (for Pope Julius II), dome of St. Peter's<\/td><\/tr><tr><td><strong>Raphael<\/strong><\/td><td><strong><em>School of Athens<\/strong><\/em> (Plato and Aristotle at the center); Madonnas<\/td><\/tr><tr><td><strong>Titian<\/strong><\/td><td>Venetian master of rich color<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The <strong>High Renaissance<\/strong> (c. 1490–1527) centered on <strong>Rome<\/strong>, where popes such as <strong>Julius II<\/strong> and <strong>Leo X<\/strong> (a Medici) commissioned masterpieces and rebuilt <strong>St. Peter's Basilica<\/strong>.<\/p>\n<h3>4. The Northern Renaissance and the printing press<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Johannes Gutenberg<\/strong> of Mainz develops <strong>movable metal type<\/strong> (c. 1450); the <strong>Gutenberg Bible<\/strong> appears c. 1455<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Books become cheap and plentiful; by 1500 millions have been printed across Europe<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Literacy<\/strong> spreads, scholarship becomes standardized, and new ideas (including Luther's) <strong>spread faster than authorities can suppress them<\/strong><\/div><\/div>\n<p>Northern humanists, the <strong>Christian humanists<\/strong>, used humanist scholarship to <strong>reform Christianity<\/strong> by returning to its original sources (<em>ad fontes<\/em>: the Bible and early Church Fathers in their original languages).<\/p>\n<ul><li><strong>Desiderius Erasmus<\/strong> (Dutch): <strong><em>In Praise of Folly<\/strong><\/em> (1509) satirized corrupt clergy, empty rituals, and superstition; published an accurate <strong>Greek New Testament<\/strong> (1516). He wanted <strong>reform from within<\/strong> and never left the Catholic Church. Contemporaries said \"<strong>Erasmus laid the egg that Luther hatched<\/strong>.\"<\/li><li><strong>Thomas More<\/strong> (England): <strong><em>Utopia<\/strong><\/em> (1516), an imaginary island society with common property, criticizing European greed and injustice. He was <strong>executed in 1535<\/strong> for refusing to accept Henry VIII as head of the English Church.<\/li><li><strong>François Rabelais<\/strong> (France): bawdy satire in <em>Gargantua and Pantagruel<\/em>.<\/li><\/ul>\n<p><strong>Northern art<\/strong> emphasized <strong>detailed realism<\/strong>, everyday life, and religious devotion, often in <strong>oil paint<\/strong> (perfected by Flemish painters):<\/p>\n<ul><li><strong>Jan van Eyck:<\/strong> oil-painting pioneer; <strong><em>Arnolfini Portrait<\/strong><\/em> (intense detail).<\/li><li><strong>Albrecht Dürer<\/strong> (Germany): brought Italian techniques north; famous <strong>woodcuts and engravings<\/strong>.<\/li><li><strong>Hans Holbein the Younger:<\/strong> portraits of <strong>Henry VIII<\/strong> and Thomas More.<\/li><li><strong>Pieter Bruegel the Elder:<\/strong> scenes of <strong>peasant life<\/strong> (<em>Peasant Wedding<\/em>).<\/li><\/ul>\n<h3>5. The New Monarchies (c. 1450–1550)<\/h3>\n<p>After the chaos of the 1300s, kings in Western Europe built stronger, more centralized states. Common methods: <strong>standing armies<\/strong> (paid troops with cannon, which could knock down nobles' castles), <strong>new taxes<\/strong>, royal courts and <strong>middle-class officials<\/strong> loyal to the crown, curbing the great nobles, and <strong>controlling the Church in their lands<\/strong>.<\/p>\n<ul><li><strong>France:<\/strong> <strong>Louis XI<\/strong> (\"the Spider King,\" 1461–1483) expanded royal territory and taxes after the Hundred Years' War. <strong>Francis I<\/strong>'s <strong>Concordat of Bologna (1516)<\/strong> let the king <strong>appoint French bishops and abbots<\/strong>, giving him control of the French Church without breaking with Rome.<\/li><li><strong>England:<\/strong> <strong>Henry VII<\/strong>, first <strong>Tudor<\/strong> king, won the <strong>Battle of Bosworth (1485)<\/strong>, ending the <strong>Wars of the Roses<\/strong>. He tamed the nobles (the <strong>Court of Star Chamber<\/strong> tried powerful men without juries), filled the treasury, and avoided costly wars.<\/li><li><strong>Spain:<\/strong> the marriage of <strong>Ferdinand of Aragon and Isabella of Castile (1469)<\/strong> joined Spain's two largest kingdoms. In <strong>1492<\/strong> they conquered <strong>Granada<\/strong>, completing the <strong>Reconquista<\/strong>, <strong>expelled the Jews<\/strong> (Muslims were forced to convert or leave soon after), and sponsored <strong>Columbus<\/strong>. The <strong>Spanish Inquisition (1478)<\/strong>, controlled by the crown, enforced religious unity.<\/li><li><strong>Holy Roman Empire:<\/strong> the <strong>Habsburgs<\/strong> grew through <strong>marriage alliances<\/strong> rather than central government. Their heir <strong>Charles V<\/strong> inherited <strong>Spain<\/strong>, its American empire, Naples, the <strong>Netherlands<\/strong>, and <strong>Austria<\/strong>, and was elected emperor in <strong>1519<\/strong>: the most powerful ruler in Europe, but the German princes stayed largely independent.<\/li><\/ul>\n<h3>6. The Protestant Reformation<\/h3>\n<p><strong>Long-term causes:<\/strong><\/p>\n<ul><li><strong>Church abuses:<\/strong> <strong>simony<\/strong>, <strong>pluralism<\/strong> (one man holding several church offices), <strong>absenteeism<\/strong> (not living in one's diocese), <strong>nepotism<\/strong>, and poorly educated priests.<\/li><li><strong>Worldly Renaissance popes:<\/strong> Alexander VI (Borgia), the warrior pope Julius II, and Leo X spent lavishly.<\/li><li><strong>Indulgences:<\/strong> remissions of punishment for sin, increasingly <strong>sold<\/strong> for cash.<\/li><li><strong>Humanist criticism<\/strong> and Bible study (Erasmus), the <strong>printing press<\/strong>, the earlier movements of <strong>Wycliffe and Hus<\/strong>.<\/li><li><strong>Political:<\/strong> princes and kings resented papal taxes and wanted control of Church lands and offices; growing <strong>national feeling<\/strong>, especially in Germany.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>To fund the rebuilding of <strong>St. Peter's<\/strong>, the friar <strong>Johann Tetzel<\/strong> sells indulgences in Germany (\"As soon as the coin in the coffer rings, the soul from purgatory springs\")<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Martin Luther<\/strong>, a monk and professor at <strong>Wittenberg<\/strong>, posts the <strong>Ninety-Five Theses<\/strong> (October 31, <strong>1517<\/strong>) challenging indulgences<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Printed copies spread across Germany in weeks; a theological debate becomes a revolt against Rome<\/div><\/div>\n<h4>Martin Luther (1483–1546)<\/h4>\n<p>Luther's key teachings:<\/p>\n<ul><li><strong>Justification by faith alone (<em>sola fide<\/em>):<\/strong> salvation comes only through faith, a free gift of God's grace, <strong>not by good works<\/strong> or buying indulgences.<\/li><li><strong>Scripture alone (<em>sola scriptura<\/em>):<\/strong> the <strong>Bible<\/strong> is the only authority, not popes or councils.<\/li><li><strong>Priesthood of all believers:<\/strong> all Christians have direct access to God; clergy are not a separate holy class and <strong>may marry<\/strong>. (Luther married a former nun, Katharina von Bora.)<\/li><li>Only <strong>two sacraments<\/strong> (baptism and the Eucharist), with Christ <strong>really present<\/strong> in the bread and wine, though Luther rejected transubstantiation.<\/li><\/ul>\n<p>The confrontation: excommunicated in <strong>1521<\/strong>, he refused to recant at the <strong>Diet of Worms (1521)<\/strong> before Emperor <strong>Charles V<\/strong> (\"Here I stand; I can do no other\"). The <strong>Edict of Worms<\/strong> made him an outlaw, but <strong>Frederick the Wise<\/strong>, elector of <strong>Saxony<\/strong>, protected him in Wartburg Castle, where he <strong>translated the New Testament into German<\/strong>.<\/p>\n<p><strong>German Peasants' War (1524–1525):<\/strong> peasants cited Luther's ideas of Christian freedom to demand an end to serfdom. Luther <strong>sided with the princes<\/strong>, urging them to crush the revolt. From then on Lutheranism spread <strong>with the support of princes<\/strong>, who also gained control of church property.<\/p>\n<p>The name \"<strong>Protestant<\/strong>\" comes from princes who <strong>protested<\/strong> an imperial decision at the Diet of Speyer (1529). After years of war between Charles V and the Protestant <strong>Schmalkaldic League<\/strong>, the <strong>Peace of Augsburg (1555)<\/strong> ruled that each German prince could choose <strong>Lutheranism or Catholicism<\/strong> for his territory: <strong><em>cuius regio, eius religio<\/strong><\/em> (\"whose realm, his religion\"). <strong>Calvinism was not included<\/strong>, a problem that helped cause the Thirty Years' War (Unit 7).<\/p>\n<h4>Zwingli, Calvin, and the radicals<\/h4>\n<ul><li><strong>Ulrich Zwingli<\/strong> (Zurich): even more radical in stripping churches of images; taught that the Eucharist is only a <strong>symbolic<\/strong> remembrance. He and Luther <strong>disagreed at Marburg (1529)<\/strong>, so Protestants never united. Zwingli died in battle (1531).<\/li><li><strong>John Calvin<\/strong> (a Frenchman in <strong>Geneva<\/strong>): <strong><em>Institutes of the Christian Religion<\/strong><\/em> (1536). Central doctrine: <strong>predestination<\/strong>, meaning God has already chosen the \"<strong>elect<\/strong>\" for salvation. Geneva became a model Protestant city governed by strict moral discipline (the <strong>consistory<\/strong> of pastors and elders policed behavior). Calvinism spread internationally: <strong>Huguenots<\/strong> (France), <strong>Presbyterians<\/strong> in Scotland (<strong>John Knox<\/strong>), <strong>Puritans<\/strong> (England), and the <strong>Dutch Reformed<\/strong> Church. Later writers (Max Weber) linked Calvinist discipline and hard work to the rise of capitalism.<\/li><li><strong>Anabaptists<\/strong> (\"re-baptizers\"): <strong>adult baptism<\/strong> only, <strong>separation of church and state<\/strong>, often <strong>pacifism<\/strong> and shared property. Persecuted by Catholics and Protestants alike, especially after radicals seized <strong>Münster (1534–1535)<\/strong>. Descendants include the <strong>Mennonites<\/strong> (and later Amish).<\/li><\/ul>\n<h4>The English Reformation: politics first<\/h4>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Henry VIII<\/strong> needs a male heir; his wife <strong>Catherine of Aragon<\/strong> has given him only a daughter (Mary)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>The pope refuses an annulment, under pressure from Catherine's nephew, Emperor <strong>Charles V<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Parliament's <strong>Act of Supremacy (1534)<\/strong> makes the <strong>king head of the Church of England<\/strong>; Henry marries <strong>Anne Boleyn<\/strong><\/div><\/div>\n<p>Henry <strong>dissolved the monasteries<\/strong> (1536–1540) and sold their lands to nobles and gentry, who then supported the break. Doctrine stayed largely <strong>Catholic<\/strong> under Henry. His son <strong>Edward VI<\/strong> pushed Protestantism (Archbishop <strong>Cranmer<\/strong>'s <strong>Book of Common Prayer<\/strong>). <strong>Mary I<\/strong> restored Catholicism and burned about 300 Protestants (\"<strong>Bloody Mary<\/strong>\"). <strong>Elizabeth I<\/strong> (1558–1603) set a moderate, Protestant <strong>Elizabethan Settlement<\/strong> (the Church of England as a \"middle way,\" with the monarch as Supreme Governor).<\/p>\n<h3>7. The Catholic Reformation (Counter-Reformation)<\/h3>\n<p>The Catholic Church responded with genuine reform <strong>and<\/strong> firm defense of doctrine.<\/p>\n<ul><li><strong>Pope Paul III<\/strong> (1534–1549) appointed reformers and called the <strong>Council of Trent (1545–1563)<\/strong>:<ul><li><strong>Reaffirmed<\/strong> doctrine: salvation by <strong>faith and good works<\/strong>, <strong>all seven sacraments<\/strong>, <strong>transubstantiation<\/strong>, the authority of <strong>both Scripture and Church tradition<\/strong>, the Latin Vulgate, and <strong>Latin Mass<\/strong>.<\/li><li><strong>Reformed<\/strong> abuses: ended the sale of indulgences (while keeping indulgences), required bishops to <strong>live in their dioceses<\/strong>, and created <strong>seminaries<\/strong> to train priests.<\/li><\/ul><\/li><li><strong>Jesuits (Society of Jesus):<\/strong> founded by <strong>Ignatius of Loyola<\/strong>, a former Spanish soldier; approved <strong>1540<\/strong>. Organized like an army with absolute <strong>obedience to the pope<\/strong>, they excelled at <strong>education<\/strong> (schools and universities), <strong>missionary work<\/strong> (<strong>Francis Xavier<\/strong> in India and Japan), and winning back areas like Poland and southern Germany.<\/li><li><strong>Roman Inquisition (1542)<\/strong> prosecuted heresy; the <strong><em>Index of Prohibited Books<\/strong><\/em> (1559) banned dangerous works.<\/li><li>New piety: <strong>Teresa of Ávila<\/strong> (Carmelite reform, mysticism); the <strong>Ursulines<\/strong> educated girls.<\/li><\/ul>\n<h3>Big picture for the exam<\/h3>\n<p>Know <strong>why Italy<\/strong>, <strong>humanists and their works<\/strong> (Petrarch, Valla, Pico, Castiglione, Machiavelli), <strong>artists and works<\/strong>, <strong>Gutenberg's impact<\/strong>, <strong>Erasmus and More<\/strong>, the <strong>New Monarchs<\/strong> (Louis XI, Henry VII, Ferdinand and Isabella), <strong>Luther's ideas and steps<\/strong> (1517, 1521, Peasants' War, 1555), <strong>Calvin vs. Luther<\/strong>, <strong>Anabaptists<\/strong>, the <strong>English Reformation's political cause<\/strong>, and <strong>Trent + Jesuits<\/strong>.<\/p>","words":2009,"mustKnow":["Renaissance began in <strong>Italy (c. 1350)<\/strong>: wealthy trading city-states, <strong>patrons<\/strong> (Medici, popes), Roman heritage, Byzantine scholars; focus on <strong>humanism, individualism, secularism<\/strong>.","<strong>Petrarch<\/strong> = father of humanism; <strong>Valla<\/strong> exposed the <strong>Donation of Constantine<\/strong> as a forgery; <strong>Pico<\/strong>'s <em>Oration on the Dignity of Man<\/em>; <strong>Castiglione<\/strong>'s <em>Courtier<\/em>.","<strong>Machiavelli's <em>The Prince<\/strong><\/em> (1513): political realism; better to be feared than loved.","Art: <strong>perspective<\/strong> (Brunelleschi, Masaccio), <strong>Leonardo<\/strong> (<em>Last Supper<\/em>, <em>Mona Lisa<\/em>), <strong>Michelangelo<\/strong> (<em>David<\/em>, Sistine Chapel), <strong>Raphael<\/strong> (<em>School of Athens<\/em>); North: <strong>van Eyck<\/strong> (oils), <strong>Dürer<\/strong> (engravings), <strong>Bruegel<\/strong> (peasants).","<strong>Gutenberg's movable type (c. 1450)<\/strong> spread literacy and Reformation ideas rapidly.","<strong>Christian humanists:<\/strong> <strong>Erasmus<\/strong> (<em>Praise of Folly<\/em>, Greek New Testament; reform from within), <strong>Thomas More<\/strong> (<em>Utopia<\/em>).","<strong>New Monarchies:<\/strong> <strong>Louis XI<\/strong>; <strong>Henry VII<\/strong> (Bosworth 1485, Star Chamber); <strong>Ferdinand and Isabella<\/strong> (Granada, expulsion of Jews, Columbus, all <strong>1492<\/strong>; Spanish Inquisition); Habsburg <strong>Charles V<\/strong>.","<strong>Luther:<\/strong> <strong>95 Theses (1517)<\/strong> vs. indulgences; <strong>faith alone, Scripture alone, priesthood of all believers<\/strong>; <strong>Diet of Worms (1521)<\/strong>; sided with princes in the <strong>Peasants' War<\/strong>; <strong>Peace of Augsburg (1555)<\/strong>: <em>cuius regio, eius religio<\/em> (Lutheran or Catholic only).","<strong>Calvin<\/strong> (Geneva): <strong>predestination<\/strong>, <em>Institutes<\/em>; spread to Huguenots, Presbyterians (Knox), Puritans, Dutch. <strong>Anabaptists:<\/strong> adult baptism, church-state separation.","<strong>Henry VIII:<\/strong> <strong>Act of Supremacy (1534)<\/strong> for political/dynastic reasons. <strong>Council of Trent (1545–63)<\/strong> reaffirmed doctrine and reformed abuses; <strong>Jesuits<\/strong> (Loyola, 1540) for education and missions."],"timeline":[{"y":1350.0,"label":"c. 1350","text":"Petrarch and humanism in Italy","key":false},{"y":1436.0,"label":"1436","text":"Brunelleschi's dome of Florence Cathedral completed","key":false},{"y":1440.0,"label":"1440","text":"<strong>Valla<\/strong> proves the Donation of Constantine a forgery","key":true},{"y":1450.0,"label":"c. 1450","text":"<strong>Gutenberg's<\/strong> movable-type press (Bible c. 1455)","key":true},{"y":1454.0,"label":"1454","text":"Peace of Lodi: balance of power in Italy","key":false},{"y":1469.0,"label":"1469","text":"Marriage of Ferdinand and Isabella","key":false},{"y":1485.0,"label":"1485","text":"<strong>Henry VII<\/strong> wins at Bosworth; Tudor dynasty","key":true},{"y":1486.0,"label":"1486","text":"Pico's <em>Oration on the Dignity of Man<\/em>","key":false},{"y":1492.0,"label":"1492","text":"Granada conquered; <strong>Jews expelled from Spain<\/strong>; Columbus sails","key":true},{"y":1494.0,"label":"1494","text":"France invades Italy; Savonarola rules Florence","key":false},{"y":1508.0,"label":"1508–1512","text":"Michelangelo paints the Sistine Chapel ceiling","key":false},{"y":1509.0,"label":"1509","text":"Erasmus' <em>In Praise of Folly<\/em>","key":false},{"y":1513.0,"label":"1513","text":"<strong>Machiavelli<\/strong> writes <em>The Prince<\/em>","key":true},{"y":1516.0,"label":"1516","text":"More's <em>Utopia<\/em>; Erasmus' Greek New Testament; Concordat of Bologna","key":false},{"y":1517.0,"label":"1517","text":"<strong>Luther's Ninety-Five Theses<\/strong>","key":true},{"y":1519.0,"label":"1519","text":"Charles V elected Holy Roman Emperor","key":false},{"y":1521.0,"label":"1521","text":"<strong>Diet of Worms<\/strong>: Luther refuses to recant","key":true},{"y":1524.0,"label":"1524–1525","text":"German Peasants' War","key":false},{"y":1527.0,"label":"1527","text": /* ---------------- question rendering ---------------- */
function qHTML(q, sel, reveal, opts = {}) {
  const u = UBY[q.u];
  return `
  ${opts.meta === false ? "" : `<div class="small muted">${esc(u.title)} · ${{ e: "easy", m: "medium", h: "hard" }[q.d]}</div>`}
  ${q.p ? `<div class="qpass">${q.p}</div>` : ""}
  <div class="qstem">${q.q}</div>
  <div class="opts">${q.o.map((o, i) => {
    let c = "";
    if (reveal) c = i === q.a ? "right" : i === sel ? "wrong" : "";
    else if (i === sel) c = "sel";
    return `<button class="opt ${c}" data-act="pick" data-i="${i}" ${reveal ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span class="opt-body">${o}${reveal ? `<span class="why">${i === q.a ? "✓ " : "✗ "}${q.w[i]}</span>` : ""}</span></button>`;
  }).join("")}</div>`;
}
function keyIndex(e) {
  if (/^[1-5]$/.test(e.key)) return +e.key - 1;
  const k = e.key.toLowerCase(); const i = "abcde".indexOf(k);
  return k.length === 1 && i >= 0 ? i : -1;
}
function logMistake(q, k, drill) {
  const m = S.mistakes[q.id];
  if (k !== q.a) S.mistakes[q.id] = { n: (m ? m.n : 0) + 1, t: Date.now(), open: true, last: k };
  else if (m && drill) { m.open = false; m.fixed = Date.now(); }
}

/* ---------------- immediate-feedback session (unit quiz, mistake drill) ---------------- */
function practice({ title, qs, back, drill, onDone }) {
  let i = 0, sel = null; const res = [];
  if (!qs.length) { view.innerHTML = `<div class="card">No questions available here yet. <a href="${back}">Back</a></div>`; return; }
  function render() {
    const q = qs[i];
    const right = res.filter(r => r.ok).length;
    view.innerHTML = `
    <div class="qhead"><a href="${back}" class="small">← Back</a><span class="small muted">${esc(title)} · Question ${i + 1} of ${qs.length} · ${right} correct so far</span></div>
    ${bar(pct(i, qs.length))}
    <div class="card">${qHTML(q, sel, sel !== null)}
    ${sel !== null ? `<div class="feedback ${sel === q.a ? "ok" : "bad"}">${sel === q.a ? "Correct." : `Not quite. The answer is ${LETTERS[q.a]}.`} ${drill && sel === q.a ? "Cleared from your mistake log." : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" data-act="next">${i + 1 < qs.length ? "Next question" : "See results"} <span class="kbd">Enter</span></button></div>` : `<p class="small muted" style="margin:12px 0 0">Press <span class="kbd">1</span>–<span class="kbd">5</span> or click an answer.</p>`}
    </div>`;
  }
  function answer(k) {
    if (sel !== null) return;
    const q = qs[i]; sel = k; res.push({ id: q.id, k, ok: k === q.a });
    logMistake(q, k, drill); save(); render();
  }
  function next() {
    if (sel === null) return;
    i++; sel = null;
    if (i >= qs.length) { onDone(res); renderSide(); } else { render(); window.scrollTo(0, 0); }
  }
  acts.pick = el => answer(+el.dataset.i);
  acts.next = next;
  keys = e => { const k = keyIndex(e); if (k >= 0) { e.preventDefault(); answer(k); } else if (e.key === "Enter") { e.preventDefault(); next(); } };
  render();
}
function resultsByUnit(qs, answers) {
  const by = {};
  for (const q of qs) { const b = by[q.u] || (by[q.u] = { n: 0, c: 0 }); b.n++; if (answers[q.id] === q.a) b.c++; }
  return by;
}
function byUnitTable(by, extra) {
  return `<div class="tblwrap"><table><thead><tr><th>Unit</th><th>Weight</th><th>Score</th><th style="width:30%"></th>${extra ? "<th>Recommendation</th>" : ""}</tr></thead><tbody>
  ${U.filter(u => by[u.id]).map(u => { const b = by[u.id], p = pct(b.c, b.n);
    return `<tr><td><a href="#/unit/${u.id}">${esc(u.title)}</a></td><td>${u.share.toFixed(1)}%</td><td>${b.c}/${b.n} (${p}%)</td><td>${bar(p, scoreCls(p))}</td>${extra ? `<td>${extra(u, p)}</td>` : ""}</tr>`; }).join("")}
  </tbody></table></div>`;
}
function reviewList(qs, answers) {
  const missed = qs.filter(q => answers[q.id] !== q.a);
  if (!missed.length) return `<p>No misses. 🎉</p>`;
  return missed.map((q, n) => `<details class="card" id="rv-${q.id}" style="padding:12px 16px"><summary><b>${n + 1}.</b> ${q.q.replace(/<[^>]+>/g, "").slice(0, 120)}${q.q.length > 120 ? "…" : ""} <span class="chip bad">${answers[q.id] === undefined ? "blank" : "your answer " + LETTERS[answers[q.id]]}</span></summary><div style="margin-top:10px">${qHTML(q, answers[q.id], true)}</div></details>`).join("");
}

/* ---------------- deferred-feedback test (diagnostic + exams) ---------------- */
function testRunner({ title, ids, cur, timed, onSubmit, back }) {
  const qs = ids.map(id => QBY[id]);
  let showGrid = false, timer = null;
  function remaining() { return EXAM_MIN * 60000 - (Date.now() - cur.startedAt); }
  function render() {
    const q = qs[cur.idx], sel = cur.answers[q.id];
    const answered = Object.keys(cur.answers).length;
    view.innerHTML = `
    <div class="qhead">
      <div><b>${esc(title)}</b><div class="small muted">Question ${cur.idx + 1} of ${qs.length} · ${answered} answered</div></div>
      <div class="row">${timed ? `<span class="timer" id="timer"></span>` : `<a class="small" href="${back}">Save &amp; exit</a>`}</div>
    </div>
    ${bar(pct(answered, qs.length))}
    <div class="card">${qHTML(q, sel, false, { meta: false })}
      <div class="spread" style="margin-top:14px">
        <div class="row"><button class="btn" data-act="prev" ${cur.idx === 0 ? "disabled" : ""}>← Prev</button><button class="btn pri" data-act="nextq">${cur.idx + 1 < qs.length ? "Next →" : "Review"}</button></div>
        <div class="row"><button class="btn sm" data-act="flag">${cur.flags[q.id] ? "★ Flagged" : "☆ Flag"} <span class="kbd">F</span></button><button class="btn sm" data-act="grid">${showGrid ? "Hide" : "Show"} all questions</button></div>
      </div>
      ${showGrid || cur.idx + 1 === qs.length ? gridHTML() : ""}
      <div class="row" style="margin-top:14px"><button class="btn" data-act="submit">Submit ${esc(title.split(" ")[0] === "Practice" ? "exam" : "test")}</button><span class="small muted">${qs.length - answered} unanswered · ${Object.values(cur.flags).filter(Boolean).length} flagged</span></div>
    </div>`;
    tick();
  }
  function gridHTML() {
    return `<div class="qgrid">${qs.map((q, n) => `<button data-act="go" data-n="${n}" class="${cur.answers[q.id] !== undefined ? "ans" : ""} ${cur.flags[q.id] ? "flag" : ""} ${n === cur.idx ? "cur" : ""}" aria-label="Question ${n + 1}">${n + 1}</button>`).join("")}</div>`;
  }
  function tick() {
    if (!timed) return;
    const ms = remaining();
    if (ms <= 0) { submit(true); return; }
    const el = document.getElementById("timer");
    if (el) { const s = Math.ceil(ms / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; el.classList.toggle("low", s < 300); }
  }
  function go(n) { cur.idx = Math.max(0, Math.min(qs.length - 1, n)); save(); render(); window.scrollTo(0, 0); }
  function pick(k) { cur.answers[qs[cur.idx].id] = k; save(); render(); }
  function submit(auto) {
    if (!auto) {
      const left = qs.length - Object.keys(cur.answers).length;
      if (!confirm(left ? `You have ${left} unanswered question(s). Submit anyway?` : "Submit now?")) return;
    }
    if (timer) clearInterval(timer);
    keys = null;
    onSubmit(qs, auto);
  }
  acts.pick = el => pick(+el.dataset.i);
  acts.prev = () => go(cur.idx - 1);
  acts.nextq = () => go(cur.idx + 1);
  acts.go = el => go(+el.dataset.n);
  acts.flag = () => { const id = qs[cur.idx].id; cur.flags[id] = !cur.flags[id]; save(); render(); };
  acts.grid = () => { showGrid = !showGrid; render(); };
  acts.submit = () => submit(false);
  keys = e => {
    const k = keyIndex(e);
    if (k >= 0) { e.preventDefault(); pick(k); }
    else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); if (cur.idx + 1 < qs.length) go(cur.idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur.idx - 1); }
    else if (e.key.toLowerCase() === "f") { e.preventDefault(); acts.flag(); }
  };
  if (timed) { timer = setInterval(tick, 1000); cleanup.push(() => clearInterval(timer)); }
  render();
}

/* ---------------- diagnostic ---------------- */
function diagnostic() {
  setTitle("Diagnostic test");
  const ids = DATA.pools.diag;
  if (S.diag && !S.diagCur) {
    const qs = ids.map(id => QBY[id]);
    view.innerHTML = `<h1>Diagnostic results</h1><p class="sub">${S.diag.score}% overall (${Object.values(S.diag.byUnit).reduce((a, b) => a + b.c, 0)}/${ids.length}) · taken ${new Date(S.diag.date).toLocaleDateString()}</p>
    <div class="card"><h3 style="margin-top:0">Score by unit</h3>${byUnitTable(S.diag.byUnit, (u, p) => p >= SKIM_PCT ? '<span class="chip ok">Skim: lesson + must-know, then quiz</span>' : '<span class="chip bad">Must study: full lesson, cards, quiz</span>')}
    <p class="small muted">With only 3–5 questions per unit this is a rough sort, not a verdict. "Skim" units get half the study time in your hours-left estimate and study plan. Missed questions are now in your mistake log.</p>
    <div class="row"><a class="btn pri" href="${nextStep().href}">Continue: ${esc(nextStep().label)}</a><a class="btn" href="#/plan">Build my study plan</a><button class="btn sm" data-act="retake">Retake diagnostic</button></div></div>
    <h2>Review missed questions</h2>${reviewList(qs, S.diag.answers)}`;
    acts.retake = () => { if (confirm("Clear your diagnostic results and retake it?")) { S.diag = null; save(); route(); } };
    return;
  }
  if (!S.diagCur) {
    view.innerHTML = `<h1>Diagnostic test</h1><p class="sub">${ids.length} questions across all ${U.length} units, weighted like the real exam. Untimed: about 20–25 minutes.</p>
    <div class="card"><p>Take this <b>before</b> studying. Don't guess wildly; if you have no idea, pick your best hunch and move on. At the end you'll see your score by unit and which units you can <b>skim</b> versus <b>must study</b>.</p>
    <p class="small muted">No answers are shown until you submit. You can leave and resume; progress is saved.</p>
    <button class="btn pri" data-act="start">Start diagnostic</button></div>`;
    acts.start = () => { S.diagCur = { startedAt: Date.now(), answers: {}, flags: {}, idx: 0 }; save(); route(); };
    return;
  }
  testRunner({
    title: "Diagnostic test", ids, cur: S.diagCur, timed: false, back: "#/",
    onSubmit: qs => {
      const a = S.diagCur.answers, by = resultsByUnit(qs, a);
      qs.forEach(q => { if (a[q.id] !== q.a) logMistake(q, a[q.id] === undefined ? -1 : a[q.id], false); });
      S.diag = { answers: a, byUnit: by, score: pct(qs.filter(q => a[q.id] === q.a).length, qs.length), date: Date.now() };
      S.diagCur = null; save(); route();
    }
  });
}

  <div class="card" style="padding:6px 12px"><div class="tblwrap" style="margin:0"><table><thead><tr><th>Term</th><th>Definition</th><th>Box</th></tr></thead><tbody>

function cardSession(deck, scope) {
  let i = 0, flipped = false, got = 0, miss = 0; const requeued = new Set();
  function render() {
    if (i >= deck.length) {
      view.innerHTML = `<h1>Session done</h1><div class="card"><div class="stat">${got}/${got + miss}<small>remembered</small></div><p>Cards you missed are in box 1 and flagged for "Review missed only".</p>
      <div class="row"><a class="btn pri" href="#/cards${scope ? "/" + scope : ""}">Back to flashcards</a><a class="btn" href="${nextStep().href}">${esc(nextStep().label)}</a></div></div>`;
      keys = null; renderSide(); return;
    }
    const c = deck[i], st = S.cards[c.id];
    view.innerHTML = `<div class="qhead"><a class="small" href="#/cards${scope ? "/" + scope : ""}">← End session</a><span class="small muted">Card ${i + 1} of ${deck.length} · ${esc(UBY[c.u].title)}</span></div>
    ${bar(pct(i, deck.length))}
    <div class="fc ${flipped ? "flip" : ""}" data-act="flip"><div class="fc-inner">
      <div class="fc-face"><span class="fc-meta">${st ? "Box " + st.b : "New"}</span><div class="fc-front">${c.f}</div><div class="small muted" style="margin-top:14px">tap or <span class="kbd">Space</span> to flip</div></div>
      <div class="fc-face back"><span class="fc-meta">${c.f.replace(/<[^>]+>/g, "")}</span><div class="fc-back">${c.b}</div></div>
    </div></div>
    <div class="row" style="justify-content:center;${flipped ? "" : "visibility:hidden"}">
      <button class="btn" data-act="grade" data-ok="0" style="border-color:var(--bad)">✗ Missed <span class="kbd">1</span></button>
      <button class="btn pri" data-act="grade" data-ok="1">✓ Got it <span class="kbd">2</span></button>
    </div>`;
  }
  function grade(ok) {
    if (!flipped) return;
    const c = deck[i], st = S.cards[c.id] || { b: 1, n: 0 };
    st.n = (st.n || 0) + 1;
    if (ok) { st.b = Math.min(5, (S.cards[c.id] ? st.b : 1) + 1); st.due = Date.now() + BOX_DAYS[st.b] * DAY; st.lm = false; got++; }
    else { st.b = 1; st.due = Date.now(); st.lm = true; miss++; if (!requeued.has(c.id)) { requeued.add(c.id); deck.push(c); } }
    S.cards[c.id] = st; save();
    i++; flipped = false; render();
  }
  acts.flip = () => { flipped = !flipped; render(); };
  acts.grade = (el, e) => { e.stopPropagation(); grade(el.dataset.ok === "1"); };
  keys = e => {

function planTasks() {
  const t = [];
  if (!S.diag) t.push({ h: 0.75, label: "Diagnostic test (30 questions)", href: "#/diagnostic" });
  U.forEach((u, i) => {
    if (unitDone(u.id)) return;
    const f = unitRec(u.id) === "skim" ? 0.5 : 1, read = uState(u.id).read;
    const total = u.studyHours * f, lessonH = read ? 0 : total * 0.45;
    const tag = unitRec(u.id) === "skim" ? " (skim)" : "";
    if (lessonH) t.push({ h: lessonH, label: `Unit ${i + 1} lesson${tag}: ${u.title}. Read, then must-know + timeline`, href: `#/unit/${u.id}` });
    t.push({ h: total - lessonH, label: `Unit ${i + 1} practice${tag}: new flashcards + ${u.quizN}-question quiz, review misses`, href: `#/unit/${u.id}/quiz` });
  });
  return t;
}
function buildPlan(hpd, examDate) {
  const start = today0(), end = new Date(examDate + "T00:00:00");
  const days = Math.round((end - start) / DAY); // study days before exam day
  if (!(hpd > 0) || isNaN(days)) return { err: "Enter hours per day and an exam date." };
  if (days < 1) return { err: "Pick an exam date at least 1 day from today." };
  const reviewDaily = Math.min(0.25, hpd * 0.2);
  const exams = [1, 2].filter(n => !S.exams[n].attempts.length);
  const tail = []; // last days: exams
  exams.forEach(n => tail.push([{ h: 1.5, label: `Practice Exam ${n}: timed, 90 min, no pausing`, href: `#/exam/${n}` }, { h: 1, label: `Review Exam ${n} misses: drill mistake log and weakest topics`, href: "#/mistakes" }]));
  const tailDays = Math.min(tail.length, days);
  const studyDays = days - tailDays;
  const tasks = planTasks();
  const plan = [];
  for (let d = 0; d < days; d++) plan.push({ date: new Date(start.getTime() + d * DAY), items: [], h: 0 });
  // split tasks so they can fit across days
  const cap = Math.max(0.25, hpd - reviewDaily);
  const queue = [];
  tasks.forEach(t => { let left = t.h, part = 1; const parts = Math.ceil(t.h / cap - 1e-9);
    while (left > 1e-6) { const h = Math.min(left, cap); queue.push({ h, label: parts > 1 ? `${t.label} (part ${part}/${parts})` : t.label, href: t.href }); left -= h; part++; } });
  let d = 0, overflow = 0;
  for (const t of queue) {
    while (d < studyDays && plan[d].h + t.h > cap + 1e-6 && plan[d].h > 0) d++;
    if (d >= studyDays) { overflow += t.h; (plan[Math.max(0, studyDays - 1)] || plan[0]).items.push(Object.assign({ over: true }, t)); continue; }
    plan[d].items.push(t); plan[d].h += t.h;
  }
  // fill remaining study days with review
  for (let k = 0; k < studyDays; k++) {
    if (plan[k].h < cap - 0.2 && k > d) plan[k].items.push({ h: Math.min(1, cap - plan[k].h), label: "Buffer: drill mistake log, redraw the cheat sheet timeline", href: "#/mistakes" });
  }
  // exams on last days (1–2 days before exam)
  tail.forEach((items, k) => {
    const late = k >= tailDays, day = plan[days - tailDays + Math.min(k, tailDays - 1)];
    items.forEach(t => { day.items.push(late ? Object.assign({ over: true }, t) : t); day.h += t.h; });
    if (late) overflow += 2.5;
  });
  // daily flashcards + final day cheat sheet
  plan.forEach(p => { p.items.unshift({ h: reviewDaily, label: "Flashcards: review due cards", href: "#/cards" }); });
  plan[days - 1].items.push({ h: 0.5, label: "Final: redraw cheat sheet from memory; no new material", href: "#/cheatsheet" });
  const need = tasks.reduce((a, t) => a + t.h, 0) + exams.length * 2.5;
  return { plan, days, need, have: days * hpd, overflow };
}
function planPage() {
  setTitle("Study plan");
  const def = S.plan.date || isoDate(new Date(Date.now() + 21 * DAY));
  view.innerHTML = `<h1>Study plan generator</h1>
  <p class="sub">Builds a day-by-day schedule from what you have left (it uses your diagnostic: skim units get half the time). Practice exams land on the last 1–2 days before your test.</p>
  <div class="card noprint"><div class="row">

    ${r.plan.map((p, k) => `<tr><td><b>Day ${k + 1}</b><div class="small muted">${p.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div></td>

  <p class="small muted">Shares use the midpoint of each official range, normalized to 100%. Medieval History (23–27%) is split into two equal units. Question pools never overlap: diagnostic ${DATA.pools.diag.length}, unit quizzes ${Q.filter(q => q.pool === "quiz").length}, Practice Exam 1 ${DATA.pools.pe1.length}, Practice Exam 2 ${DATA.pools.pe2.length}.</p></div>
  <h2>How to use this guide</h2>
  <div class="card"><ol>
    <li>Take the <a href="#/diagnostic">diagnostic</a> (25 min). It sorts units into <b>skim</b> and <b>must study</b>.</li>
    <li>Generate a <a href="#/plan">study plan</a> from your hours per day and exam date.</li>
    <li>For each unit: lesson → must-know box → timeline → quiz (aim ≥ ${QUIZ_PASS}%) → flashcards.</li>
    <li>Review due <a href="#/cards">flashcards</a> daily (5–15 min) and drill your <a href="#/mistakes">mistake log</a>.</li>
    <li>Take <a href="#/exam/1">Practice Exam 1</a> and <a href="#/exam/2">2</a> in the last 1–2 days. Book when both are ≥ ${READY_PCT}%.</li>
  </ol>
  <p class="small muted">All questions, lessons, and cards are original study material, not official College Board items. Built ${esc(DATA.built)}. Works offline; nothing is sent anywhere.</p></div>`;
}

applyTheme();
banner();
// an exam whose time expired while the tab was closed is submitted on next open
for (const n of ["1", "2"]) { const c = S.exams[n].cur; if (c && Date.now() - c.startedAt >= EXAM_MIN * 60000 && location.hash.indexOf("#/exam/" + n) !== 0) location.hash = "#/exam/" + n; }
route();
</script>
