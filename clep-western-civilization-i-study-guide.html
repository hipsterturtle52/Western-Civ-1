.<\/li><li><strong>367 BCE:<\/strong> one consul could be (later had to be) a plebeian.<\/li><li><strong>287 BCE:<\/strong> the <strong>Hortensian Law<\/strong> made decisions of the plebeian assembly binding on all Romans.<\/li><\/ul>\n<p>In practice, rich plebeians merged with patricians into a new ruling class (the <em>nobiles<\/em>), so Rome never became a true democracy.<\/p>\n<p><strong>Roman values:<\/strong> the father of the family (<em>paterfamilias<\/em>) held legal power over his household; society ran on <strong>patron-client<\/strong> relationships (powerful patrons protected clients, who gave loyalty and votes); and Romans prized <strong><em>pietas<\/strong><\/em> (duty to gods, family, and state), <strong><em>gravitas<\/strong><\/em> (seriousness), and the \"<strong>custom of the ancestors<\/strong>\" (<em>mos maiorum<\/em>).<\/p>\n<h3>2. Conquest of the Mediterranean<\/h3>\n<p>Rome conquered Italy by about 265 BCE and treated many defeated peoples generously, making them <strong>allies<\/strong> or granting partial <strong>citizenship<\/strong>. Loyal allies supplied soldiers, and <strong>roads<\/strong> linked them to Rome.<\/p>\n<p>Then came the <strong>Punic Wars<\/strong> against <strong>Carthage<\/strong>, the Phoenician-founded trading power of North Africa:<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>War<\/th><th>Dates<\/th><th>Key facts<\/th><\/tr><\/thead><tbody><tr><td><strong>First<\/strong><\/td><td>264–241 BCE<\/td><td>Fought over <strong>Sicily<\/strong>; Rome built its <strong>first navy<\/strong> and won Sicily, its first province<\/td><\/tr><tr><td><strong>Second<\/strong><\/td><td>218–201 BCE<\/td><td><strong>Hannibal<\/strong> crossed the <strong>Alps with elephants<\/strong>, crushed Rome at <strong>Cannae (216 BCE)<\/strong>, but couldn't take the city; <strong>Scipio Africanus<\/strong> invaded Africa and beat him at <strong>Zama (202 BCE)<\/strong><\/td><\/tr><tr><td><strong>Third<\/strong><\/td><td>149–146 BCE<\/td><td>\"<strong>Carthage must be destroyed<\/strong>\" (<strong>Cato the Elder<\/strong>); Rome razed Carthage and enslaved its people<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Also in <strong>146 BCE<\/strong>, Rome destroyed Corinth; Macedonia and Greece became Roman. By the first century BCE, the Mediterranean was a Roman lake: <em>mare nostrum<\/em>, \"our sea.\"<\/p>\n<h3>3. Why conquest wrecked the Republic<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Conquest floods Italy with <strong>slaves<\/strong>, plunder, and cheap grain; rich men build huge slave-run estates, the <strong>latifundia<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Small farmers, away at war for years, lose their land and drift into Rome as a jobless urban poor<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Huge wealth gap, angry mobs, and ambitious generals: the Republic slides into civil war<\/div><\/div>\n<ul><li><strong>The Gracchi brothers:<\/strong> <strong>Tiberius Gracchus<\/strong> (tribune, 133 BCE) proposed giving public land to the poor; senators killed him. His brother <strong>Gaius Gracchus<\/strong> (123–121 BCE) pushed land reform and <strong>cheap grain<\/strong> for the urban poor and was also killed. Political violence was now normal. Politicians split into <strong>optimates<\/strong> (Senate party) and <strong>populares<\/strong> (who appealed to the people).<\/li><li><strong>Gaius Marius<\/strong> (consul 107 BCE and many times after) reformed the army by recruiting <strong>landless volunteers<\/strong> who were paid and promised land. Soldiers now looked to their <strong>general<\/strong>, not the state, for rewards: <strong>private armies<\/strong>.<\/li><li><strong>Sulla<\/strong> used his army to <strong>march on Rome<\/strong> (88 BCE), then made himself dictator (82 BCE) and killed his enemies.<\/li><li><strong>Spartacus<\/strong>, a gladiator, led a massive <strong>slave revolt (73–71 BCE)<\/strong>, crushed by Crassus.<\/li><\/ul>\n<h4>Julius Caesar and the end of the Republic<\/h4>\n<ul><li><strong>First Triumvirate (60 BCE):<\/strong> an informal alliance of <strong>Julius Caesar<\/strong>, <strong>Pompey<\/strong>, and <strong>Crassus<\/strong>.<\/li><li>Caesar conquered <strong>Gaul<\/strong> (58–50 BCE) and won a loyal army and fame.<\/li><li>Ordered to disband, he <strong>crossed the Rubicon<\/strong> River with his army (<strong>49 BCE<\/strong>), starting civil war and defeating Pompey.<\/li><li>As dictator he reformed debt and land, expanded citizenship, enlarged the Senate, and created the 365-day <strong>Julian calendar<\/strong>. In early 44 BCE he was named <strong>dictator for life<\/strong>.<\/li><li>On the <strong>Ides of March, 44 BCE<\/strong>, senators led by <strong>Brutus<\/strong> and <strong>Cassius<\/strong> stabbed him to death to \"save the Republic.\" The orator <strong>Cicero<\/strong>, the Republic's great defender, was murdered the next year.<\/li><li><strong>Second Triumvirate (43 BCE):<\/strong> <strong>Octavian<\/strong> (Caesar's adopted heir), <strong>Mark Antony<\/strong>, and Lepidus. Octavian then defeated Antony and <strong>Cleopatra<\/strong> of Egypt at <strong>Actium (31 BCE)<\/strong>.<\/li><\/ul>\n<h3>4. The Empire and the Pax Romana<\/h3>\n<p>In <strong>27 BCE<\/strong>, the Senate gave Octavian the title <strong>Augustus<\/strong> (\"revered one\"). He called himself <strong><em>princeps<\/strong><\/em> (\"first citizen\") and <strong>kept the Republic's outward forms<\/strong> (Senate, consuls, elections) while actually controlling the army, provinces, and treasury. This system is the <strong>Principate<\/strong>.<\/p>\n<p>Augustus created a <strong>professional standing army<\/strong> and the <strong>Praetorian Guard<\/strong>, built a salaried civil service, took censuses, and rebuilt Rome (\"found a city of brick and left it marble\"). His reign began the <strong>Pax Romana<\/strong> (\"Roman Peace,\" <strong>27 BCE–180 CE<\/strong>): two centuries of relative peace, trade, and prosperity across the Mediterranean.<\/p>\n<p>Emperors to know:<\/p>\n<ul><li><strong>Julio-Claudians:<\/strong> Tiberius, Caligula, Claudius (conquered Britain), <strong>Nero<\/strong> (blamed Christians for the <strong>Great Fire of 64 CE<\/strong>).<\/li><li><strong>Flavians:<\/strong> Vespasian (began the <strong>Colosseum<\/strong>); his son <strong>Titus<\/strong> destroyed <strong>Jerusalem's Temple in 70 CE<\/strong> during the Jewish revolt.<\/li><li><strong>\"Five Good Emperors\"<\/strong> (96–180 CE), each choosing a capable adopted heir: Nerva, <strong>Trajan<\/strong> (empire's <strong>greatest extent<\/strong>, 117 CE), <strong>Hadrian<\/strong> (stopped expanding; <strong>Hadrian's Wall<\/strong> in Britain), Antoninus Pius, and <strong>Marcus Aurelius<\/strong> (a Stoic philosopher who wrote the <strong><em>Meditations<\/strong><\/em>). His unfit son <strong>Commodus<\/strong> ended the good run.<\/li><\/ul>\n<p>Cities had public baths, forums, and amphitheaters. Emperors kept the urban poor quiet with free grain and games: \"<strong>bread and circuses<\/strong>.\" In <strong>212 CE<\/strong>, Emperor Caracalla granted <strong>citizenship to all free men<\/strong> in the empire.<\/p>\n<h3>5. Roman law, thought, and culture<\/h3>\n<p><strong>Law<\/strong> may be Rome's greatest legacy. It grew from the Twelve Tables to the <strong><em>ius civile<\/strong><\/em> (law for citizens) and the <strong><em>ius gentium<\/strong><\/em> (\"<strong>law of nations<\/strong>,\" applied to all peoples), and jurists linked it to <strong>natural law<\/strong>, the Stoic idea of universal principles of justice knowable by reason. Principles such as <strong>innocent until proven guilty<\/strong> and judging intent survived through <strong>Justinian's Code<\/strong> (Unit 4) into modern European law.<\/p>\n<p>Romans admired and absorbed Greek culture (<strong>Greco-Roman<\/strong> civilization) but were more <strong>practical<\/strong>:<\/p>\n<ul><li><strong>Engineering:<\/strong> the <strong>arch<\/strong>, <strong>concrete<\/strong>, <strong>aqueducts<\/strong>, a vast <strong>road<\/strong> network, the <strong>Colosseum<\/strong>, and the domed <strong>Pantheon<\/strong>.<\/li><li><strong>Literature (the \"Golden Age\" under Augustus):<\/strong> <strong>Virgil<\/strong>'s <strong><em>Aeneid<\/strong><\/em>, an epic linking Rome's founding to the Trojan hero Aeneas and glorifying Augustus; <strong>Horace<\/strong> (odes); <strong>Ovid<\/strong> (<em>Metamorphoses<\/em>; exiled by Augustus); <strong>Livy<\/strong>'s history of Rome from its founding, full of moral lessons.<\/li><li><strong>History &amp; thought:<\/strong> <strong>Tacitus<\/strong> criticized imperial tyranny and, in <em>Germania<\/em>, praised Germanic tribes' simple virtues to shame Roman decadence. <strong>Cicero<\/strong> = Latin prose and oratory, defense of the Republic and natural law. <strong>Lucretius<\/strong> spread Epicurean philosophy; <strong>Seneca<\/strong> and <strong>Marcus Aurelius<\/strong> were <strong>Stoics<\/strong>. <strong>Stoicism<\/strong> fit Roman ideals of duty.<\/li><li><strong>Science:<\/strong> <strong>Galen<\/strong> (medicine, dominant for 1,400 years) and <strong>Ptolemy<\/strong> (a geocentric, Earth-centered model of the universe, accepted until Copernicus). Both wrote in Greek.<\/li><li><strong>Latin<\/strong> became the root of the <strong>Romance languages<\/strong> (Italian, French, Spanish, Portuguese, Romanian).<\/li><\/ul>\n<h3>6. Early Christianity<\/h3>\n<p><strong>Jesus of Nazareth<\/strong> (c. 4 BCE–c. 30 CE) was a Jewish teacher in <strong>Judea<\/strong>, then under Roman rule. He preached love of God and neighbor, forgiveness, and the coming <strong>Kingdom of God<\/strong>. The Roman governor <strong>Pontius Pilate<\/strong> had him <strong>crucified<\/strong>; his followers proclaimed his <strong>resurrection<\/strong> and called him the <strong>Christ<\/strong> (Messiah).<\/p>\n<p><strong>Paul of Tarsus<\/strong>, a Jewish convert, was the key missionary. He took the faith to <strong>Gentiles<\/strong> (non-Jews), taught that salvation came through <strong>faith in Christ<\/strong> rather than following Jewish law, and wrote letters (<strong>Epistles<\/strong>) that form much of the New Testament. <strong>Peter<\/strong>, leader of the apostles, was martyred in Rome; the <strong>bishop of Rome (the pope)<\/strong> later claimed authority as Peter's successor (the <strong>Petrine doctrine<\/strong>).<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Pax Romana's safe <strong>roads and sea lanes<\/strong>, a common Greek language, and a message of <strong>salvation and equality<\/strong> open to all, including slaves, women, and the poor<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Christianity spreads city to city through tight-knit communities that care for widows and the sick<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Despite persecution, Christians become a large minority by 300 CE<\/div><\/div>\n<p>Romans tolerated most religions, but Christians <strong>refused to sacrifice to the emperor and Roman gods<\/strong>, which seemed disloyal. Persecution came in waves: <strong>Nero (64 CE)<\/strong>, <strong>Decius (250)<\/strong>, and the <strong>Great Persecution<\/strong> under <strong>Diocletian (303)<\/strong>. <strong>Martyrs<\/strong> inspired others.<\/p>\n<p>The Church organized itself on Roman lines: <strong>bishops<\/strong> headed city churches (<strong>dioceses<\/strong>), and bishops of great cities (Rome, Alexandria, Antioch, later Constantinople) gained special authority.<\/p>\n<p><strong>Church Fathers<\/strong> shaped Christian thought:<\/p>\n<ul><li><strong>Jerome:<\/strong> translated the Bible into Latin, the <strong>Vulgate<\/strong>.<\/li><li><strong>Ambrose:<\/strong> bishop of Milan; insisted the emperor was <strong>within the Church, not above it<\/strong> (forced Theodosius to do penance).<\/li><li><strong>Augustine of Hippo<\/strong> (354–430): <strong><em>Confessions<\/strong><\/em> (his conversion) and <strong><em>City of God<\/strong><\/em>, written after the <strong>410 sack of Rome<\/strong>, contrasting the doomed <strong>earthly city<\/strong> with the eternal <strong>City of God<\/strong>. He stressed <strong>original sin<\/strong> and God's <strong>grace<\/strong>.<\/li><\/ul>\n<h3>7. Crisis and reform: the late Empire<\/h3>\n<p><strong>Crisis of the Third Century (235–284 CE):<\/strong> some 20+ emperors in 50 years, most murdered; armies making and unmaking emperors; invasions on the Rhine, Danube, and from Persia; <strong>plague<\/strong>; and runaway <strong>inflation<\/strong> as emperors <strong>debased the coinage<\/strong> to pay soldiers.<\/p>\n<p><strong>Diocletian<\/strong> (284–305) restored order with force:<\/p>\n<ul><li>Split the empire into <strong>East and West<\/strong> and created the <strong>Tetrarchy<\/strong> (rule of four: two senior emperors and two juniors).<\/li><li>Issued a <strong>price edict<\/strong> (wage and price controls, which failed), raised taxes, and tied people to their jobs: tenant farmers (<strong>coloni<\/strong>) were bound to the land, an early step toward <strong>serfdom<\/strong>.<\/li><li>Launched the <strong>Great Persecution<\/strong> of Christians (303).<\/li><\/ul>\n<p><strong>Constantine<\/strong> (306–337) reversed course on religion:<\/p>\n<ul><li>Before the <strong>Battle of the Milvian Bridge (312)<\/strong> he reportedly saw a vision of the cross (\"<strong>In this sign, conquer<\/strong>\"), and won.<\/li><li>The <strong>Edict of Milan (313)<\/strong> granted <strong>toleration<\/strong> to Christianity.<\/li><li>He called the <strong>Council of Nicaea (325)<\/strong>, which condemned <strong>Arianism<\/strong> (the belief that Jesus was a created being, lesser than God the Father) and produced the <strong>Nicene Creed<\/strong>.<\/li><li>He moved the capital east to <strong>Constantinople<\/strong> (founded <strong>330<\/strong> on old Byzantium), a sign that the empire's wealth lay in the East.<\/li><\/ul>\n<p><strong>Theodosius I<\/strong> made Christianity the <strong>official state religion (380)<\/strong> and banned pagan sacrifices. After his death in <strong>395<\/strong>, the empire <strong>split permanently<\/strong> into Western and Eastern (Byzantine) halves.<\/p>\n<h3>8. The Germanic invasions and the fall of the West<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Huns<\/strong> from Central Asia push west (370s)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Germanic peoples flee into the empire: the <strong>Visigoths<\/strong> cross the Danube (376) and destroy a Roman army at <strong>Adrianople (378)<\/strong>, killing Emperor Valens<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>The West can no longer control its borders; Germanic kingdoms replace Roman rule by 476<\/div><\/div>\n<ul><li><strong>410:<\/strong> <strong>Alaric<\/strong> and the <strong>Visigoths<\/strong> <strong>sack Rome<\/strong>, the first time in 800 years.<\/li><li><strong>451:<\/strong> <strong>Attila the Hun<\/strong> is checked at the <strong>Catalaunian Plains<\/strong> (Châlons) in Gaul; in 452 <strong>Pope Leo I<\/strong> meets Attila and persuades him to spare Rome.<\/li><li><strong>455:<\/strong> the <strong>Vandals<\/strong> (from their kingdom in <strong>North Africa<\/strong>) sack Rome.<\/li><li><strong>476:<\/strong> the Germanic general <strong>Odoacer<\/strong> deposes the last western emperor, the boy <strong>Romulus Augustulus<\/strong>: the traditional \"<strong>fall of Rome<\/strong>.\" The <strong>Eastern Empire<\/strong> continued for nearly 1,000 more years.<\/li><\/ul>\n<p><strong>Why did the West fall?<\/strong> Historians list many interacting causes: <strong>political<\/strong> (instability, civil wars), <strong>economic<\/strong> (heavy taxes, inflation, declining trade and cities), <strong>military<\/strong> (overstretched borders, reliance on Germanic mercenaries and <em>foederati<\/em>, \"federated\" allies, who had their own loyalties), <strong>division<\/strong> (the richer East looked after itself), and <strong>external pressure<\/strong> (the Huns and migrating Germanic peoples). Edward Gibbon (18th century) also blamed Christianity and lost civic virtue, a view that is debated.<\/p>\n<p><strong>New Germanic kingdoms (c. 500):<\/strong> <strong>Ostrogoths<\/strong> in Italy (King <strong>Theodoric<\/strong>), <strong>Visigoths<\/strong> in Spain, <strong>Franks<\/strong> in Gaul, <strong>Anglo-Saxons<\/strong> in Britain, <strong>Vandals<\/strong> in North Africa.<\/p>\n<p><strong>Germanic customs:<\/strong> loyalty of warriors to their chief (the <strong><em>comitatus<\/strong><\/em>, a root of feudal loyalty); <strong>unwritten customary law<\/strong>; <strong><em>wergild<\/strong><\/em> (\"man-money,\" a fine paid to the victim's family, scaled by the victim's rank, instead of blood feud); <strong>trial by ordeal<\/strong>. Most Goths were <strong>Arian<\/strong> Christians, which separated them from their Catholic Roman subjects.<\/p>\n<h3>Big picture for the exam<\/h3>\n<p>Know the <strong>Republic's institutions<\/strong> and the <strong>plebeian gains<\/strong>; the <strong>Punic Wars<\/strong>; the chain <strong>conquest → latifundia → Gracchi → generals' private armies → Caesar → Augustus<\/strong>; how Augustus <strong>disguised monarchy<\/strong> as Republic; Roman <strong>law, engineering, and writers<\/strong>; <strong>Paul<\/strong> and <strong>Augustine<\/strong>; <strong>Diocletian vs. Constantine<\/strong>; and the <strong>sequence of invasions<\/strong> ending in <strong>476<\/strong>.<\/p>","words":2216,"mustKnow":["<strong>509 BCE<\/strong> Republic: 2 <strong>consuls<\/strong> (1 year, mutual veto), <strong>Senate<\/strong> (finance, foreign policy), <strong>tribunes<\/strong> (plebeian veto), emergency <strong>dictator<\/strong> (6 months; Cincinnatus).","<strong>Struggle of the Orders:<\/strong> tribunes (494), <strong>Twelve Tables<\/strong> (c. 450, first written law), plebeian consul (367), <strong>Hortensian Law<\/strong> (287).","<strong>Punic Wars<\/strong> vs. Carthage: Hannibal crosses the Alps, wins at <strong>Cannae (216)<\/strong>; <strong>Scipio<\/strong> wins at <strong>Zama (202)<\/strong>; Carthage destroyed <strong>146 BCE<\/strong>.","Conquest → slave-run <strong>latifundia<\/strong> → ruined small farmers → <strong>Gracchi<\/strong> reforms (133, 123 BCE) → <strong>Marius<\/strong>' volunteer army loyal to generals → civil wars.","<strong>Julius Caesar:<\/strong> conquered Gaul, crossed the <strong>Rubicon (49)<\/strong>, dictator for life, Julian calendar; assassinated <strong>44 BCE<\/strong>.","<strong>Augustus<\/strong> (27 BCE–14 CE): <strong>princeps<\/strong>, kept Republican forms (<strong>Principate<\/strong>); began the <strong>Pax Romana<\/strong> (to 180 CE).","Culture: <strong>Virgil's Aeneid<\/strong>, Livy, Tacitus, Cicero; arches, concrete, aqueducts; <strong>Roman law<\/strong> (<em>ius gentium<\/em>, natural law); Ptolemy's geocentrism, Galen's medicine.","<strong>Christianity:<\/strong> <strong>Paul<\/strong> spread it to Gentiles; persecutions (Nero, Diocletian); <strong>Edict of Milan (313)<\/strong>; <strong>Council of Nicaea (325)<\/strong> vs. <strong>Arianism<\/strong>; <strong>Theodosius<\/strong> made it the state religion (380).","<strong>Diocletian:<\/strong> tetrarchy, East/West split, price controls, coloni bound to land. <strong>Constantine:<\/strong> toleration, Nicaea, <strong>Constantinople (330)<\/strong>.","Fall of the West: <strong>Adrianople (378)<\/strong>, <strong>Alaric sacks Rome (410)<\/strong>, Vandals (455), <strong>Odoacer deposes Romulus Augustulus (476)<\/strong>. <strong>Augustine's City of God<\/strong> answered the 410 sack."],"timeline":[{"y":-753.0,"label":"753 BCE","text":"Legendary founding of Rome by Romulus","key":false},{"y":-509.0,"label":"509 BCE","text":"Last king expelled; <strong>Roman Republic<\/strong> founded","key":true},{"y":-494.0,"label":"494 BCE","text":"Plebeians win tribunes (Struggle of the Orders begins)","key":false},{"y":-450.0,"label":"c. 450 BCE","text":"<strong>Twelve Tables<\/strong>: first written Roman law","key":true},{"y":-287.0,"label":"287 BCE","text":"Hortensian Law: plebeian assembly binding on all","key":false},{"y":-264.0,"label":"264–146 BCE","text":"<strong>Punic Wars<\/strong> with Carthage","key":true},{"y":-216.0,"label":"216 BCE","text":"Hannibal's victory at Cannae","key":false},{"y":-202.0,"label":"202 BCE","text":"Scipio defeats Hannibal at Zama","key":false},{"y":-146.0,"label":"146 BCE","text":"Carthage and Corinth destroyed","key":false},{"y":-133.0,"label":"133 BCE","text":"<strong>Tiberius Gracchus<\/strong>' land reform; murdered","key":true},{"y":-107.0,"label":"107 BCE","text":"Marius' army reforms","key":false},{"y":-73.0,"label":"73–71 BCE","text":"Spartacus' slave revolt","key":false},{"y":-49.0,"label":"49 BCE","text":"<strong>Caesar crosses the Rubicon<\/strong>","key":true},{"y":-44.0,"label":"44 BCE","text":"<strong>Caesar assassinated<\/strong> (Ides of March)","key":true},{"y":-31.0,"label":"31 BCE","text":"Actium: Octavian defeats Antony and Cleopatra","key":false},{"y":-27.0,"label":"27 BCE","text":"Octavian becomes <strong>Augustus<\/strong>; <strong>Pax Romana<\/strong> begins","key":true},{"y":30.0,"label":"c. 30 CE","text":"Crucifixion of Jesus in Judea","key":false},{"y":64.0,"label":"64 CE","text":"Great Fire of Rome; Nero persecutes Christians","key":false},{"y":70.0,"label":"70 CE","text":"Titus destroys the Temple in Jerusalem","key":false},{"y":117.0,"label":"117 CE","text":"Empire's greatest extent under Trajan","key":false},{"y":180.0,"label":"180 CE","text":"Marcus Aurelius dies; Pax Romana ends","key":true},{"y":235.0,"label":"235–284","text":"Crisis of the Third Century","key":false},{"y":284.0,"label":"284","text":"<strong>Diocletian<\/strong>: tetrarchy, East/West division","key":true},{"y":313.0,"label":"313","text":"<strong>Edict of Milan<\/strong>: Christianity tolerated","key":true},{"y":325.0,"label":"325","text":"<strong>Council of Nicaea<\/strong> condemns Arianism","key":true},{"y":330.0,"label":"330","text":"Constantinople dedicated as new capital","key":false},{"y":378.0,"label":"378","text":"Visigoths defeat Rome at Adrianople","key":false},{"y":380.0,"label":"380","text":"Theodosius makes Christianity the state religion","key":true},{"y":395.0,"label":"395","text":"Empire permanently divided East/West","key":false},{"y":410.0,"label":"410","text":"<strong>Alaric's Visigoths sack Rome<\/strong>","key":true},{"y":451.0,"label":"451","text":"Attila checked at the Catalaunian Plains","key":false},{"y":455.0,"label":"455","text":"Vandals sack Rome","key":false},{"y":476.0,"label":"476","text":"<strong>Odoacer deposes Romulus Augustulus<\/strong>: end of the Western Empire","key":true}],"people":[{"name":"Cincinnatus","desc":"Model citizen-dictator who gave up power voluntarily"},{"name":"Hannibal","desc":"Carthaginian general; crossed the Alps; won at Cannae (216 BCE)"},{"name":"Scipio Africanus","desc":"Defeated Hannibal at Zama (202 BCE)"},{"name":"Tiberius & Gaius Gracchus","desc":"Tribunes who pushed land reform; both killed"},{"name":"Marius / Sulla","desc":"Volunteer army loyal to generals / marched on Rome, dictator"},{"name":"Julius Caesar","desc":"Conquered Gaul; crossed the Rubicon; dictator; killed 44 BCE"},{"name":"Cicero","desc":"Orator and statesman; defended the Republic and natural law"},{"name":"Augustus","desc":"First emperor (27 BCE); princeps; Pax Romana"},{"name":"Virgil","desc":"<em>Aeneid<\/em>: epic of Rome's founding honoring Augustus"},{"name":"Tacitus","desc":"Historian; critic of tyranny; <em>Germania<\/em>"},{"name":"Marcus Aurelius","desc":"Stoic emperor; <em>Meditations<\/em>; last of the Five Good Emperors"},{"name":"Paul of Tarsus","desc":"Spread Christianity to Gentiles; Epistles"},{"name":"Augustine of Hippo","desc":"<em>Confessions<\/em>, <em>City of God<\/em>; original sin and grace"},{"name":"Diocletian","desc":"Tetrarchy; split empire; price edict; persecution of 303"},{"name":"Constantine","desc":"Milvian Bridge; Edict of Milan; Nicaea; Constantinople"},{"name":"Odoacer","desc":"Germanic general who deposed the last western emperor (476)"}],"cards":[{"id":"ro-c1","f":"Patricians vs. plebeians","b":"Rome's aristocratic landowning families vs. the common majority; their conflict was the Struggle of the Orders."},{"id":"ro-c2","f":"Consuls","b":"Two Roman chief magistrates elected for one year; commanded armies; each could veto the other."},{"id":"ro-c3","f":"Senate (Roman)","b":"Council of about 300 aristocrats serving for life; controlled finance and foreign policy."},{"id":"ro-c4","f":"Tribunes","b":"Officials elected by plebeians who could veto actions harmful to plebeians."},{"id":"ro-c5","f":"Dictator (Roman)","b":"Emergency ruler with absolute power for up to six months (e.g., Cincinnatus)."},{"id":"ro-c6","f":"Twelve Tables","b":"Rome's first written law code (c. 450 BCE), displayed in the Forum to protect plebeians."},{"id":"ro-c7","f":"Mixed constitution","b":"Polybius' description of Rome balancing monarchy (consuls), aristocracy (Senate), and democracy (assemblies)."},{"id":"ro-c8","f":"Punic Wars","b":"Three wars with Carthage (264–146 BCE); Hannibal, Cannae, Zama; Carthage destroyed in 146 BCE."},{"id":"ro-c9","f":"Hannibal","b":"Carthaginian general who crossed the Alps with elephants and beat Rome at Cannae (216 BCE); lost at Zama."},{"id":"ro-c10","f":"Latifundia","b":"Huge slave-worked estates owned by the rich, which pushed small farmers off the land."},{"id":"ro-c11","f":"Gracchi","b":"Brothers Tiberius and Gaius Gracchus, tribunes who sought land reform and grain for the poor; both killed."},{"id":"ro-c12","f":"Marius' army reform","b":"Recruiting landless volunteers paid by their general, creating armies loyal to commanders, not the state."},{"id":"ro-c13","f":"Crossing the Rubicon","b":"Caesar leading his army into Italy (49 BCE), starting civil war; now means a point of no return."},{"id":"ro-c14","f":"Julius Caesar","b":"Conqueror of Gaul, dictator for life, creator of the Julian calendar; assassinated 44 BCE."},{"id":"ro-c15","f":"Augustus / princeps","b":"Octavian's title (27 BCE); \"first citizen\" who ruled as emperor behind Republican forms."},{"id":"ro-c16","f":"Pax Romana","b":"Roman Peace, 27 BCE–180 CE: two centuries of stability and trade."},{"id":"ro-c17","f":"Bread and circuses","b":"Free grain and public games used to keep Rome's urban poor content."},{"id":"ro-c18","f":"Ius gentium","b":"\"Law of nations\": Roman law applied to all peoples; linked to natural law."},{"id":"ro-c19","f":"Aeneid","b":"Virgil's epic of Aeneas founding the Roman people; glorified Augustus."},{"id":"ro-c20","f":"Tacitus","b":"Roman historian who criticized imperial tyranny; <em>Germania<\/em> praised Germanic virtues."},{"id":"ro-c21","f":"Ptolemy","b":"2nd-century astronomer in Alexandria; Earth-centered (geocentric) model."},{"id":"ro-c22","f":"Paul of Tarsus","b":"Apostle to the Gentiles; taught salvation by faith; wrote the Epistles."},{"id":"ro-c23","f":"Petrine doctrine","b":"Claim that the bishop of Rome (pope) inherits Peter's leadership of the Church."},{"id":"ro-c24","f":"Edict of Milan","b":"313: Constantine and Licinius grant religious toleration to Christians."},{"id":"ro-c25","f":"Council of Nicaea","b":"325: condemned Arianism; produced the Nicene Creed."},{"id":"ro-c26","f":"Arianism","b":"Heresy that Jesus was created by and lesser than God the Father."},{"id":"ro-c27","f":"City of God","b":"Augustine's work written after the 410 sack of Rome; earthly city vs. heavenly city."},{"id":"ro-c28","f":"Diocletian","b":"Emperor (284–305): tetrarchy, East/West division, price edict, Great Persecution."},{"id":"ro-c29","f":"Constantinople","b":"\"New Rome,\" founded by Constantine in 330 on Byzantium; capital of the Eastern Empire."},{"id":"ro-c30","f":"476 CE","b":"Odoacer deposes Romulus Augustulus: traditional end of the Western Roman Empire."},{"id":"ro-c31","f":"Wergild","b":"Germanic \"man-money\": compensation paid to a victim's family instead of blood feud."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Republic (509–27 BCE)<\/th><th>Empire / Principate (27 BCE–476 CE)<\/th><\/tr><\/thead><tbody><tr><td>Leaders<\/td><td>Two annual consuls; Senate dominant<\/td><td>Emperor (<em>princeps<\/em>), Republican forms kept<\/td><\/tr><tr><td>Expansion<\/td><td>Italy, Punic Wars, Greece, Gaul<\/td><td>Peak under Trajan (117 CE), then defense<\/td><\/tr><tr><td>Army<\/td><td>Citizen militia → Marius' volunteers<\/td><td>Professional standing army<\/td><\/tr><tr><td>Key crisis<\/td><td>Gracchi, generals, civil wars<\/td><td>Third-century crisis; invasions<\/td><\/tr><tr><td>Writers<\/td><td>Cicero, Polybius, Lucretius<\/td><td>Virgil, Livy, Tacitus, Seneca, Marcus Aurelius<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Diocletian (284–305)<\/th><th>Constantine (306–337)<\/th><\/tr><\/thead><tbody><tr><td>Structure<\/td><td>Tetrarchy; empire split East/West<\/td><td>Reunited empire under one ruler<\/td><\/tr><tr><td>Economy<\/td><td>Price edict; coloni tied to land<\/td><td>Continued hereditary jobs; new gold coin (solidus)<\/td><\/tr><tr><td>Christians<\/td><td>Great Persecution (303)<\/td><td>Edict of Milan (313); Council of Nicaea (325)<\/td><\/tr><tr><td>Capital<\/td><td>Ruled from the East (Nicomedia)<\/td><td>Founded Constantinople (330)<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"ema","title":"Early Middle Ages: Byzantium, Islam, Franks, Feudalism","topic":"medieval","share":13.4,"quizN":12,"examN":16,"diagN":4,"cardTarget":24,"lessonMin":11,"studyHours":2.0,"intro":"After Rome's western collapse, three heirs emerged: Byzantium (Greek, Orthodox), Islam (Arabic, a new faith and empire), and the Latin West (Catholic, Germanic kingdoms). This is the first half of Medieval History (23–27%).","lesson":"<h3>1. Three heirs of Rome<\/h3>\n<p>By 600 CE the old Roman world had split into three civilizations that the exam constantly compares:<\/p>\n<ul><li><strong>Byzantine Empire:<\/strong> the surviving Eastern Roman Empire, Greek-speaking, Orthodox Christian, capital <strong>Constantinople<\/strong>.<\/li><li><strong>Islamic world:<\/strong> a new faith from Arabia that built an empire from Spain to India within a century.<\/li><li><strong>Latin West:<\/strong> Germanic kingdoms, Latin-speaking clergy, the pope in Rome, and a poorer, rural economy.<\/li><\/ul>\n<h3>2. The Byzantine Empire<\/h3>\n<p><strong>Constantinople<\/strong> controlled the straits between Europe and Asia and the trade routes linking the Black Sea and the Mediterranean. It was rich, well defended by massive land walls, and run by a trained bureaucracy. The <strong>gold coin<\/strong> (the solidus or \"bezant\") was trusted across the Mediterranean.<\/p>\n<p><strong>Justinian<\/strong> (ruled 527–565), with his influential wife <strong>Theodora<\/strong>, is the emperor to know:<\/p>\n<ul><li><strong>Corpus Juris Civilis<\/strong> (\"Body of Civil Law,\" <strong>Justinian's Code<\/strong>): a commission led by Tribonian collected and organized centuries of Roman law. It became the basis of law in most of continental Europe.<\/li><li><strong>Hagia Sophia<\/strong> (\"Holy Wisdom,\" 537): an enormous domed church.<\/li><li><strong>Nika Riots (532):<\/strong> rioters nearly toppled him; Theodora convinced him to stay and fight, and the army crushed the revolt.<\/li><li><strong>Reconquest:<\/strong> his general <strong>Belisarius<\/strong> retook <strong>North Africa<\/strong> from the Vandals and <strong>Italy<\/strong> from the Ostrogoths. But the wars and the <strong>Plague of Justinian (541)<\/strong> drained the empire, and most of Italy fell to the <strong>Lombards<\/strong> soon after (568).<\/li><\/ul>\n<p><strong>Byzantine features to remember:<\/strong><\/p>\n<ul><li><strong>Caesaropapism:<\/strong> the emperor controlled both state <strong>and<\/strong> church, appointing the <strong>patriarch<\/strong> of Constantinople. (In the West, popes and kings were separate and often rivals.)<\/li><li><strong>Greek fire:<\/strong> a secret liquid incendiary weapon that destroyed enemy fleets, helping save the city in the Arab sieges (674–678, 717–718).<\/li><li><strong>Iconoclasm (726–843):<\/strong> Emperor Leo III banned religious images (<strong>icons<\/strong>) as idolatry. The fight split Byzantine society and angered the pope; icons were restored in 843.<\/li><li><strong>Missions to the Slavs:<\/strong> the brothers <strong>Cyril and Methodius<\/strong> created a Slavic alphabet (the ancestor of <strong>Cyrillic<\/strong>). Prince <strong>Vladimir of Kiev<\/strong> converted to Orthodox Christianity in <strong>988<\/strong>, tying Russia to Byzantine religion and culture.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Centuries of disagreement over <strong>papal authority<\/strong>, the <em>filioque<\/em> clause in the creed, clergy marriage, leavened bread, and language (Latin vs. Greek)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>In <strong>1054<\/strong> the pope's envoy and the patriarch <strong>excommunicate<\/strong> each other: the <strong>Great Schism<\/strong><\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Christianity splits into the <strong>Roman Catholic<\/strong> West and the <strong>Eastern Orthodox<\/strong> East<\/div><\/div>\n<p><strong>Legacy:<\/strong> for 1,000 years after 476 Byzantium <strong>shielded Europe<\/strong> from eastern invaders and <strong>preserved Greek classics and Roman law<\/strong>. It fell to the <strong>Ottoman Turks in 1453<\/strong>.<\/p>\n<h3>3. The rise of Islam<\/h3>\n<p><strong>Muhammad<\/strong> (c. 570–632) was a merchant of <strong>Mecca<\/strong>, a trading city in Arabia with a shrine, the <strong>Kaaba<\/strong>. Around <strong>610<\/strong> he began receiving revelations he believed came from God (<strong>Allah<\/strong>) through the angel Gabriel. Mecca's leaders persecuted his followers, so in <strong>622<\/strong> he moved to <strong>Medina<\/strong>. This journey, the <strong>Hijra<\/strong>, marks <strong>year 1 of the Muslim calendar<\/strong>. By 630 he had returned to take Mecca, and by his death in 632 most of Arabia had accepted Islam (\"submission\" to God).<\/p>\n<p><strong>Beliefs:<\/strong> strict <strong>monotheism<\/strong>; Muhammad as the <strong>last prophet<\/strong> in a line including Abraham, Moses, and Jesus; the <strong>Quran<\/strong> as God's exact words. Jews and Christians were \"<strong>People of the Book<\/strong>.\"<\/p>\n<p><strong>Five Pillars of Islam:<\/strong><\/p>\n<p>1. <strong>Shahada:<\/strong> declaring faith (\"There is no god but God, and Muhammad is his messenger\"). 2. <strong>Salat:<\/strong> prayer five times a day, facing Mecca. 3. <strong>Zakat:<\/strong> giving alms to the poor. 4. <strong>Sawm:<\/strong> fasting during the month of <strong>Ramadan<\/strong>. 5. <strong>Hajj:<\/strong> pilgrimage to Mecca once in a lifetime if able.<\/p>\n<h4>Expansion and the caliphates<\/h4>\n<p>After Muhammad, leaders called <strong>caliphs<\/strong> (\"successors\") ruled. Arab armies swept out of Arabia and took <strong>Syria, Egypt, and Persia<\/strong> within about 20 years.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Byzantine and Persian (Sassanid) empires exhausted by decades of war against each other<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Arab Muslim armies, united by faith, conquer swiftly; they <strong>tax rather than force conversion<\/strong> of Christians and Jews (who pay the <em>jizya<\/em> tax as protected <em>dhimmi<\/em>)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Many conquered peoples accept Muslim rule, and many gradually convert<\/div><\/div>\n<p><strong>Sunni–Shia split:<\/strong> a dispute over <strong>who should succeed Muhammad<\/strong>. <strong>Shia<\/strong> Muslims believe leadership belonged to <strong>Ali<\/strong> (Muhammad's cousin and son-in-law) and his descendants; <strong>Sunni<\/strong> Muslims (the large majority) accepted caliphs chosen by the community. Ali's son <strong>Husayn<\/strong> was killed at <strong>Karbala (680)<\/strong>, hardening the split.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Caliphate<\/th><th>Capital<\/th><th>Key facts<\/th><\/tr><\/thead><tbody><tr><td><strong>Umayyad<\/strong> (661–750)<\/td><td><strong>Damascus<\/strong><\/td><td>Conquered North Africa and <strong>Spain (711)<\/strong>; stopped in France at <strong>Tours (732)<\/strong> and at Constantinople (717–718)<\/td><\/tr><tr><td><strong>Abbasid<\/strong> (750–1258)<\/td><td><strong>Baghdad<\/strong> (founded 762)<\/td><td><strong>Islamic Golden Age<\/strong>; <strong>House of Wisdom<\/strong>; Baghdad sacked by the <strong>Mongols in 1258<\/strong><\/td><\/tr><tr><td>Umayyad Spain (al-Andalus)<\/td><td><strong>Córdoba<\/strong><\/td><td>Survivor of the Umayyad family; brilliant culture where Muslims, Jews, and Christians interacted<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>The Islamic Golden Age<\/h4>\n<p>Scholars in Baghdad's <strong>House of Wisdom<\/strong> translated <strong>Greek<\/strong> works (Aristotle, Galen, Euclid, Ptolemy) into Arabic, preserving and extending them. Many later reached Europe through <strong>Spain and Sicily<\/strong>.<\/p>\n<ul><li><strong>Al-Khwarizmi:<\/strong> <strong>algebra<\/strong> (from Arabic <em>al-jabr<\/em>); our word \"algorithm\" comes from his name.<\/li><li><strong>Number system:<\/strong> Muslims adopted <strong>Indian numerals including zero<\/strong>, which Europeans called \"Arabic numerals.\"<\/li><li><strong>Ibn Sina (Avicenna):<\/strong> the <strong><em>Canon of Medicine<\/strong><\/em>, a standard textbook in European universities for centuries.<\/li><li><strong>Ibn Rushd (Averroes)<\/strong> of Córdoba (12th century): famous commentaries on <strong>Aristotle<\/strong> that influenced Christian scholastics.<\/li><li>Advances in astronomy (astrolabe), optics, chemistry, and huge trade networks.<\/li><\/ul>\n<h3>4. The early medieval West<\/h3>\n<p>In the West, cities shrank, roads decayed, trade slowed, and literacy collapsed outside the Church. The <strong>Church<\/strong> became the main link to Roman civilization.<\/p>\n<p><strong>Monasticism<\/strong> was crucial. <strong>Benedict of Nursia<\/strong> wrote the <strong>Benedictine Rule<\/strong> (c. 529, Monte Cassino): monks took vows of <strong>poverty, chastity, and obedience<\/strong> and followed a balanced routine of prayer, work, and study (\"<strong>pray and work<\/strong>\"). Monasteries <strong>copied manuscripts<\/strong>, ran schools and hospitals, cleared land, and sent missionaries. <strong>Irish monks<\/strong> (Ireland was converted by <strong>St. Patrick<\/strong> in the 400s) kept learning alive and produced illuminated manuscripts like the <strong>Book of Kells<\/strong>. The English monk <strong>Bede<\/strong> wrote a famous <strong><em>Ecclesiastical History of the English People<\/strong><\/em> (731).<\/p>\n<p><strong>Pope Gregory I, \"the Great\"<\/strong> (590–604) strengthened the papacy: he governed the city of Rome, organized Church lands, and sent missionaries to convert the <strong>Anglo-Saxons<\/strong> in England (597).<\/p>\n<h3>5. The Franks and Charlemagne<\/h3>\n<p>The <strong>Franks<\/strong> in Gaul became the most successful Germanic kingdom.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Clovis<\/strong> (ruled 481–511) unites the Franks and converts directly to <strong>Catholic<\/strong> (not Arian) Christianity, c. 496<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>He wins the support of the pope, bishops, and his Gallo-Roman subjects<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>The Franks become the Church's chief protectors in the West<\/div><\/div>\n<p>Clovis' <strong>Merovingian<\/strong> descendants grew weak (\"do-nothing kings\"). Real power passed to the <strong>mayors of the palace<\/strong>:<\/p>\n<ul><li><strong>Charles Martel<\/strong> (\"the Hammer\") defeated a Muslim army at <strong>Tours (Poitiers), 732<\/strong>, halting Muslim expansion into France.<\/li><li>His son <strong>Pepin the Short<\/strong> deposed the last Merovingian with the <strong>pope's approval (751)<\/strong> and was anointed king, founding the <strong>Carolingian<\/strong> dynasty. In return he defeated the Lombards and gave the pope land in central Italy (the <strong>Donation of Pepin, 756<\/strong>), the origin of the <strong>Papal States<\/strong>.<\/li><\/ul>\n<p><strong>Charlemagne<\/strong> (\"Charles the Great,\" ruled 768–814) built the largest Western state since Rome:<\/p>\n<ul><li>Conquered the <strong>Saxons<\/strong> (forcing conversion), the <strong>Lombards<\/strong> in Italy, and Bavaria, and fought Muslims in Spain (the <em>Song of Roland<\/em> romanticizes a defeat there in 778).<\/li><li>Governed through local <strong>counts<\/strong>, checked by royal inspectors, the <strong><em>missi dominici<\/strong><\/em> (\"envoys of the lord\"), traveling in pairs (a noble and a bishop). Capital: <strong>Aachen<\/strong>.<\/li><li>On <strong>Christmas Day, 800<\/strong>, <strong>Pope Leo III<\/strong> crowned him <strong>\"Emperor of the Romans.\"<\/strong> This revived the idea of a Western empire, suggested that <strong>popes made emperors<\/strong> (a claim later popes would use), and offended the Byzantines.<\/li><li><strong>Carolingian Renaissance:<\/strong> a palace school led by the English scholar <strong>Alcuin of York<\/strong>; monks copied classical and Christian texts in a clear new script, <strong>Carolingian minuscule<\/strong> (the ancestor of our lowercase letters). Charlemagne himself struggled to write (we know this from his biographer <strong>Einhard<\/strong>).<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Frankish custom divides land among all sons<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Treaty of Verdun (843)<\/strong> splits the empire among Charlemagne's three grandsons<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>West Francia becomes the core of <strong>France<\/strong>, East Francia of <strong>Germany<\/strong>, and the middle kingdom (Lotharingia, Italy) becomes a battleground<\/div><\/div>\n<h3>6. New invasions (c. 800–1000)<\/h3>\n<p>Europe was attacked from three sides:<\/p>\n<ul><li><strong>Vikings<\/strong> (Norsemen) from Scandinavia, in fast, shallow <strong>longships<\/strong>: raided monasteries (Lindisfarne, <strong>793<\/strong>), settled <strong>Normandy<\/strong> (granted to Rollo in <strong>911<\/strong>), the English \"Danelaw,\" Iceland, and Greenland, briefly reached <strong>North America (Vinland)<\/strong>, and helped found the state of <strong>Kievan Rus'<\/strong>. In England, <strong>Alfred the Great<\/strong> of Wessex (871–899) resisted them.<\/li><li><strong>Magyars<\/strong> (Hungarians) on horseback from the east, defeated at <strong>Lechfeld (955)<\/strong> by the German king <strong>Otto I<\/strong>, who was crowned emperor in <strong>962<\/strong>, the start of the <strong>Holy Roman Empire<\/strong>.<\/li><li><strong>Muslims (Saracens)<\/strong> raiding from North Africa, Sicily, and the Mediterranean.<\/li><\/ul>\n<h3>7. Feudalism and manorialism<\/h3>\n<p>With kings too weak to defend everyone, protection became <strong>local<\/strong>.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Carolingian collapse + Viking, Magyar, and Muslim raids<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Local lords with castles and mounted <strong>knights<\/strong> provide defense in exchange for loyalty and service<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Feudalism<\/strong>: power is decentralized among nobles bound by personal oaths<\/div><\/div>\n<p><strong>Feudalism<\/strong> (political/military system among <strong>nobles<\/strong>):<\/p>\n<ul><li>A <strong>lord<\/strong> grants a <strong>fief<\/strong> (usually land) to a <strong>vassal<\/strong>.<\/li><li>In a ceremony of <strong>homage and fealty<\/strong>, the vassal swears loyalty and owes <strong>military service<\/strong> (often ~40 days a year), <strong>counsel<\/strong> at the lord's court, and <strong>aids<\/strong> (payments, e.g., to ransom the lord or knight his son).<\/li><li>The lord owes the vassal <strong>protection<\/strong> and justice.<\/li><li>Vassals could have their own vassals (<strong>subinfeudation<\/strong>), and a man could be vassal to several lords, which made loyalties messy.<\/li><li>Roots: the Germanic <strong><em>comitatus<\/strong><\/em> (warrior loyalty) + late Roman land-for-service arrangements.<\/li><\/ul>\n<p><strong>Manorialism<\/strong> (economic system):<\/p>\n<ul><li>The <strong>manor<\/strong> was a largely <strong>self-sufficient<\/strong> farming estate: the lord's land (<strong>demesne<\/strong>), peasants' strips in <strong>open fields<\/strong>, a mill, a church, and common woods and pasture.<\/li><li><strong>Serfs<\/strong> were <strong>bound to the land<\/strong>: not slaves (they couldn't be sold apart from the land and had customary rights to their plots), but not free to leave. They owed <strong>labor<\/strong> on the demesne (often 3 days a week), a share of crops, and fees (<strong>banalities<\/strong>) for using the lord's mill, oven, and winepress, plus the <strong>tithe<\/strong> (one-tenth) to the Church.<\/li><li><strong>Technology<\/strong> gradually raised output: the <strong>heavy plow<\/strong> for wet northern soils, the <strong>horse collar<\/strong>, and the <strong>three-field system<\/strong> (one field winter grain, one spring crops like beans and oats, one fallow), which increased yields and improved diets.<\/li><\/ul>\n<div class=\"tblwrap\"><table><thead><tr><th><\/th><th>Feudalism<\/th><th>Manorialism<\/th><\/tr><\/thead><tbody><tr><td>What<\/td><td>Political &amp; military relationships<\/td><td>Economic system<\/td><\/tr><tr><td>Between<\/td><td>Lords and vassals (all nobles)<\/td><td>Lords and serfs (peasants)<\/td><\/tr><tr><td>Exchange<\/td><td>Fief ↔ military service, loyalty<\/td><td>Protection and land use ↔ labor, crops, fees<\/td><\/tr><tr><td>Bond<\/td><td>Personal oath (homage &amp; fealty)<\/td><td>Hereditary obligation to the land<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Big picture for the exam<\/h3>\n<p>Compare <strong>Byzantium, Islam, and the Latin West<\/strong>; know <strong>Justinian's Code<\/strong>, <strong>caesaropapism<\/strong>, <strong>iconoclasm<\/strong>, <strong>1054<\/strong>; <strong>Muhammad<\/strong> to the <strong>Hijra (622)<\/strong>, the <strong>Five Pillars<\/strong>, <strong>Sunni vs. Shia<\/strong>, <strong>Umayyad vs. Abbasid<\/strong>, the <strong>House of Wisdom<\/strong>; <strong>Benedict<\/strong>, <strong>Gregory the Great<\/strong>; <strong>Clovis → Charles Martel → Pepin → Charlemagne (800) → Verdun (843)<\/strong>; and the difference between <strong>feudalism<\/strong> and <strong>manorialism<\/strong>.<\/p>","words":1815,"mustKnow":["<strong>Justinian<\/strong> (527–565): <strong>Corpus Juris Civilis<\/strong> (Roman law preserved), <strong>Hagia Sophia<\/strong>, reconquest of Italy/North Africa by Belisarius; wife <strong>Theodora<\/strong> (Nika Riots).","Byzantium = <strong>caesaropapism<\/strong> (emperor over church), Greek language, <strong>Greek fire<\/strong>, <strong>iconoclasm<\/strong> (726–843), <strong>Cyril and Methodius<\/strong> to the Slavs, <strong>Great Schism of 1054<\/strong> (Orthodox vs. Catholic).","<strong>Muhammad:<\/strong> revelations c. 610; <strong>Hijra to Medina in 622<\/strong> = year 1; <strong>Quran<\/strong>; <strong>Five Pillars<\/strong> (shahada, salat, zakat, sawm, hajj).","<strong>Sunni vs. Shia<\/strong> = dispute over succession (Shia back <strong>Ali<\/strong> and his descendants).","<strong>Umayyads<\/strong> (Damascus; conquered Spain 711; stopped at <strong>Tours 732<\/strong>) → <strong>Abbasids<\/strong> (Baghdad; <strong>House of Wisdom<\/strong>; Golden Age; Mongols 1258).","Islamic scholars <strong>preserved and translated Greek learning<\/strong>; <strong>al-Khwarizmi<\/strong> (algebra), <strong>Avicenna<\/strong> (medicine), <strong>Averroes<\/strong> (Aristotle); Indian numerals with zero.","<strong>Benedictine Rule<\/strong> (c. 529): poverty, chastity, obedience; \"pray and work\"; monks copied manuscripts. <strong>Gregory the Great<\/strong> strengthened the papacy, sent missionaries to England.","<strong>Clovis<\/strong> converted to Catholic Christianity → <strong>Charles Martel<\/strong> won at Tours (732) → <strong>Pepin<\/strong> became king with papal blessing and gave land to the pope (<strong>Papal States<\/strong>).","<strong>Charlemagne<\/strong> crowned emperor by <strong>Pope Leo III, 800<\/strong>; <strong>missi dominici<\/strong>; <strong>Carolingian Renaissance<\/strong> (Alcuin, minuscule). <strong>Treaty of Verdun (843)<\/strong> split the empire.","<strong>Feudalism<\/strong> = lord–vassal, fief for military service (homage &amp; fealty); <strong>manorialism<\/strong> = lord–serf economy; serfs bound to land; <strong>three-field system<\/strong> and heavy plow raised output."],"timeline":[{"y":496.0,"label":"c. 496","text":"<strong>Clovis<\/strong> converts to Catholic Christianity","key":true},{"y":527.0,"label":"527–565","text":"Reign of <strong>Justinian<\/strong>; Corpus Juris Civilis; Hagia Sophia (537)","key":true},{"y":529.0,"label":"c. 529","text":"<strong>Benedictine Rule<\/strong> written (Monte Cassino)","key":true},{"y":568.0,"label":"568","text":"Lombards invade Italy","key":false},{"y":590.0,"label":"590–604","text":"Pope Gregory the Great","key":false},{"y":622.0,"label":"622","text":"<strong>Hijra<\/strong>: Muhammad moves to Medina (year 1 of Muslim calendar)","key":true},{"y":632.0,"label":"632","text":"Muhammad dies; Arab conquests begin","key":false},{"y":661.0,"label":"661–750","text":"Umayyad Caliphate (Damascus)","key":false},{"y":680.0,"label":"680","text":"Karbala: deepens Sunni–Shia split","key":false},{"y":711.0,"label":"711","text":"Muslims invade Spain","key":false},{"y":726.0,"label":"726–843","text":"Byzantine Iconoclasm controversy","key":false},{"y":732.0,"label":"732","text":"<strong>Battle of Tours<\/strong>: Charles Martel stops Muslim advance","key":true},{"y":750.0,"label":"750","text":"<strong>Abbasids<\/strong> take power; Baghdad founded 762","key":true},{"y":751.0,"label":"751","text":"Pepin the Short becomes king with papal approval","key":false},{"y":793.0,"label":"793","text":"Vikings raid Lindisfarne","key":false},{"y":800.0,"label":"800","text":"<strong>Charlemagne crowned emperor<\/strong> by Pope Leo III","key":true},{"y":843.0,"label":"843","text":"<strong>Treaty of Verdun<\/strong> divides Carolingian Empire","key":true},{"y":911.0,"label":"911","text":"Vikings granted Normandy","key":false},{"y":955.0,"label":"955","text":"Otto I defeats the Magyars at Lechfeld","key":false},{"y":962.0,"label":"962","text":"Otto I crowned emperor (Holy Roman Empire)","key":true},{"y":988.0,"label":"988","text":"Vladimir of Kiev converts to Orthodox Christianity","key":false},{"y":1054.0,"label":"1054","text":"<strong>Great Schism<\/strong>: Catholic and Orthodox churches split","key":true}],"people":[{"name":"Justinian & Theodora","desc":"Byzantine rulers; law code, Hagia Sophia, reconquest"},{"name":"Belisarius","desc":"Justinian's general; retook North Africa and Italy"},{"name":"Muhammad","desc":"Prophet of Islam; Hijra 622"},{"name":"Ali","desc":"Muhammad's cousin/son-in-law; Shia see him as rightful successor"},{"name":"Al-Khwarizmi","desc":"Baghdad mathematician; algebra"},{"name":"Ibn Sina (Avicenna)","desc":"<em>Canon of Medicine<\/em>"},{"name":"Benedict of Nursia","desc":"Rule for monks (c. 529)"},{"name":"Gregory the Great","desc":"Pope 590–604; strengthened papacy; missions to England"},{"name":"Clovis","desc":"Frankish king; converted to Catholic Christianity"},{"name":"Charles Martel","desc":"Won at Tours (732)"},{"name":"Charlemagne","desc":"Emperor (800); missi dominici; Carolingian Renaissance"},{"name":"Alcuin of York","desc":"Led Charlemagne's palace school"},{"name":"Cyril & Methodius","desc":"Missionaries to the Slavs; Slavic alphabet"}],"cards":[{"id":"ema-c1","f":"Justinian's Code (Corpus Juris Civilis)","b":"Byzantine compilation of Roman law under Justinian (530s); basis of continental European law."},{"id":"ema-c2","f":"Hagia Sophia","b":"Justinian's great domed church in Constantinople (537)."},{"id":"ema-c3","f":"Theodora","b":"Justinian's wife and adviser; persuaded him to stand firm during the Nika Riots (532)."},{"id":"ema-c4","f":"Caesaropapism","b":"Byzantine system in which the emperor controlled both the state and the Church."},{"id":"ema-c5","f":"Greek fire","b":"Byzantine incendiary weapon used to destroy enemy fleets."},{"id":"ema-c6","f":"Iconoclasm","b":"Byzantine movement (726–843) to ban and destroy religious images."},{"id":"ema-c7","f":"Great Schism (1054)","b":"Mutual excommunications that split Christianity into Roman Catholic and Eastern Orthodox churches."},{"id":"ema-c8","f":"Cyril and Methodius","b":"Byzantine missionaries to the Slavs who created a Slavic alphabet (ancestor of Cyrillic)."},{"id":"ema-c9","f":"Hijra","b":"Muhammad's move from Mecca to Medina in 622; year 1 of the Islamic calendar."},{"id":"ema-c10","f":"Quran","b":"Islam's holy book, believed to be God's revelations to Muhammad."},{"id":"ema-c11","f":"Five Pillars","b":"Faith (shahada), prayer (salat), alms (zakat), fasting in Ramadan (sawm), pilgrimage to Mecca (hajj)."},{"id":"ema-c12","f":"Caliph","b":"\"Successor\" to Muhammad as political and religious leader of the Muslim community."},{"id":"ema-c13","f":"Sunni vs. Shia","b":"Split over succession: Shia support Ali and his descendants; Sunni accept caliphs chosen by the community."},{"id":"ema-c14","f":"Umayyad Caliphate","b":"661–750, capital Damascus; conquered North Africa and Spain."},{"id":"ema-c15","f":"Abbasid Caliphate","b":"750–1258, capital Baghdad; Islamic Golden Age; ended by the Mongols."},{"id":"ema-c16","f":"House of Wisdom","b":"Abbasid center in Baghdad where Greek works were translated into Arabic."},{"id":"ema-c17","f":"Benedictine Rule","b":"Benedict's guidelines for monks (c. 529): poverty, chastity, obedience; prayer and work."},{"id":"ema-c18","f":"Clovis","b":"Frankish king who converted to Catholic Christianity (c. 496), allying the Franks with the Church."},{"id":"ema-c19","f":"Battle of Tours (732)","b":"Charles Martel's victory halting Muslim advance into Frankish Gaul."},{"id":"ema-c20","f":"Charlemagne","b":"Carolingian king crowned \"Emperor of the Romans\" by Pope Leo III in 800."},{"id":"ema-c21","f":"Missi dominici","b":"Charlemagne's traveling royal inspectors who checked on local counts."},{"id":"ema-c22","f":"Treaty of Verdun (843)","b":"Split Charlemagne's empire among three grandsons; roughly the future France and Germany."},{"id":"ema-c23","f":"Feudalism","b":"Political-military system: lords grant fiefs to vassals in exchange for military service and loyalty."},{"id":"ema-c24","f":"Manorialism / serfs","b":"Economic system of self-sufficient estates worked by serfs bound to the land, owing labor and fees."}],"compare":"<div class=\"tblwrap\"><table><thead><tr><th>c. 800 CE<\/th><th>Byzantine Empire<\/th><th>Islamic Caliphate<\/th><th>Latin West<\/th><\/tr><\/thead><tbody><tr><td>Capital<\/td><td>Constantinople<\/td><td>Baghdad (Abbasid)<\/td><td>Rome (pope); Aachen (Charlemagne)<\/td><\/tr><tr><td>Language<\/td><td>Greek<\/td><td>Arabic<\/td><td>Latin (Church), Germanic vernaculars<\/td><\/tr><tr><td>Religious head<\/td><td>Patriarch, under the emperor<\/td><td>Caliph (political-religious)<\/td><td>Pope, separate from kings<\/td><\/tr><tr><td>Economy<\/td><td>Urban, trade, gold coinage<\/td><td>Urban, vast trade networks<\/td><td>Rural, manorial, little coinage<\/td><\/tr><tr><td>Legacy<\/td><td>Roman law; Greek classics; Orthodoxy<\/td><td>Preserved and extended Greek science; algebra<\/td><td>Feudalism; Church institutions<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"hma","title":"High & Late Middle Ages","topic":"medieval","share":13.4,"quizN":12,"examN":16,"diagN":4,"cardTarget":24,"lessonMin":12,"studyHours":2.0,"intro":"From about 1000 to 1450, Europe revived: a reformed and powerful papacy, the Crusades, booming towns, stronger monarchies, universities, and Gothic cathedrals. Then the 14th century brought famine, plague, war, and a divided Church. Second half of Medieval History (23–27%).","lesson":"<h3>1. The medieval revival (c. 1000–1300)<\/h3>\n<p>After the Viking and Magyar raids ended, Europe grew. Warmer weather, the <strong>heavy plow<\/strong>, the <strong>horse collar<\/strong>, and the <strong>three-field system<\/strong> produced more food, so <strong>population roughly doubled<\/strong> between 1000 and 1300. More people meant more land cleared, more trade, and the growth of towns.<\/p>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Agricultural improvements and the end of invasions<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Population growth, surplus to sell, revived long-distance trade<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Towns<\/strong> and a <strong>money economy<\/strong> grow, and with them a new middle class that doesn't fit the feudal order<\/div><\/div>\n<h3>2. Towns, trade, and guilds<\/h3>\n<ul><li><strong>Trade routes:<\/strong> Italian cities (<strong>Venice<\/strong>, <strong>Genoa<\/strong>, Pisa) dominated Mediterranean trade with Byzantium and the Islamic world (spices, silk). In the north, the <strong>Hanseatic League<\/strong> (Lübeck, Hamburg, and other German towns) controlled Baltic and North Sea trade (timber, fish, furs, grain). The two zones met at the great <strong>fairs of Champagne<\/strong> in France.<\/li><li><strong>Towns<\/strong> bought or won <strong>charters<\/strong> from lords and kings granting self-government and freedom from feudal duties. A serf who lived in a town for a year and a day became free: \"<strong>town air makes you free<\/strong>.\" Townspeople were called <strong>burghers<\/strong> or the <strong>bourgeoisie<\/strong>.<\/li><li><strong>Guilds<\/strong> organized economic life. <strong>Merchant guilds<\/strong> controlled a town's trade; <strong>craft guilds<\/strong> (bakers, weavers, smiths) set prices, wages, and quality standards and limited competition. Training went <strong>apprentice → journeyman → master<\/strong> (who had to produce a \"masterpiece\").<\/li><li><strong>Money and banking<\/strong> returned: bills of exchange and credit, pioneered by Italian merchants. The Church's ban on <strong>usury<\/strong> (charging interest) pushed many Jews, excluded from guilds and landholding, into moneylending, which fed resentment and persecution.<\/li><\/ul>\n<h3>3. The reformed Church at its height<\/h3>\n<p>Around 1000, the Church had problems: nobles controlled church offices, some priests married, and offices were bought and sold (<strong>simony<\/strong>).<\/p>\n<ul><li><strong>Cluny<\/strong> (founded <strong>910<\/strong> in France): a Benedictine monastery placed directly under the pope, free from local lords. Its reform movement spread to hundreds of houses.<\/li><li><strong>Pope Gregory VII<\/strong> (1073–1085) banned simony and clerical marriage and insisted that <strong>only the Church could appoint bishops<\/strong>.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Who appoints bishops, the king or the pope? (bishops were also great landholders and royal officials)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Investiture Controversy<\/strong>: Gregory VII excommunicates Emperor <strong>Henry IV<\/strong>, who stands barefoot in the snow at <strong>Canossa (1077)<\/strong> to beg forgiveness<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Concordat of Worms (1122)<\/strong>: the Church grants spiritual authority (ring and staff); the emperor may grant the lands. The papacy gains prestige, and German emperors lose ground<\/div><\/div>\n<p><strong>Pope Innocent III<\/strong> (1198–1216) marks the <strong>peak of papal power<\/strong>. He forced King <strong>John<\/strong> of England to submit by placing England under <strong>interdict<\/strong> (no church services or sacraments), launched the <strong>Fourth Crusade<\/strong> and a crusade against heretics in southern France, and held the <strong>Fourth Lateran Council (1215)<\/strong>, which defined <strong>transubstantiation<\/strong> (the bread and wine become the body and blood of Christ) and required annual confession.<\/p>\n<p><strong>Sacraments:<\/strong> the seven sacraments (baptism, confirmation, Eucharist, penance, marriage, holy orders, last rites) were channels of grace that only the clergy could administer. <strong>Excommunication<\/strong> (cutting a person off from them) and <strong>interdict<\/strong> (shutting down church services in an entire region) were the Church's great weapons.<\/p>\n<p><strong>New religious orders:<\/strong><\/p>\n<ul><li><strong>Cistercians<\/strong> (strict, rural monks; <strong>Bernard of Clairvaux<\/strong> preached the Second Crusade).<\/li><li><strong>Mendicant (\"begging\") friars<\/strong> worked <strong>in towns<\/strong> among the people instead of in cloisters: <strong>Franciscans<\/strong> (<strong>Francis of Assisi<\/strong>, radical poverty and service to the poor) and <strong>Dominicans<\/strong> (<strong>Dominic<\/strong>, educated preachers who fought heresy and later ran the <strong>Inquisition<\/strong>).<\/li><\/ul>\n<p><strong>Heresy:<\/strong> the <strong>Cathars (Albigensians)<\/strong> of southern France believed in two gods (good/spiritual vs. evil/material) and rejected the Church. Innocent III's <strong>Albigensian Crusade<\/strong> (1209) crushed them. The <strong>Waldensians<\/strong> preached apostolic poverty.<\/p>\n<h3>4. The Crusades (1095–1291)<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Seljuk Turks<\/strong> defeat the Byzantines at <strong>Manzikert (1071)<\/strong> and threaten Constantinople; Byzantine Emperor Alexius asks the West for help<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Pope Urban II<\/strong> at the <strong>Council of Clermont (1095)<\/strong> calls a holy war to free Jerusalem, promising forgiveness of sins<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Thousands of knights and commoners march east<\/div><\/div>\n<p>Motives mixed <strong>religious zeal<\/strong> (pilgrimage, remission of sins), <strong>papal ambition<\/strong> (leading Christendom, reuniting with the East), <strong>land and wealth<\/strong> for younger sons (who inherited nothing under <strong>primogeniture<\/strong>), and <strong>trade<\/strong> for Italian cities.<\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Crusade<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><strong>First (1096–1099)<\/strong><\/td><td>The only clear success: <strong>Jerusalem captured (1099)<\/strong> with a massacre; four <strong>crusader states<\/strong> founded. Also massacres of Jews in the Rhineland on the way<\/td><\/tr><tr><td><strong>Second (1147–1149)<\/strong><\/td><td>Preached by Bernard of Clairvaux after Edessa fell; failed<\/td><\/tr><tr><td><strong>Third (1189–1192)<\/strong><\/td><td>After <strong>Saladin<\/strong> retook <strong>Jerusalem (1187)<\/strong>; the \"Crusade of Kings\": <strong>Richard I<\/strong> \"the Lionheart\" of England, <strong>Philip II<\/strong> of France, and <strong>Frederick Barbarossa<\/strong> (drowned on the way). Ended with a <strong>truce<\/strong> allowing Christian pilgrims access to Jerusalem<\/td><\/tr><tr><td><strong>Fourth (1202–1204)<\/strong><\/td><td>Diverted by Venice; crusaders <strong>sacked Constantinople (1204)<\/strong>, a fellow Christian city, deepening the East-West split and weakening Byzantium<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The last crusader stronghold, <strong>Acre<\/strong>, fell in <strong>1291<\/strong>. In Spain, the <strong>Reconquista<\/strong> (Christian reconquest of Muslim Iberia) continued until <strong>1492<\/strong>.<\/p>\n<p><strong>Consequences:<\/strong> more <strong>trade<\/strong> with the East (enriching <strong>Venice and Genoa<\/strong>), <strong>contact with Islamic learning<\/strong>, a <strong>weaker Byzantium<\/strong>, <strong>anti-Jewish violence<\/strong> in Europe, more power to monarchs (who taxed for crusades), and lasting Christian-Muslim bitterness.<\/p>\n<h3>5. Feudal monarchies: England, France, the Holy Roman Empire<\/h3>\n<h4>England: strong kings, limited by law<\/h4>\n<ul><li><strong>1066:<\/strong> <strong>William the Conqueror<\/strong>, Duke of Normandy, wins the <strong>Battle of Hastings<\/strong>, takes England, and makes all landholders his vassals. The <strong>Domesday Book (1086)<\/strong> surveyed every estate for taxation.<\/li><li><strong>Henry II<\/strong> (1154–1189) expanded royal justice: traveling <strong>circuit judges<\/strong>, <strong>juries<\/strong>, and <strong>common law<\/strong> (law common to the whole kingdom, based on precedent). His clash with Archbishop <strong>Thomas Becket<\/strong> ended with Becket's murder in Canterbury Cathedral (1170).<\/li><li><strong>King John<\/strong> lost Normandy to France (1204), quarreled with Innocent III, and raised heavy taxes. His barons forced him to sign the <strong>Magna Carta (1215)<\/strong>: the king is <strong>subject to the law<\/strong>; no special taxes without the consent of the great council; no free man imprisoned or punished except by <strong>lawful judgment of his peers<\/strong> or the law of the land.<\/li><li><strong>Parliament<\/strong> grew from the king's council. <strong>Edward I<\/strong>'s <strong>Model Parliament (1295)<\/strong> included nobles, clergy, and representatives of towns and shires. Parliament later split into the <strong>House of Lords<\/strong> and <strong>House of Commons<\/strong> and gained <strong>\"power of the purse\"<\/strong> (approval of taxes).<\/li><\/ul>\n<h4>France: kings slowly gather power<\/h4>\n<ul><li><strong>Hugh Capet<\/strong> (987) founded the <strong>Capetian<\/strong> dynasty, ruling only a small area around <strong>Paris<\/strong> but producing male heirs for centuries.<\/li><li><strong>Philip II Augustus<\/strong> (1180–1223) took <strong>Normandy<\/strong> from King John and governed through salaried royal officials (<strong>bailiffs<\/strong>).<\/li><li><strong>Louis IX (Saint Louis)<\/strong> (1226–1270) was famed for justice and piety and led two crusades.<\/li><li><strong>Philip IV \"the Fair\"<\/strong> (1285–1314) called the first <strong>Estates-General (1302)<\/strong> (clergy, nobles, townspeople) to back him against the pope, taxed the clergy, and expelled the Jews and destroyed the Knights Templar to seize their wealth.<\/li><\/ul>\n<h4>Holy Roman Empire: the failure to unify<\/h4>\n<p>German emperors (from <strong>Otto I<\/strong>, crowned 962) spent their energy fighting popes and trying to control <strong>Italy<\/strong>. <strong>Frederick I Barbarossa<\/strong> was defeated by the <strong>Lombard League<\/strong> of northern Italian cities at <strong>Legnano (1176)<\/strong>. The result: Germany and Italy stayed <strong>fragmented<\/strong> into hundreds of princely states and city-states. The <strong>Golden Bull (1356)<\/strong> made the emperor <strong>elected by seven princes (electors)<\/strong>, confirming weak central power.<\/p>\n<h3>6. Medieval thought and culture<\/h3>\n<p><strong>Universities<\/strong> grew out of cathedral schools as guilds of teachers and students: <strong>Bologna<\/strong> (law), <strong>Paris<\/strong> (theology), <strong>Oxford<\/strong>, and Cambridge. Teaching was in Latin, based on lecture and debate. The core curriculum was the seven liberal arts.<\/p>\n<p><strong>Scholasticism<\/strong> was the method of using <strong>reason and logic (especially Aristotle's) to explain and defend Christian faith<\/strong>. Aristotle's works returned to the West via Arabic translations from Spain and Sicily.<\/p>\n<ul><li><strong>Anselm of Canterbury:<\/strong> \"faith seeking understanding\"; a logical proof of God's existence.<\/li><li><strong>Peter Abelard:<\/strong> <strong><em>Sic et Non<\/strong><\/em> (\"Yes and No\"), which set contradictory authorities side by side to train reasoning.<\/li><li><strong>Thomas Aquinas<\/strong> (1225–1274), a Dominican: <strong><em>Summa Theologica<\/strong><\/em>. He argued that <strong>faith and reason do not conflict<\/strong>, because both come from God, and harmonized <strong>Aristotle<\/strong> with Christian doctrine (natural law, the \"five ways\" of proving God).<\/li><li><strong>William of Ockham:<\/strong> \"Ockham's razor\" (prefer the simplest explanation); argued faith and reason were separate, undermining scholastic synthesis.<\/li><li><strong>Roger Bacon<\/strong> stressed observation and experiment.<\/li><\/ul>\n<p><strong>Architecture:<\/strong><\/p>\n<div class=\"tblwrap\"><table><thead><tr><th>Romanesque (c. 1000–1150)<\/th><th>Gothic (from c. 1140)<\/th><\/tr><\/thead><tbody><tr><td><strong>Rounded arches<\/strong>, barrel vaults<\/td><td><strong>Pointed arches<\/strong>, <strong>ribbed vaults<\/strong><\/td><\/tr><tr><td><strong>Thick walls<\/strong>, small windows, dark interiors<\/td><td><strong>Flying buttresses<\/strong> carry the weight, allowing tall, thin walls<\/td><\/tr><tr><td>Heavy, fortress-like<\/td><td>Soaring height; huge <strong>stained-glass<\/strong> windows to fill the church with light<\/td><\/tr><tr><td><\/td><td>First: <strong>Abbey of Saint-Denis<\/strong> (Abbot <strong>Suger<\/strong>, 1140s); Chartres, Notre-Dame de Paris<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Literature<\/strong> shifted from Latin toward <strong>vernacular<\/strong> (everyday) languages: troubadour songs of <strong>courtly love<\/strong> and the code of <strong>chivalry<\/strong>; epic <em>chansons de geste<\/em> such as the <em>Song of Roland<\/em>; <strong>Dante<\/strong>'s <strong><em>Divine Comedy<\/strong><\/em> (Italian, early 1300s: a journey through Hell, Purgatory, and Paradise); <strong>Chaucer<\/strong>'s <strong><em>Canterbury Tales<\/strong><\/em> (English, late 1300s: pilgrims of every class telling stories); and <strong>Christine de Pizan<\/strong>'s defense of women, <em>The Book of the City of Ladies<\/em> (1405).<\/p>\n<h3>7. The calamitous 14th century<\/h3>\n<ul><li><strong>Great Famine (1315–1317):<\/strong> cold, rainy weather destroyed harvests; millions starved.<\/li><li><strong>Black Death (1347–1351):<\/strong> <strong>bubonic plague<\/strong>, carried by fleas on rats and spread along trade routes (arriving via Genoese ships from the Black Sea port of <strong>Caffa<\/strong>), killed about <strong>one-third<\/strong> of Europe's population. Reactions included <strong>flagellants<\/strong> whipping themselves in penance and <strong>massacres of Jews<\/strong>, who were falsely blamed for poisoning wells.<\/li><\/ul>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span>Black Death kills a third of the workforce<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span><strong>Labor shortage<\/strong>: surviving peasants and workers demand <strong>higher wages<\/strong> and freedom; lords try to freeze wages (England's Statute of Labourers, 1351)<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span><strong>Peasant revolts<\/strong> (French <strong>Jacquerie<\/strong> 1358; <strong>English Peasants' Revolt 1381<\/strong>, led by Wat Tyler, sparked by a poll tax), and <strong>serfdom declines in Western Europe<\/strong><\/div><\/div>\n<ul><li><strong>Hundred Years' War (1337–1453):<\/strong> England's <strong>Edward III<\/strong> claimed the French throne. The English won early with the <strong>longbow<\/strong> at <strong>Crécy (1346)<\/strong>, <strong>Poitiers (1356)<\/strong>, and <strong>Agincourt (1415, Henry V)<\/strong>. Then <strong>Joan of Arc<\/strong>, a peasant girl inspired by visions, lifted the <strong>siege of Orléans (1429)<\/strong> and had Charles VII crowned; she was captured and <strong>burned as a heretic (1431)<\/strong>. France expelled the English (except Calais) by 1453.<\/li><li><strong>Consequences:<\/strong> a sense of <strong>national identity<\/strong> in both countries; the <strong>decline of knights and chivalry<\/strong> (longbows, then <strong>gunpowder and cannon<\/strong>, made armored cavalry obsolete); a <strong>stronger French monarchy<\/strong> (permanent taxes, a standing army); and in England, civil war: the <strong>Wars of the Roses (1455–1485)<\/strong>.<\/li><\/ul>\n<h3>8. The late medieval Church in crisis<\/h3>\n<div class=\"chain\"><div class=\"chain-step\"><span class=\"chain-lbl\">Cause<\/span><strong>Pope Boniface VIII<\/strong> clashes with <strong>Philip IV<\/strong> of France over taxing clergy; his bull <strong><em>Unam Sanctam<\/em> (1302)<\/strong> claims every human must submit to the pope<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Event<\/span>Philip's agents seize Boniface, who dies soon after; a French pope moves the papacy to <strong>Avignon<\/strong> (1309–1377): the \"<strong>Babylonian Captivity<\/strong>\" of the Church<\/div><div class=\"chain-step\"><span class=\"chain-lbl\">Consequence<\/span>Papal prestige falls; many see the popes as French puppets<\/div><\/div>\n<ul><li><strong>Great Western Schism (1378–1417):<\/strong> after the return to Rome, rival popes were elected in <strong>Rome and Avignon<\/strong> (later a third at Pisa), each excommunicating the other's followers.<\/li><li>The <strong>Council of Constance (1414–1418)<\/strong> ended the schism by electing one pope. The <strong>Conciliar Movement<\/strong> argued that <strong>church councils had authority over popes<\/strong>, but popes soon reasserted control.<\/li><li>Critics foreshadowed the Reformation: <strong>John Wycliffe<\/strong> (England, d. 1384) said the <strong>Bible<\/strong>, not the pope, was the supreme authority and inspired the first <strong>English translation of the Bible<\/strong>; his followers were the <strong>Lollards<\/strong>. <strong>Jan Hus<\/strong> (Bohemia), influenced by Wycliffe, was <strong>burned at Constance (1415)<\/strong> despite a promise of safe conduct; his followers, the <strong>Hussites<\/strong>, fought off crusades.<\/li><\/ul>\n<p>Meanwhile, in the east, the <strong>Ottoman Turks<\/strong> captured <strong>Constantinople in 1453<\/strong>, ending the Byzantine Empire.<\/p>\n<h3>Big picture for the exam<\/h3>\n<p>Know the <strong>Investiture Controversy<\/strong> (Gregory VII, Henry IV, Canossa, Worms), <strong>Innocent III<\/strong>, the <strong>friars<\/strong>, the <strong>Crusades' causes and results<\/strong>, <strong>towns and guilds<\/strong>, <strong>England's limits on kings<\/strong> (Magna Carta → Parliament) vs. <strong>France's centralizing kings<\/strong> vs. <strong>Germany's fragmentation<\/strong>, <strong>scholasticism and Aquinas<\/strong>, <strong>Romanesque vs. Gothic<\/strong>, the <strong>Black Death's effects<\/strong>, the <strong>Hundred Years' War<\/strong>, and the <strong>papacy's decline<\/strong> (Avignon, Schism, Constance, Wycliffe, Hus).<\/p>","words":1982,"mustKnow":["Agricultural improvements → population growth → <strong>towns, guilds, charters<\/strong>, money economy; <strong>Hanseatic League<\/strong> (north) and <strong>Venice/Genoa<\/strong> (Mediterranean).","<strong>Cluny (910)<\/strong> reform → <strong>Gregory VII<\/strong> vs. <strong>Henry IV<\/strong>: <strong>Investiture Controversy<\/strong>, <strong>Canossa (1077)<\/strong>, <strong>Concordat of Worms (1122)<\/strong>.","<strong>Innocent III<\/strong> = peak of papal power (interdict on England, <strong>Fourth Lateran Council 1215<\/strong>: transubstantiation).","<strong>Mendicant friars:<\/strong> Franciscans (poverty) and Dominicans (preaching against heresy); Albigensian Crusade against the <strong>Cathars<\/strong>.","<strong>Crusades:<\/strong> Urban II at <strong>Clermont (1095)<\/strong>; First Crusade took <strong>Jerusalem (1099)<\/strong>; <strong>Saladin<\/strong> retook it (1187); <strong>Fourth Crusade sacked Constantinople (1204)<\/strong>; results: more trade, weaker Byzantium, anti-Jewish violence.","England: <strong>Hastings (1066)<\/strong>, Domesday Book; <strong>Henry II<\/strong> common law and juries; <strong>Magna Carta (1215)<\/strong> puts the king under law; <strong>Model Parliament (1295)<\/strong>.","France: Capetians centralize (<strong>Philip II<\/strong>, <strong>Philip IV<\/strong> and the first <strong>Estates-General 1302<\/strong>); HRE stays <strong>fragmented<\/strong> (Golden Bull 1356, seven electors).","<strong>Scholasticism:<\/strong> reason + faith; <strong>Aquinas' Summa Theologica<\/strong> synthesizes Aristotle and Christianity; universities at Bologna, Paris, Oxford.","<strong>Romanesque<\/strong> (round arches, thick walls) vs. <strong>Gothic<\/strong> (pointed arches, flying buttresses, stained glass). Vernacular works: <strong>Dante<\/strong>, <strong>Chaucer<\/strong>.","14th-century crises: <strong>Black Death (1347–51)<\/strong>, killing about 1/3 → labor shortage, higher wages, <strong>peasant revolts<\/strong> (1381), decline of serfdom; <strong>Hundred Years' War (1337–1453)<\/strong> (longbow, <strong>Joan of Arc<\/strong>); <strong>Avignon papacy<\/strong>, <strong>Great Schism (1378–1417)<\/strong>, <strong>Council of Constance<\/strong>; <strong>Wycliffe<\/strong> and <strong>Hus<\/strong> as Reformation forerunners."],"timeline":[{"y":910.0,"label":"910","text":"<strong>Cluny<\/strong> founded: monastic reform begins","key":true},{"y":1066.0,"label":"1066","text":"<strong>Battle of Hastings<\/strong>: Norman conquest of England","key":true},{"y":1071.0,"label":"1071","text":"Seljuk Turks defeat Byzantium at Manzikert","key":false},{"y":1077.0,"label":"1077","text":"Henry IV submits to Gregory VII at <strong>Canossa<\/strong>","key":true},{"y":1086.0,"label":"1086","text":"Domesday Book","key":false},{"y":1095.0,"label":"1095","text":"<strong>Urban II<\/strong> calls the First Crusade at Clermont","key":true},{"y":1099.0,"label":"1099","text":"Crusaders capture <strong>Jerusalem<\/strong>","key":true},{"y":1122.0,"label":"1122","text":"<strong>Concordat of Worms<\/strong> ends Investiture Controversy","key":true},{"y":1140.0,"label":"c. 1140s","text":"Abbot Suger's Saint-Denis: first Gothic church","key":false},{"y":1170.0,"label":"1170","text"
