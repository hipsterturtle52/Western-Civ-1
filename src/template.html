<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP Western Civ I Study Guide</title>
<meta name="description" content="Self-paced, offline study guide for the CLEP Western Civilization I exam (Ancient Near East to 1648).">
<style>
:root{
  --bg:#f8f6f1; --surface:#ffffff; --surface2:#f1eee6; --text:#1f1d1a; --muted:#6a645a; --line:#e2ddd2;
  --accent:#2f4b8a; --accent-soft:#e6ecf8; --accent-text:#ffffff;
  --ok:#23704a; --ok-soft:#e3f3ea; --bad:#a83434; --bad-soft:#f8e6e4; --warn:#94650b; --warn-soft:#fbf0d9;
  --mk:#fff8e3; --mk-line:#e7c766;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, Cambria, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --surface2:#252932; --text:#e7e4dd; --muted:#a29c90; --line:#323743;
  --accent:#8fa9e8; --accent-soft:#263252; --accent-text:#10131a;
  --ok:#6ccf98; --ok-soft:#173326; --bad:#f08a8a; --bad-soft:#3b1f22; --warn:#e5b95a; --warn-soft:#3a2f17;
  --mk:#2b2716; --mk-line:#8a7430;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1d2027; --surface2:#252932; --text:#e7e4dd; --muted:#a29c90; --line:#323743;
    --accent:#8fa9e8; --accent-soft:#263252; --accent-text:#10131a;
    --ok:#6ccf98; --ok-soft:#173326; --bad:#f08a8a; --bad-soft:#3b1f22; --warn:#e5b95a; --warn-soft:#3a2f17;
    --mk:#2b2716; --mk-line:#8a7430; --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 24px}
.brand{font-weight:700;font-size:15px;line-height:1.25;padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.nav .dot.done{background:var(--ok)}
.nav .dot.part{background:var(--warn)}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0}
.top{display:none}
.wrap{max-width:780px;margin:0 auto;padding:28px 20px 80px}
.wrap.wide{max-width:1060px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
h2{font-size:21px;margin:30px 0 10px}
h3{font-size:18px;margin:24px 0 8px}
h4{font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin:14px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
.stat{font-size:26px;font-weight:700;line-height:1.1}
.stat small{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-top:3px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin:12px 0}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;font-size:14px;border-bottom:1px solid var(--line)}
/* lesson */
.lesson{font-family:var(--serif);font-size:18px;line-height:1.65}
.lesson p{margin:0 0 14px}
.lesson h3{font-family:var(--sans);font-size:19px;margin-top:30px;padding-top:6px}
.lesson h4{font-family:var(--sans)}
.lesson strong{font-weight:700}
.lesson ul{padding-left:22px;margin:0 0 14px}
.lesson table{font-family:var(--sans)}
.lesson blockquote{margin:14px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 18px;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.chain-step{background:var(--surface);border:1px solid var(--line);padding:10px 12px;position:relative}
.chain-step:first-child{border-radius:10px 0 0 10px}
.chain-step:last-child{border-radius:0 10px 10px 0}
.chain-step+.chain-step{border-left:none}
.chain-step+.chain-step::before{content:"→";position:absolute;left:-9px;top:50%;transform:translateY(-50%);background:var(--bg);color:var(--accent);font-weight:700;width:16px;text-align:center}
.chain-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:2px}
.mustknow{background:var(--mk);border:1px solid var(--mk-line);border-radius:12px;padding:16px 18px;margin:22px 0}
.mustknow h3{margin:0 0 8px;font-size:17px}
.mustknow ol{margin:0;padding-left:22px}
.mustknow li{margin:5px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.toc a{font-size:13.5px;padding:4px 10px;border-radius:99px;background:var(--surface2);text-decoration:none;color:var(--text)}
/* timeline */
.tl{position:relative;margin:12px 0;padding-left:0}
.tl-item{display:grid;grid-template-columns:118px 18px 1fr;align-items:start;min-height:34px}
.tl-year{text-align:right;padding-right:8px;font-weight:700;font-size:14px;color:var(--accent);padding-top:5px;font-variant-numeric:tabular-nums}
.tl-axis{position:relative;align-self:stretch}
.tl-axis::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-axis::after{content:"";position:absolute;left:4px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-item.key .tl-axis::after{background:var(--accent)}
.tl-text{padding:4px 0 10px 6px;font-size:15px}
.tl-item.key .tl-text{font-weight:600}
.tl.hide-dates .tl-year span{filter:blur(6px);cursor:pointer;user-select:none}
.tl.hide-dates .tl-year span.shown{filter:none}
.tl-gap{grid-column:1/-1;font-size:11px;color:var(--muted);padding-left:136px;margin:-4px 0 4px}
/* questions */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qstem{font-size:17.5px;line-height:1.5;margin:6px 0 12px;font-weight:500}
.qpass blockquote{margin:0 0 12px;padding:10px 14px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-family:var(--serif);font-size:16.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-text)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .why{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.opt.right .why,.opt.wrong .why{color:var(--text)}
.opt[disabled]{cursor:default}
.opt-body{flex:1}
.feedback{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.kbd{display:inline-block;font:600 12px/1 var(--sans);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--muted)}
.timer{font:700 20px/1 var(--sans);font-variant-numeric:tabular-nums;padding:7px 12px;border-radius:9px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:12px 0}
.qgrid button{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;position:relative}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qgrid button.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qgrid button.r-ok{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.r-bad{background:var(--bad-soft);border-color:var(--bad)}
/* flashcards */
.fc{perspective:1200px;margin:10px 0}
.fc-inner{position:relative;min-height:230px;transition:transform .35s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.fc-face.back{transform:rotateY(180deg)}
.fc-front{font-size:24px;font-weight:700;font-family:var(--serif)}
.fc-back{font-size:17px;line-height:1.5}
.fc-meta{position:absolute;top:10px;left:14px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.fc-inner{transition:none}}
.boxes{display:flex;gap:4px;align-items:flex-end;height:46px}
.boxes div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.boxes div.new{background:var(--line)}
/* readiness */
.meter{position:relative;height:16px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--warn),var(--ok));border-radius:99px}
.ready-badge{font-size:18px;font-weight:800;padding:8px 14px;border-radius:10px;display:inline-block}
.ready-badge.yes{background:var(--ok-soft);color:var(--ok)}
.ready-badge.no{background:var(--surface2);color:var(--muted)}
.checklist{list-style:none;padding:0;margin:10px 0 0}
.checklist li{padding:4px 0 4px 26px;position:relative}
.checklist li::before{content:"○";position:absolute;left:4px;color:var(--muted)}
.checklist li.y::before{content:"✓";color:var(--ok);font-weight:700}
/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=number],input[type=date],select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-height:42px}
/* cheat sheet */
.cheat{font-size:12.5px;line-height:1.35}
.cheat h2{font-size:15px;margin:10px 0 4px;border-bottom:2px solid var(--accent);padding-bottom:2px}
.cheat h3{font-size:13px;margin:8px 0 3px;color:var(--accent)}
.cheat-cols{columns:3 260px;column-gap:18px}
.cheat-cols>section{break-inside:avoid-column;margin-bottom:6px}
.cheat .ev{display:flex;gap:6px;padding:1px 0}
.cheat .ev b{flex:0 0 74px;text-align:right;font-variant-numeric:tabular-nums}
.cheat .pp{padding:1px 0}
.cheat table{font-size:11.5px}
.cheat th,.cheat td{padding:2px 4px}
.cheat .tblwrap{margin:4px 0}
.cheat.redraw .hideable{background:var(--surface2);color:transparent;border-radius:3px;cursor:pointer}
.cheat.redraw .hideable.shown{background:none;color:inherit}
.cheat.redraw .hideable *{color:transparent}
.cheat.redraw .hideable.shown *{color:inherit}
.verified{color:var(--ok)} .unverified{color:var(--warn)}
.footer-keys{margin-top:16px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
@media (max-width: 860px){
  .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px}
  .top .t{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap{padding:18px 16px 70px}
  h1{font-size:24px}
  .lesson{font-size:17px}
  .chain{grid-template-columns:1fr}
  .chain-step,.chain-step:first-child,.chain-step:last-child{border-radius:0;border-left:1px solid var(--line)!important}
  .chain-step:first-child{border-radius:10px 10px 0 0}
  .chain-step:last-child{border-radius:0 0 10px 10px}
  .chain-step+.chain-step{border-top:none}
  .chain-step+.chain-step::before{content:"↓";left:50%;top:-10px;transform:translateX(-50%)}
  .tl-item{grid-template-columns:86px 18px 1fr}
  .tl-gap{padding-left:104px}
  .tl-year{font-size:13px}
}
.scrim{display:none}
@media (max-width:860px){.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}}
@media print{
  @page{size:letter landscape;margin:.3in}
  body{background:#fff;color:#000;font-size:10pt}
  .side,.top,.noprint,.banner,.scrim{display:none!important}
  .wrap,.wrap.wide{max-width:none;padding:0}
  .card{box-shadow:none;border:none;padding:0;margin:0}
  .cheat{font-size:6.6pt;line-height:1.22;color:#000}
  .cheat h1{font-size:11pt;margin:0}
  .cheat h2{font-size:7.6pt;margin:3px 0 1px;border-bottom-width:1px;color:#000}
  .cheat h3{font-size:7pt;margin:3px 0 1px}
  .cheat-cols{columns:4;column-gap:10px}
  .cheat .ev b{flex-basis:50px}
  .cheat table{font-size:6.2pt}
  .cheat th,.cheat td{padding:0 2px;border-color:#bbb}
  .cheat .hideable{color:#000!important;background:none!important}
  .cheat .hideable *{color:#000!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div id="banner" class="banner hide"></div>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="top">
      <button class="btn sm" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="t" id="topTitle">CLEP Western Civ I</div>
      <button class="btn sm" data-act="theme" aria-label="Toggle dark mode">◐</button>
    </div>
    <main id="view" class="wrap" tabindex="-1"></main>
  </div>
</div>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const U = DATA.units, Q = DATA.questions;
const QBY = Object.fromEntries(Q.map(q => [q.id, q]));
const UBY = Object.fromEntries(U.map(u => [u.id, u]));
const LETTERS = "ABCDE";
const EXAM_MIN = DATA.outline.format.time_minutes.value || 90;
const READY_PCT = 75, RETAKE_PCT = 85, QUIZ_PASS = 70, SKIM_PCT = 75;
const BOX_DAYS = [0, 0, 1, 3, 7, 16]; // index = Leitner box (1..5)
const DAY = 864e5;

/* ---------------- storage (all access wrapped) ---------------- */
const KEY = "clepWC1.progress.v1";
let storageOK = true;
function defaults() {
  return { v: 1, theme: "auto", diag: null, diagCur: null, units: {}, cards: {}, mistakes: {}, exams: { 1: { attempts: [], cur: null }, 2: { attempts: [], cur: null } }, plan: { hpd: 1.5, date: "" }, created: Date.now() };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); return normalize(d); }
  } catch (e) { storageOK = false; }
  return defaults();
}
function normalize(d) {
  const s = Object.assign(defaults(), d || {});
  s.exams = Object.assign(defaults().exams, s.exams || {});
  for (const k of ["1", "2"]) s.exams[k] = Object.assign({ attempts: [], cur: null }, s.exams[k]);
  s.plan = Object.assign(defaults().plan, s.plan || {});
  return s;
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
  banner();
}
function banner() {
  const b = document.getElementById("banner");
  if (storageOK) { b.classList.add("hide"); return; }
  b.textContent = "Browser storage is blocked, so progress will be lost when you close this tab. Use Progress → Export to save a copy.";
  b.classList.remove("hide");
}
function uState(id) { return S.units[id] || (S.units[id] = { read: false, quiz: [] }); }

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtH = h => h < 1 ? Math.round(h * 60) + " min" : (Math.round(h * 10) / 10) + " h";
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoDate = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const view = document.getElementById("view");
let acts = {}, keys = null, cleanup = [];
function bar(p, cls = "") { return `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`; }
function scoreCls(p) { return p >= READY_PCT ? "ok" : p >= 60 ? "warn" : "bad"; }
function yearLabel(y) { return y < 0 ? Math.abs(y) + " BCE" : y + " CE"; }

/* ---------------- derived progress ---------------- */
function quizBest(id) { const a = uState(id).quiz; return a.length ? Math.max(...a.map(x => x.p)) : null; }
function unitDone(id) { const s = uState(id); const b = quizBest(id); return s.read && b !== null && b >= QUIZ_PASS; }
function unitRec(id) {
  if (!S.diag) return null;
  const r = S.diag.byUnit[id]; if (!r || !r.n) return null;
  return pct(r.c, r.n) >= SKIM_PCT ? "skim" : "study";
}
function cardStats(uid) {
  const cards = uid ? UBY[uid].cards : U.flatMap(u => u.cards);
  const now = Date.now(); let nw = 0, due = 0, mastered = 0, missed = 0; const boxes = [0, 0, 0, 0, 0, 0];
  for (const c of cards) {
    const s = S.cards[c.id];
    if (!s) { nw++; boxes[0]++; continue; }
    boxes[s.b]++; if (s.due <= now) due++; if (s.b >= 4) mastered++; if (s.lm) missed++;

}
function openMistakes(uid) { return Object.entries(S.mistakes).filter(([id, m]) => m.open && QBY[id] && (!uid || QBY[id].u === uid)); }
function examReady(n) {
  const a = S.exams[n].attempts;
  if (!a.length) return { ok: false, first: null };
  const first = a[0].score;
  const retake = a.slice(1).some(x => x.score >= RETAKE_PCT);
  return { ok: first >= READY_PCT || retake, first, best: Math.max(...a.map(x => x.score)) };
}
function hoursLeft() {
  let h = 0;
  if (!S.diag) h += 0.75;
  for (const u of U) {
    if (unitDone(u.id)) continue;
    let x = u.studyHours * (unitRec(u.id) === "skim" ? 0.5 : 1);
    if (uState(u.id).read) x *= 0.55;
    h += x;
  }
  const cs = cardStats();
  h += 3 * (1 - cs.mastered / cs.total);
  for (const n of ["1", "2"]) if (!S.exams[n].attempts.length) h += 2.5;
  if (!(S.exams[1].attempts.length && S.exams[2].attempts.length)) h += 1.5;
  h += openMistakes().length * 1.5 / 60;
  return h;
}
function readiness() {
  const done = U.filter(u => unitDone(u.id)).length;
  const cs = cardStats();
  const e1 = examReady(1), e2 = examReady(2);
  const parts = [
    { w: 5, v: S.diag ? 1 : 0, label: "Diagnostic taken" },
    { w: 40, v: U.reduce((a, u) => a + (unitDone(u.id) ? u.share : 0), 0) / U.reduce((a, u) => a + u.share, 0), label: `Units completed (${done}/${U.length})` },
    { w: 15, v: cs.mastered / cs.total, label: `Flashcards mastered, box 4+ (${cs.mastered}/${cs.total})` },
    { w: 20, v: e1.first === null ? 0 : e1.ok ? 1 : Math.min(0.99, e1.best / READY_PCT), label: `Practice exam 1 ≥ ${READY_PCT}%` + (e1.first !== null ? ` (first try ${e1.first}%)` : "") },
    { w: 20, v: e2.first === null ? 0 : e2.ok ? 1 : Math.min(0.99, e2.best / READY_PCT), label: `Practice exam 2 ≥ ${READY_PCT}%` + (e2.first !== null ? ` (first try ${e2.first}%)` : "") },
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.w * p.v, 0));
  return { score, parts, ready: e1.ok && e2.ok, e1, e2 };
}
function nextStep() {
  if (S.exams[1].cur || S.exams[2].cur) { const n = S.exams[1].cur ? 1 : 2; return { href: `#/exam/${n}`, label: `Resume Practice Exam ${n} (timer is running)` }; }

/* ---------------- question rendering ---------------- */
function qHTML(q, sel, reveal, opts = {}) {

    else if (i === sel) c = "sel";
    return `<button class="opt ${c}" data-act="pick" data-i="${i}" ${reveal ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span class="opt-body">${o}${reveal ? `<span class="why">${i === q.a ? "✓ " : "✗ "}${q.w[i]}</span>` : ""}</span></button>`;
  }).join("")}</div>`;
}
function keyIndex(e) {
  if (/^[1-5]$/.test(e.key)) return +e.key - 1;
  const k = e.key.toLowerCase(); const i = "abcde".indexOf(k);
  return k.length === 1 && i >= 0 ? i : -1;
}
function logMistake(q, k, drill) {
  const m = S.mistakes[q.id];
  if (k !== q.a) S.mistakes[q.id] = { n: (m ? m.n : 0) + 1, t: Date.now(), open: true, last: k };
  else if (m && drill) { m.open = false; m.fixed = Date.now(); }
}

/* ---------------- immediate-feedback session (unit quiz, mistake drill) ---------------- */
function practice({ title, qs, back, drill, onDone }) {
  let i = 0, sel = null; const res = [];
  function render() {
    const q = qs[i];
    const right = res.filter(r => r.ok).length;
    view.innerHTML = `
    <div class="qhead"><a href="${back}" class="small">← Back</a><span class="small muted">${esc(title)} · Question ${i + 1} of ${qs.length} · ${right} correct so far</span></div>
    ${bar(pct(i, qs.length))}
    <div class="card">${qHTML(q, sel, sel !== null)}
    ${sel !== null ? `<div class="feedback ${sel === q.a ? "ok" : "bad"}">${sel === q.a ? "Correct." : `Not quite. The answer is ${LETTERS[q.a]}.`} ${drill && sel === q.a ? "Cleared from your mistake log." : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" data-act="next">${i + 1 < qs.length ? "Next question" : "See results"} <span class="kbd">Enter</span></button></div>` : `<p class="small muted" style="margin:12px 0 0">Press <span class="kbd">1</span>–<span class="kbd">5</span> or click an answer.</p>`}
    </div>`;
  }
  function answer(k) {
    if (sel !== null) return;
    const q = qs[i]; sel = k; res.push({ id: q.id, k, ok: k === q.a });
    logMistake(q, k, drill); save(); render();
  }
  function next() {
    if (sel === null) return;
    i++; sel = null;
    if (i >= qs.length) { onDone(res); renderSide(); } else { render(); window.scrollTo(0, 0); }
  }
  acts.pick = el => answer(+el.dataset.i);
  acts.next = next;
  keys = e => { const k = keyIndex(e); if (k >= 0) { e.preventDefault(); answer(k); } else if (e.key === "Enter") { e.preventDefault(); next(); } };
  render();
}
function resultsByUnit(qs, answers) {
  const by = {};
  for (const q of qs) { const b = by[q.u] || (by[q.u] = { n: 0, c: 0 }); b.n++; if (answers[q.id] === q.a) b.c++; }
  return by;
}
function byUnitTable(by, extra) {
  return `<div class="tblwrap"><table><thead><tr><th>Unit</th><th>Weight</th><th>Score</th><th style="width:30%"></th>${extra ? "<th>Recommendation</th>" : ""}</tr></thead><tbody>
  ${U.filter(u => by[u.id]).map(u => { const b = by[u.id], p = pct(b.c, b.n);
    return `<tr><td><a href="#/unit/${u.id}">${esc(u.title)}</a></td><td>${u.share.toFixed(1)}%</td><td>${b.c}/${b.n} (${p}%)</td><td>${bar(p, scoreCls(p))}</td>${extra ? `<td>${extra(u, p)}</td>` : ""}</tr>`; }).join("")}
  </tbody></table></div>`;
}
function reviewList(qs, answers) {
  const missed = qs.filter(q => answers[q.id] !== q.a);
  if (!missed.length) return `<p>No misses. 🎉</p>`;
  return missed.map((q, n) => `<details class="card" id="rv-${q.id}" style="padding:12px 16px"><summary><b>${n + 1}.</b> ${q.q.replace(/<[^>]+>/g, "").slice(0, 120)}${q.q.length > 120 ? "…" : ""} <span class="chip bad">${answers[q.id] === undefined ? "blank" : "your answer " + LETTERS[answers[q.id]]}</span></summary><div style="margin-top:10px">${qHTML(q, answers[q.id], true)}</div></details>`).join("");
}

/* ---------------- deferred-feedback test (diagnostic + exams) ---------------- */
function testRunner({ title, ids, cur, timed, onSubmit, back }) {
  const qs = ids.map(id => QBY[id]);
  let showGrid = false, timer = null;
  function remaining() { return EXAM_MIN * 60000 - (Date.now() - cur.startedAt); }
  function render() {
    const q = qs[cur.idx], sel = cur.answers[q.id];
    const answered = Object.keys(cur.answers).length;
    view.innerHTML = `
    <div class="qhead">
      <div><b>${esc(title)}</b><div class="small muted">Question ${cur.idx + 1} of ${qs.length} · ${answered} answered</div></div>
      <div class="row">${timed ? `<span class="timer" id="timer"></span>` : `<a class="small" href="${back}">Save &amp; exit</a>`}</div>
    </div>
    ${bar(pct(answered, qs.length))}
    <div class="card">${qHTML(q, sel, false, { meta: false })}
      <div class="spread" style="margin-top:14px">
        <div class="row"><button class="btn" data-act="prev" ${cur.idx === 0 ? "disabled" : ""}>← Prev</button><button class="btn pri" data-act="nextq">${cur.idx + 1 < qs.length ? "Next →" : "Review"}</button></div>
        <div class="row"><button class="btn sm" data-act="flag">${cur.flags[q.id] ? "★ Flagged" : "☆ Flag"} <span class="kbd">F</span></button><button class="btn sm" data-act="grid">${showGrid ? "Hide" : "Show"} all questions</button></div>
      </div>
      ${showGrid || cur.idx + 1 === qs.length ? gridHTML() : ""}
      <div class="row" style="margin-top:14px"><button class="btn" data-act="submit">Submit ${esc(title.split(" ")[0] === "Practice" ? "exam" : "test")}</button><span class="small muted">${qs.length - answered} unanswered · ${Object.values(cur.flags).filter(Boolean).length} flagged</span></div>
    </div>`;
    tick();
  }
  function gridHTML() {
    return `<div class="qgrid">${qs.map((q, n) => `<button data-act="go" data-n="${n}" class="${cur.answers[q.id] !== undefined ? "ans" : ""} ${cur.flags[q.id] ? "flag" : ""} ${n === cur.idx ? "cur" : ""}" aria-label="Question ${n + 1}">${n + 1}</button>`).join("")}</div>`;
  }
  function tick() {
    if (!timed) return;
    const ms = remaining();
    if (ms <= 0) { submit(true); return; }
    const el = document.getElementById("timer");
    if (el) { const s = Math.ceil(ms / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; el.classList.toggle("low", s < 300); }
  }
  function go(n) { cur.idx = Math.max(0, Math.min(qs.length - 1, n)); save(); render(); window.scrollTo(0, 0); }
  function pick(k) { cur.answers[qs[cur.idx].id] = k; save(); render(); }
  function submit(auto) {
    if (!auto) {
      const left = qs.length - Object.keys(cur.answers).length;
      if (!confirm(left ? `You have ${left} unanswered question(s). Submit anyway?` : "Submit now?")) return;
    }
    if (timer) clearInterval(timer);
    keys = null;
    onSubmit(qs, auto);
  }
  acts.pick = el => pick(+el.dataset.i);
  acts.prev = () => go(cur.idx - 1);
  acts.nextq = () => go(cur.idx + 1);
  acts.go = el => go(+el.dataset.n);
  acts.flag = () => { const id = qs[cur.idx].id; cur.flags[id] = !cur.flags[id]; save(); render(); };
  acts.grid = () => { showGrid = !showGrid; render(); };
  acts.submit = () => submit(false);
  keys = e => {
    const k = keyIndex(e);
    if (k >= 0) { e.preventDefault(); pick(k); }
    else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); if (cur.idx + 1 < qs.length) go(cur.idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur.idx - 1); }
    else if (e.key.toLowerCase() === "f") { e.preventDefault(); acts.flag(); }
  };
  if (timed) { timer = setInterval(tick, 1000); cleanup.push(() => clearInterval(timer)); }
  render();
}

function cardSession(deck, scope) {
  let i = 0, flipped = false, got = 0, miss = 0; const requeued = new Set();
  function render() {
    if (i >= deck.length) {
      view.innerHTML = `<h1>Session done</h1><div class="card"><div class="stat">${got}/${got + miss}<small>remembered</small></div><p>Cards you missed are in box 1 and flagged for "Review missed only".</p>

      keys = null; renderSide(); return;
    }
    const c = deck[i], st = S.cards[c.id];
    view.innerHTML = `<div class="qhead"><a class="small" href="#/cards${scope ? "/" + scope : ""}">← End session</a><span class="small muted">Card ${i + 1} of ${deck.length} · ${esc(UBY[c.u].title)}</span></div>
    ${bar(pct(i, deck.length))}
    <div class="fc ${flipped ? "flip" : ""}" data-act="flip"><div class="fc-inner">
      <div class="fc-face"><span class="fc-meta">${st ? "Box " + st.b : "New"}</span><div class="fc-front">${c.f}</div><div class="small muted" style="margin-top:14px">tap or <span class="kbd">Space</span> to flip</div></div>
      <div class="fc-face back"><span class="fc-meta">${c.f.replace(/<[^>]+>/g, "")}</span><div class="fc-back">${c.b}</div></div>
    </div></div>
    <div class="row" style="justify-content:center;${flipped ? "" : "visibility:hidden"}">
      <button class="btn" data-act="grade" data-ok="0" style="border-color:var(--bad)">✗ Missed <span class="kbd">1</span></button>
      <button class="btn pri" data-act="grade" data-ok="1">✓ Got it <span class="kbd">2</span></button>
    </div>`;
  }
  function grade(ok) {
    if (!flipped) return;
    const c = deck[i], st = S.cards[c.id] || { b: 1, n: 0 };
    st.n = (st.n || 0) + 1;
    if (ok) { st.b = Math.min(5, (S.cards[c.id] ? st.b : 1) + 1); st.due = Date.now() + BOX_DAYS[st.b] * DAY; st.lm = false; got++; }
    else { st.b = 1; st.due = Date.now(); st.lm = true; miss++; if (!requeued.has(c.id)) { requeued.add(c.id); deck.push(c); } }
    S.cards[c.id] = st; save();
    i++; flipped = false; render();
  }
  acts.flip = () => { flipped = !flipped; render(); };
  acts.grade = (el, e) => { e.stopPropagation(); grade(el.dataset.ok === "1"); };
  keys = e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!flipped) { flipped = true; render(); } else if (e.key === "Enter") grade(true); }
    else if (e.key === "1") grade(false);
    else if (e.key === "2") grade(true);
  };
  render();
}

}
function buildPlan(hpd, examDate) {
  const start = today0(), end = new Date(examDate + "T00:00:00");
  const days = Math.round((end - start) / DAY); // study days before exam day
  if (!(hpd > 0) || isNaN(days)) return { err: "Enter hours per day and an exam date." };
  if (days < 1) return { err: "Pick an exam date at least 1 day from today." };
  const reviewDaily = Math.min(0.25, hpd * 0.2);
  const exams = [1, 2].filter(n => !S.exams[n].attempts.length);
  const tail = []; // last days: exams
  exams.forEach(n => tail.push([{ h: 1.5, label: `Practice Exam ${n}: timed, 90 min, no pausing`, href: `#/exam/${n}` }, { h: 1, label: `Review Exam ${n} misses: drill mistake log and weakest topics`, href: "#/mistakes" }]));
  const tailDays = Math.min(tail.length, days);
  const studyDays = days - tailDays;
  const tasks = planTasks();
  const plan = [];
  for (let d = 0; d < days; d++) plan.push({ date: new Date(start.getTime() + d * DAY), items: [], h: 0 });
  // split tasks so they can fit across days
  const cap = Math.max(0.25, hpd - reviewDaily);
  const queue = [];
  tasks.forEach(t => { let left = t.h, part = 1; const parts = Math.ceil(t.h / cap - 1e-9);
    while (left > 1e-6) { const h = Math.min(left, cap); queue.push({ h, label: parts > 1 ? `${t.label} (part ${part}/${parts})` : t.label, href: t.href }); left -= h; part++; } });
  let d = 0, overflow = 0;
  for (const t of queue) {
    while (d < studyDays && plan[d].h + t.h > cap + 1e-6 && plan[d].h > 0) d++;
    if (d >= studyDays) { overflow += t.h; (plan[Math.max(0, studyDays - 1)] || plan[0]).items.push(Object.assign({ over: true }, t)); continue; }
    plan[d].items.push(t); plan[d].h += t.h;
  }
  // fill remaining study days with review
  for (let k = 0; k < studyDays; k++) {
    if (plan[k].h < cap - 0.2 && k > d) plan[k].items.push({ h: Math.min(1, cap - plan[k].h), label: "Buffer: drill mistake log, redraw the cheat sheet timeline", href: "#/mistakes" });
  }
  // exams on last days (1–2 days before exam)
  tail.forEach((items, k) => {
    const late = k >= tailDays, day = plan[days - tailDays + Math.min(k, tailDays - 1)];
    items.forEach(t => { day.items.push(late ? Object.assign({ over: true }, t) : t); day.h += t.h; });
    if (late) overflow += 2.5;
  });
  // daily flashcards + final day cheat sheet
  plan.forEach(p => { p.items.unshift({ h: reviewDaily, label: "Flashcards: review due cards", href: "#/cards" }); });
  plan[days - 1].items.push({ h: 0.5, label: "Final: redraw cheat sheet from memory; no new material", href: "#/cheatsheet" });
  const need = tasks.reduce((a, t) => a + t.h, 0) + exams.length * 2.5;
  return { plan, days, need, have: days * hpd, overflow };
}
function planPage() {
  setTitle("Study plan");
  const def = S.plan.date || isoDate(new Date(Date.now() + 21 * DAY));
  view.innerHTML = `<h1>Study plan generator</h1>
  <p class="sub">Builds a day-by-day schedule from what you have left (it uses your diagnostic: skim units get half the time). Practice exams land on the last 1–2 days before your test.</p>
  <div class="card noprint"><div class="row">
    <div><label class="f" for="hpd">Hours per day</label><input type="number" id="hpd" min="0.25" max="12" step="0.25" value="${S.plan.hpd}"></div>
    <div><label class="f" for="edate">Exam date</label><input type="date" id="edate" value="${def}" min="${isoDate(new Date(Date.now() + DAY))}"></div>
    <div style="align-self:flex-end" class="row"><button class="btn pri" data-act="gen">Generate plan</button><button class="btn" data-act="print">Print</button></div>
  </div><p class="small muted" style="margin:10px 0 0">Estimated work remaining: <b>${fmtH(hoursLeft())}</b>.</p></div>
  <div id="planOut"></div>`;
  const gen = () => {
    S.plan.hpd = parseFloat($("#hpd").value); S.plan.date = $("#edate").value; save();
    const r = buildPlan(S.plan.hpd, S.plan.date);
    if (r.err) { $("#planOut").innerHTML = `<div class="card">${esc(r.err)}</div>`; return; }
    const tight = r.overflow > 0.01;
    $("#planOut").innerHTML = `<div class="card ${tight ? "" : ""}">
      <b>${r.days} study day${r.days > 1 ? "s" : ""}</b> before ${new Date(S.plan.date + "T00:00:00").toDateString()} · you have ~${fmtH(r.have)}, the plan needs ~${fmtH(r.need + r.days * Math.min(0.25, S.plan.hpd * .2))}.
      ${tight ? `<p class="feedback bad">Not enough time: about ${fmtH(r.overflow)} doesn't fit (marked ⚠). Raise hours per day to ~${(Math.ceil((r.need / r.days + 0.25) * 4) / 4).toFixed(2)} or move the exam date.</p>` : `<p class="feedback ok">Fits. Follow it in order; if you fall behind, regenerate.</p>`}
    </div>
    <div class="card" style="padding:6px 12px"><div class="tblwrap" style="margin:0"><table><thead><tr><th style="width:120px">Day</th><th>Tasks</th><th style="width:70px">Time</th></tr></thead><tbody>
    ${r.plan.map((p, k) => `<tr><td><b>Day ${k + 1}</b><div class="small muted">${p.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div></td>
      <td>${p.items.map(t => `<div>${t.over ? "⚠ " : ""}<a href="${t.href}">${esc(t.label)}</a> <span class="small muted">${fmtH(t.h)}</span></div>`).join("")}</td>
      <td>${fmtH(p.items.reduce((a, t) => a + t.h, 0))}</td></tr>`).join("")}
    <tr><td><b>Exam day</b><div class="small muted">${new Date(S.plan.date + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div></td><td>Light flashcard warm-up only. Bring ID; ~45 s per question; answer every item.</td><td></td></tr>
    </tbody></table></div></div>`;
  };
  acts.gen = gen; acts.print = () => window.print();
  if (S.plan.date) gen();
}

/* ---------------- progress & data ---------------- */
function progressPage() {
  setTitle("Progress & data");
  const cs = cardStats();
  view.innerHTML = `<h1>Progress</h1>
  <div class="grid g3">
    <div class="card"><div class="stat">${U.filter(u => unitDone(u.id)).length}/${U.length}<small>units completed</small></div></div>
    <div class="card"><div class="stat">${fmtH(hoursLeft())}<small>estimated hours left</small></div></div>
    <div class="card"><div class="stat">${cs.mastered}/${cs.total}<small>flashcards mastered (box 4+)</small></div></div>
  </div>
  ${unitTable()}
  <h2>Quiz history</h2><div class="card" style="padding:6px 12px"><table><thead><tr><th>Unit</th><th>Attempts</th><th>Last</th><th>Best</th></tr></thead><tbody>
  ${U.map(u => { const a = uState(u.id).quiz; return `<tr><td>${esc(u.title)}</td><td>${a.length}</td><td>${a.length ? a[a.length - 1].p + "%" : "—"}</td><td>${a.length ? quizBest(u.id) + "%" : "—"}</td></tr>`; }).join("")}
  </tbody></table></div>
  <h2>Practice exams</h2><div class="card">${[1, 2].map(n => { const a = S.exams[n].attempts; return `<div>Exam ${n}: ${a.length ? a.map(x => x.score + "%").join(" → ") : "not taken"}</div>`; }).join("")}</div>
  <h2>Save or move your progress</h2>
  <div class="card"><p class="small">Progress is stored in this browser${storageOK ? "" : " (<b>currently blocked</b>, so export before closing!)"}. Export a JSON file to back it up or move it to another device.</p>
  <div class="row"><button class="btn pri" data-act="exp">Export progress (.json)</button><label class="btn">Import progress…<input type="file" id="imp" accept="application/json,.json" class="hide"></label><button class="btn" data-act="reset" style="color:var(--bad)">Reset everything</button></div>
  <p class="small muted" id="impMsg"></p></div>`;
  acts.exp = () => {
    const blob = new Blob([JSON.stringify({ app: "clep-wc1-study-guide", exported: new Date().toISOString(), state: S }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `clep-wc1-progress-${isoDate(new Date())}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  $("#imp").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); const st = d && d.state ? d.state : d;
        if (!st || typeof st !== "object" || !("units" in st) || !("exams" in st)) throw new Error("not a progress file");
        if (!confirm("Replace your current progress with this file?")) return;
        S = normalize(st); save(); applyTheme(); route();
      } catch (err) { $("#impMsg").textContent = "Import failed: " + err.message; }
    };
    rd.readAsText(f);
  };
  acts.reset = () => { if (confirm("Erase ALL progress (diagnostic, quizzes, cards, mistakes, exams)? Export first if unsure.")) { S = defaults(); save(); route(); } };
}

/* ---------------- about ---------------- */
function aboutPage() {
  setTitle("About this exam");
  const o = DATA.outline, f = o.format;
  const badge = v => v ? '<span class="verified small">✓ verified</span>' : '<span class="unverified small">⚠ unverified</span>';
  const counts = U.map(u => ({ u, q: Q.filter(q => q.u === u.id).length, c: u.cards.length, w: u.words }));
  const tq = counts.reduce((a, x) => a + x.q, 0), tc = counts.reduce((a, x) => a + x.c, 0);
  view.innerHTML = `<h1>About this exam</h1>
  <div class="card"><h3 style="margin-top:0">${esc(o.exam)}</h3>
  <table><tbody>
    <tr><td>Questions</td><td>${esc(f.questions.value)} ${badge(f.questions.verified)} <div class="small muted">${esc(f.questions.note || "")}</div></td></tr>
    <tr><td>Time</td><td>${f.time_minutes.value} minutes ${badge(f.time_minutes.verified)}</td></tr>
    <tr><td>Format</td><td>${esc(f.question_type.value)} ${badge(f.question_type.verified)}</td></tr>
    <tr><td>Passing score</td><td>${esc(f.scaled_passing_score.value)} ${badge(f.scaled_passing_score.verified)}</td></tr>
    <tr><td>Credit</td><td>${esc(f.credit_recommendation.value)} ${badge(f.credit_recommendation.verified)}</td></tr>
  </tbody></table>
  <p class="small">Source: ${o.source_urls.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("<br>")}</p>
  <p class="small muted">${esc(o.verification_note)} Retrieved ${esc(o.retrieved)}. Check the official page before booking: College Board revises outlines occasionally.</p></div>
  <h2>Official outline &amp; weights</h2>
  <div class="card" style="padding:6px 12px"><table><thead><tr><th>Topic</th><th>Weight</th><th>Subtopics</th></tr></thead><tbody>
  ${o.topics.map(t => `<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.weight)} ${badge(t.verified)}</td><td class="small">${t.subtopics.map(s => `${esc(s.name)} ${s.verified ? "" : '<span class="unverified">⚠ unverified</span>'}`).join("<br>")}</td></tr>`).join("")}
  </tbody></table></div>
  <h2>Content budget vs. official weights</h2>
  <div class="card" style="padding:6px 12px"><div class="tblwrap" style="margin:0"><table><thead><tr><th>Unit</th><th>Target share</th><th>Lesson words</th><th>Questions</th><th>% of bank</th><th>Flashcards</th><th>% of cards</th></tr></thead><tbody>
  ${counts.map(x => `<tr><td>${esc(x.u.title)}</td><td>${x.u.share.toFixed(1)}%</td><td>${x.w}</td><td>${x.q}</td><td>${(100 * x.q / tq).toFixed(1)}%</td><td>${x.c}</td><td>${(100 * x.c / tc).toFixed(1)}%</td></tr>`).join("")}
  <tr><td><b>Total</b></td><td>100%</td><td>${counts.reduce((a, x) => a + x.w, 0)}</td><td><b>${tq}</b></td><td></td><td><b>${tc}</b></td><td></td></tr></tbody></table></div>
  <p class="small muted">Shares use the midpoint of each official range, normalized to 100%. Medieval History (23–27%) is split into two equal units. Question pools never overlap: diagnostic ${DATA.pools.diag.length}, unit quizzes ${Q.filter(q => q.pool === "quiz").length}, Practice Exam 1 ${DATA.pools.pe1.length}, Practice Exam 2 ${DATA.pools.pe2.length}.</p></div>
  <h2>How to use this guide</h2>
  <div class="card"><ol>
    <li>Take the <a href="#/diagnostic">diagnostic</a> (25 min). It sorts units into <b>skim</b> and <b>must study</b>.</li>
    <li>Generate a <a href="#/plan">study plan</a> from your hours per day and exam date.</li>
    <li>For each unit: lesson → must-know box → timeline → quiz (aim ≥ ${QUIZ_PASS}%) → flashcards.</li>
    <li>Review due <a href="#/cards">flashcards</a> daily (5–15 min) and drill your <a href="#/mistakes">mistake log</a>.</li>
    <li>Take <a href="#/exam/1">Practice Exam 1</a> and <a href="#/exam/2">2</a> in the last 1–2 days. Book when both are ≥ ${READY_PCT}%.</li>
  </ol>
  <p class="small muted">All questions, lessons, and cards are original study material, not official College Board items. Built ${esc(DATA.built)}. Works offline; nothing is sent anywhere.</p></div>`;
}

banner();

for (const n of ["1", "2"]) { const c = S.exams[n].cur; if (c && Date.now() - c.startedAt >= EXAM_MIN * 60000 && location.hash.indexOf("#/exam/" + n) !== 0) location.hash = "#/exam/" + n; }
route();
